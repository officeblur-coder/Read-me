<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romanian Party Night – Breeze</title>
<style>
  @font-face{font-family:'Anton';src:url(assets/anton.woff2) format('woff2');font-weight:400;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Anton';src:url(assets/anton-ext.woff2) format('woff2');font-weight:400;
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'Montserrat';src:url(assets/montserrat.woff2) format('woff2');font-weight:800;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Montserrat';src:url(assets/montserrat-ext.woff2) format('woff2');font-weight:800;
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;flex:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   ROMANIAN PARTY NIGHT – Breeze by the Lake
   Totul e desenat pe un singur canvas, în funcție de timpul t (secunde).
   ?format=feed  -> 1080x1350 (4:5)   implicit -> 1080x1920 (9:16)
   ?capture      -> nu pornește animația; se apelează window.renderFrame(t)
   ===================================================================== */
const EVENT = {
  day:  'SÂMBĂTĂ',
  date: '17 OCTOMBRIE',
  time: '22:00',
  phone:'0742 549 011',
};
const DURATION = 15;   // secunde într-o buclă
const BPM = 124;

const params = new URLSearchParams(location.search);
const FEED = params.get('format') === 'feed';
const CAPTURE = params.has('capture');
const W = 1080, H = FEED ? 1350 : 1920;

const L = FEED ? {
  logoY:118, logoW:430,
  t1Y:338, t1Size:168, t2Y:452, t2Size:112, barY:484,
  dancer:{x:540, y:872, s:0.72},
  dayY:1018, dateY:1118, dateSize:104, timeY:1180, rsvpY:1264, rsvpH:84,
  floorY:1236,
} : {
  logoY:225, logoW:580,
  t1Y:512, t1Size:208, t2Y:648, t2Size:140, barY:690,
  dancer:{x:540, y:1135, s:.84},
  dayY:1500, dateY:1622, dateSize:124, timeY:1700, rsvpY:1790, rsvpH:96,
  floorY:1560,
};

const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();
addEventListener('click', () => document.documentElement.requestFullscreen?.());

/* ---------- utilities ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const smooth = k => k * k * (3 - 2 * k);
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V = (x, y) => ({x, y});
const add = (a, b) => V(a.x + b.x, a.y + b.y);
const sub = (a, b) => V(a.x - b.x, a.y - b.y);
const mul = (a, k) => V(a.x * k, a.y * k);
const rot = (p, a) => V(p.x * Math.cos(a) - p.y * Math.sin(a), p.x * Math.sin(a) + p.y * Math.cos(a));
const mix = (a, b, k) => V(lerp(a.x, b.x, k), lerp(a.y, b.y, k));
const len = p => Math.hypot(p.x, p.y);
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* beat helpers: pulse = 1 on the beat, decays fast */
const beatOf = t => t * BPM / 60;
const pulse = (t, sharp = 6) => Math.exp(-sharp * (beatOf(t) % 1));

/* ---------- assets ---------- */
const logo = new Image(); logo.src = 'assets/logo.png';

/* ---------- background: faceted shards like the brand background ---------- */
const shards = (() => {
  const r = rng(7), cols = 8, rows = FEED ? 10 : 14, pad = 160;
  const pts = [];
  for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) {
    const edge = i === 0 || j === 0 || i === cols || j === rows;
    pts.push(V(-pad + i * (W + 2 * pad) / cols + (edge ? 0 : (r() - .5) * 120),
               -pad + j * (H + 2 * pad) / rows + (edge ? 0 : (r() - .5) * 120)));
  }
  const tris = [];
  const P = (i, j) => pts[j * (cols + 1) + i];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const a = P(i, j), b = P(i + 1, j), c = P(i + 1, j + 1), d = P(i, j + 1);
    const pair = r() < .5 ? [[a, b, c], [a, c, d]] : [[a, b, d], [b, c, d]];
    for (const tri of pair) {
      const n = [r() - .5, r() - .5, .55 + r() * .45]; const m = Math.hypot(...n);
      tris.push({p: tri, n: n.map(v => v / m), cx: (tri[0].x + tri[1].x + tri[2].x) / 3, cy: (tri[0].y + tri[1].y + tri[2].y) / 3});
    }
  }
  return tris;
})();

function drawShards(t){
  const lx = Math.cos(t * .35) * .7, ly = Math.sin(t * .27) * .5 - .2;
  const lm = Math.hypot(lx, ly, .7);
  const sx = W * .5 + Math.sin(t * .31) * 380, sy = H * .32 + Math.cos(t * .23) * 260;
  ctx.save();
  ctx.lineJoin = 'round';
  for (const s of shards) {
    const d = Math.max(0, (s.n[0] * lx + s.n[1] * ly + s.n[2] * .7) / lm);
    const fall = Math.exp(-((s.cx - sx) ** 2 + (s.cy - sy) ** 2) / (2 * 480 ** 2));
    const b = Math.pow(d, 5) * (.12 + .88 * fall);
    const R = 7 + 78 * b, G = 2 + 30 * b, B = 9 + 62 * b;
    ctx.fillStyle = `rgb(${R|0},${G|0},${B|0})`;
    ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.p[0].x, s.p[0].y); ctx.lineTo(s.p[1].x, s.p[1].y); ctx.lineTo(s.p[2].x, s.p[2].y); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- haze sprites ---------- */
const hazeSprite = (() => {
  const c = makeCanvas(512, 512), g = c.getContext('2d'), r = rng(3);
  for (let i = 0; i < 70; i++) {
    const x = 256 + (r() - .5) * 300, y = 256 + (r() - .5) * 200, rad = 60 + r() * 140;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(255,255,255,.07)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  }
  return c;
})();
function tintedSprite(src, color){
  const c = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
const hazeRed = tintedSprite(hazeSprite, '#ff2a3c');
const hazeMag = tintedSprite(hazeSprite, '#b02cff');
const hazeWhite = hazeSprite;

/* ---------- grain ---------- */
const grains = [0, 1, 2, 3].map(k => {
  const c = makeCanvas(360, 640), g = c.getContext('2d'), id = g.createImageData(360, 640), r = rng(100 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
});

/* ---------- particles (glitter / dust in the lights) ---------- */
const particles = (() => { const r = rng(11); return Array.from({length: 150}, () => ({
  x: r() * W, y: r() * H, z: .3 + r() * .9, sp: 20 + r() * 50, ph: r() * 6.28, tw: 1 + r() * 4, warm: r() < .35 })); })();

/* ---------- lasers ---------- */
const FIXTURES = [
  {x: W * .08, c: '255,30,50'}, {x: W * .3, c: '255,40,90'}, {x: W * .5, c: '220,40,255'},
  {x: W * .7, c: '255,40,90'}, {x: W * .92, c: '255,30,50'},
];
function drawBeam(x, y, ang, length, w0, w1, rgb, a){
  const ex = x + Math.sin(ang) * length, ey = y + Math.cos(ang) * length;
  const nx = Math.cos(ang), ny = -Math.sin(ang);
  const g = ctx.createLinearGradient(x, y, ex, ey);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(.55, `rgba(${rgb},${a * .35})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x + nx * w0, y + ny * w0); ctx.lineTo(ex + nx * w1, ey + ny * w1);
  ctx.lineTo(ex - nx * w1, ey - ny * w1); ctx.lineTo(x - nx * w0, y - ny * w0); ctx.closePath(); ctx.fill();
}
function drawLasers(t, on){
  if (on <= 0) return;
  const p = pulse(t, 4);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const len = H * 1.4;
  FIXTURES.forEach((f, i) => {
    const y = -30;
    for (let k = 0; k < 3; k++) {
      const base = (k - 1) * .32 + (f.x < W / 2 ? .25 : -.25) * (i === 2 ? 0 : 1);
      const ang = base + Math.sin(t * (.7 + i * .13) + i * 1.7 + k) * .38;
      const flick = .75 + .25 * Math.sin(t * 9 + i * 3 + k * 2);
      const a = on * flick * (.5 + .5 * p);
      drawBeam(f.x, y, ang, len, 6, 150, f.c, .10 * a);
      drawBeam(f.x, y, ang, len, 2, 34, f.c, .22 * a);
      drawBeam(f.x, y, ang, len, .6, 5, '255,220,230', .35 * a);
    }
  });
  ctx.restore();
}
function drawFixtures(t, on){
  if (on <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  FIXTURES.forEach((f, i) => {
    const a = on * (.65 + .35 * Math.sin(t * 7 + i));
    const g = ctx.createRadialGradient(f.x, 0, 0, f.x, 0, 120);
    g.addColorStop(0, `rgba(255,240,250,${a})`); g.addColorStop(.12, `rgba(${f.c},${a * .9})`); g.addColorStop(1, `rgba(${f.c},0)`);
    ctx.fillStyle = g; ctx.fillRect(f.x - 120, -120, 240, 240);
    // anamorphic streak
    const s = ctx.createLinearGradient(f.x - 340, 0, f.x + 340, 0);
    s.addColorStop(0, 'rgba(255,60,120,0)'); s.addColorStop(.5, `rgba(255,120,170,${a * .5})`); s.addColorStop(1, 'rgba(255,60,120,0)');
    ctx.fillStyle = s; ctx.fillRect(f.x - 340, -3, 680, 6);
  });
  ctx.restore();
}

/* ---------- bokeh string lights (like inside the club) ---------- */
function drawBokeh(t, on){
  if (on <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const y0 = L.dancer.y - 330 * L.dancer.s;
  for (let row = 0; row < 2; row++) {
    const n = 11, yy = y0 + row * 70 * L.dancer.s;
    for (let i = 0; i < n; i++) {
      const x = (i + .5 + row * .5) * W / n + Math.sin(t * .2 + row) * 20;
      const y = yy + Math.sin(i * 1.3 + row) * 10;
      const r = (row ? 26 : 18) * (1 + .15 * Math.sin(t * 2 + i));
      const a = on * (row ? .22 : .35) * (.7 + .3 * Math.sin(t * 3.1 + i * 2.2));
      const warm = (i + row) % 3 === 0 ? '255,70,90' : '255,190,140';
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${warm},${a})`); g.addColorStop(.65, `rgba(${warm},${a * .55})`); g.addColorStop(1, `rgba(${warm},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

function drawHaze(t, on){
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const layers = [
    {s: hazeRed, x: W * .15, y: H * .45, sc: 3.0, sp: .05, a: .3},
    {s: hazeMag, x: W * .9, y: H * .36, sc: 2.8, sp: -.04, a: .28},
    {s: hazeWhite, x: W * .5, y: H * .12, sc: 3.2, sp: .03, a: .18},
    {s: hazeRed, x: W * .5, y: L.floorY, sc: 3.4, sp: .06, a: .35},
  ];
  layers.forEach((l, i) => {
    const sz = 512 * l.sc, dx = Math.sin(t * l.sp * 6 + i) * 120 + t * l.sp * 60;
    ctx.globalAlpha = l.a * on;
    ctx.drawImage(l.s, l.x - sz / 2 + dx, l.y - sz / 2 + Math.cos(t * .2 + i) * 40, sz, sz);
  });
  ctx.restore();
}

/* =====================================================================
   DANSATOAREA – siluetă construită dintr-un schelet animat (fără față)
   coordonate locale: șold (0,0), picioare la y≈+505, cap la y≈-475
   ===================================================================== */
function ik(a, b, l1, l2, side){
  const d0 = sub(b, a); let d = len(d0);
  d = clamp(d, Math.abs(l1 - l2) + 1, l1 + l2 - .5);
  const dir = Math.atan2(d0.y, d0.x);
  const ang = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const e1 = add(a, V(Math.cos(dir + ang) * l1, Math.sin(dir + ang) * l1));
  const e2 = add(a, V(Math.cos(dir - ang) * l1, Math.sin(dir - ang) * l1));
  const end = add(a, V(Math.cos(dir) * d, Math.sin(dir) * d));
  return {mid: (e1.x * side > e2.x * side) ? e1 : e2, end};
}

function headOf(t){
  const ph = beatOf(t) * Math.PI, s = Math.sin(ph);
  const hip = V(36 * s, 14 * s * s);
  const ta = -.09 * s + .03 * Math.sin(ph * .5);
  const sc = add(hip, rot(V(0, -330), ta));
  const cr = .1 * s;
  const hr = cr - .2 * Math.sin(ph + .6) + .08 * Math.sin(ph * .25);
  const neck = add(sc, rot(V(0, -14), cr));
  return {c: add(neck, rot(V(0, -76), hr)), hr, neck};
}

const MODES = ['A', 'C', 'B', 'D'];
function handTargets(mode, ph, hip, pt, sc, head){
  const s = Math.sin(ph), half = ph * .5;
  switch (mode) {
    case 'A': return {   // brațul drept sus, mâna stângă pe șold
      R: add(head, V(78 + 26 * Math.cos(half), -150 + 20 * Math.sin(ph))),
      L: add(hip, rot(V(-100, -55), pt)),
    };
    case 'B': return {   // ambele brațe sus, încheieturi încrucișate
      R: add(head, V(40 + 18 * s, -168 + 10 * Math.cos(ph))),
      L: add(head, V(-40 + 18 * s, -160 - 10 * Math.cos(ph))),
    };
    case 'C': return {   // mâna pe piept (ca în poza din club), brațul drept liber
      L: add(sc, V(26, 92)),
      R: add(hip, V(150 + 30 * s, 30 + 20 * Math.cos(ph))),
    };
    default: return {    // mâna dreaptă în păr, stânga sus
      R: add(head, V(58, -46)),
      L: add(head, V(-92 + 20 * Math.sin(half), -165 + 14 * s)),
    };
  }
}

function pose(t){
  const b = beatOf(t), ph = b * Math.PI, s = Math.sin(ph);
  const hip = V(36 * s, 14 * s * s);
  const pt = -.17 * s;
  const ta = -.09 * s + .03 * Math.sin(ph * .5);
  const cr = .1 * s;
  const sc = add(hip, rot(V(0, -330), ta));
  const hd = headOf(t);
  const head = hd.c;

  // pose cycle (8 beats each) with soft blending
  const seg = b / 8, mi = Math.floor(seg) % MODES.length, nextI = (mi + 1) % MODES.length;
  const bl = smooth(clamp((seg % 1 - .84) / .16));
  const h1 = handTargets(MODES[mi], ph, hip, pt, sc, head);
  const h2 = handTargets(MODES[nextI], ph, hip, pt, sc, head);
  const handR = mix(h1.R, h2.R, bl), handL = mix(h1.L, h2.L, bl);

  const shR = add(sc, add(rot(V(76, 0), cr), V(0, 16)));
  const shL = add(sc, add(rot(V(-76, 0), cr), V(0, 16)));
  const armR = ik(shR, handR, 168, 158, 1);
  const armL = ik(shL, handL, 168, 158, -1);

  const hipJL = add(hip, rot(V(-56, 26), pt)), hipJR = add(hip, rot(V(56, 26), pt));
  const liftL = Math.max(0, -s) ** 2, liftR = Math.max(0, s) ** 2;
  const footL = V(-70 + 20 * liftL, 505 - 34 * liftL);
  const footR = V(70 - 20 * liftR, 505 - 34 * liftR);
  const legL = ik(hipJL, footL, 242, 236, 1);
  const legR = ik(hipJR, footR, 242, 236, -1);

  return {hip, pt, sc, cr, ta, head, hr: hd.hr, neck: hd.neck, shL, shR, armL, armR, hipJL, hipJR, legL, legR, footL, footR, liftL, liftR, t};
}

/* smooth closed/open curve through points */
function curve(g, pts, closed){
  const n = pts.length;
  const P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  g.moveTo(pts[0].x, pts[0].y);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    g.bezierCurveTo(p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6, p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6, p2.x, p2.y);
  }
  if (closed) g.closePath();
}
/* tapered limb between a and b, widths given at fractions along it */
function limb(g, a, b, prof){
  const d = sub(b, a), l = len(d) || 1, n = V(-d.y / l, d.x / l);
  const left = [], right = [];
  for (const [f, w] of prof) {
    const p = add(a, mul(d, f));
    left.push(add(p, mul(n, w / 2))); right.push(sub(p, mul(n, w / 2)));
  }
  g.beginPath();
  curve(g, [...left, ...right.reverse()], true);
  g.fill();
}

function dressPath(P){
  const pf = p => add(P.hip, rot(p, P.pt));
  const cf = p => add(P.sc, rot(p, P.cr));
  const wc = mix(P.hip, P.sc, .38), wr = lerp(P.pt, P.cr, .5);
  const wf = p => add(wc, rot(p, wr));
  const side = sd => [cf(V(sd * 22, -8)), cf(V(sd * 58, 4)), cf(V(sd * 84, 22)), cf(V(sd * 76, 68)),
                      cf(V(sd * 84, 116)), cf(V(sd * 70, 160)), wf(V(sd * 54, 0)), pf(V(sd * 86, -44)),
                      pf(V(sd * 106, 24)), pf(V(sd * 98, 96)), pf(V(sd * 84, 150))];
  const path = new Path2D();
  curve(path, [...side(-1), pf(V(0, 156)), ...side(1).reverse()], true);
  return path;
}

function drawDancer(g, P){
  // dress / torso
  g.fill(dressPath(P));
  // neck
  limb(g, P.sc, P.neck, [[0, 46], [1, 34]]);
  limb(g, P.neck, P.head, [[0, 34], [.5, 32], [1, 30]]);
  // head
  g.save(); g.translate(P.head.x, P.head.y); g.rotate(P.hr);
  g.beginPath(); g.ellipse(0, 0, 37, 49, 0, 0, 7); g.fill();
  g.restore();
  // hair (lags behind the head)
  const prev = headOf(P.t - .16), prev2 = headOf(P.t - .28);
  const lag = mul(sub(prev.c, P.head), 1.7), lag2 = mul(sub(prev2.c, P.head), 1.3);
  const hf = p => add(P.head, rot(p, P.hr));
  const lock = sd => {
    const tip = add(add(P.head, V(sd * 50, 262)), lag2);
    return {
      outer: [hf(V(sd * 46, -38)), hf(V(sd * 56, 4)), add(hf(V(sd * 60, 62)), mul(lag, .5)), add(hf(V(sd * 66, 150)), lag), tip],
      inner: [add(tip, V(-sd * 16, -14)), add(hf(V(sd * 40, 160)), mul(lag, .8)), hf(V(sd * 34, 60))],
      tip,
    };
  };
  const hl = lock(-1), hr = lock(1);
  const hair = new Path2D();
  curve(hair, [hf(V(0, -58)), ...hl.outer, ...hl.inner, hf(V(0, 30)), ...hr.inner.reverse(), ...hr.outer.reverse()], true);
  g.fill(hair);
  // loose wisps along the outer edge
  g.save(); g.lineCap = 'round'; g.lineWidth = 3.5;
  for (const [sd, lk] of [[-1, hl], [1, hr]]) for (let i = 0; i < 3; i++) {
    const start = hf(V(sd * 52, 10 + i * 14));
    const mid = add(hf(V(sd * (74 + i * 5), 120 + i * 8)), lag);
    const end = add(lk.tip, V(sd * (8 + i * 9), -18 + i * 16));
    g.beginPath(); g.moveTo(start.x, start.y); g.quadraticCurveTo(mid.x, mid.y, end.x, end.y); g.stroke();
  }
  g.restore();
  // arms
  for (const [sh, arm] of [[P.shL, P.armL], [P.shR, P.armR]]) {
    limb(g, sh, arm.mid, [[0, 40], [.35, 36], [1, 25]]);
    limb(g, arm.mid, arm.end, [[0, 26], [.3, 27], [1, 17]]);
    const dir = sub(arm.end, arm.mid), dl = len(dir) || 1;
    const tip = add(arm.end, mul(dir, 58 / dl));
    limb(g, arm.end, tip, [[0, 18], [.35, 24], [.8, 18], [1, 6]]);
  }
  // legs
  for (const [hj, leg, lift, sd] of [[P.hipJL, P.legL, P.liftL, -1], [P.hipJR, P.legR, P.liftR, 1]]) {
    limb(g, hj, leg.mid, [[0, 86], [.45, 66], [1, 44]]);
    limb(g, leg.mid, leg.end, [[0, 44], [.28, 50], [.7, 30], [1, 21]]);
    // stiletto shoe
    const toe = add(leg.end, V(sd * 10 + -sd * 14 * lift, 58 - 10 * lift));
    limb(g, leg.end, toe, [[0, 22], [.5, 24], [1, 8]]);
    g.save(); g.lineWidth = 4; g.lineCap = 'round'; g.beginPath();
    g.moveTo(leg.end.x - sd * 6, leg.end.y + 8); g.lineTo(leg.end.x - sd * 4, leg.end.y + 60 - 26 * lift); g.stroke(); g.restore();
  }
}

const sil = makeCanvas(W, H), silG = sil.getContext('2d');
const tintA = makeCanvas(W, H), tintAG = tintA.getContext('2d');
const tintB = makeCanvas(W, H), tintBG = tintB.getContext('2d');
const haloC = makeCanvas(W / 4, H / 4), haloG = haloC.getContext('2d');

function renderSil(t){
  silG.setTransform(1, 0, 0, 1, 0, 0);
  silG.clearRect(0, 0, W, H);
  silG.setTransform(L.dancer.s, 0, 0, L.dancer.s, L.dancer.x, L.dancer.y);
  silG.fillStyle = '#fff'; silG.strokeStyle = '#fff';
  drawDancer(silG, pose(t));
}
function tint(dstG, style){
  dstG.globalCompositeOperation = 'source-over';
  dstG.clearRect(0, 0, W, H); dstG.drawImage(sil, 0, 0);
  dstG.globalCompositeOperation = 'source-in';
  dstG.fillStyle = style; dstG.fillRect(0, 0, W, H);
  dstG.globalCompositeOperation = 'source-over';
}

function drawDancerLayer(t, on){
  if (on <= 0) return;
  const p = pulse(t, 5);
  const ds = L.dancer.s;

  // backlight bloom behind the dancer
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const cx = L.dancer.x, cy = L.dancer.y - 250 * ds;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 520 * ds);
  g.addColorStop(0, `rgba(255,30,70,${(.32 + .2 * p) * on})`); g.addColorStop(.35, `rgba(170,10,80,${.14 * on})`); g.addColorStop(1, 'rgba(120,0,60,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // back fan of beams through the silhouette
  for (let i = 0; i < 9; i++) {
    const ang = Math.PI + (i - 4) * .2 + Math.sin(t * .8 + i) * .06;
    drawBeam(cx, cy + 120 * ds, ang, H, 4, 90, i % 2 ? '255,40,90' : '200,50,255', .08 * on * (.6 + .4 * p));
  }
  ctx.restore();

  // echo trails (After Effects "Echo")
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  [[.16, '#ff1f5a', .30], [.08, '#c13cff', .38]].forEach(([dt, col, a]) => {
    renderSil(t - dt); tint(tintAG, col);
    ctx.globalAlpha = a * on * (.45 + .55 * p);
    ctx.drawImage(tintA, 0, 0);
  });
  ctx.restore();

  renderSil(t);

  // soft halo
  tint(tintAG, '#ff2050');
  haloG.clearRect(0, 0, haloC.width, haloC.height);
  haloG.filter = 'blur(9px)'; haloG.drawImage(tintA, 0, 0, haloC.width, haloC.height); haloG.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (.55 + .3 * p) * on;
  ctx.drawImage(haloC, 0, 0, W, H);
  ctx.restore();

  // rim lights: red from the left, violet from the right, white kiss from above
  ctx.save(); ctx.globalAlpha = on;
  tint(tintBG, '#ff2d55'); ctx.drawImage(tintB, -7 * ds, -3 * ds);
  tint(tintBG, '#b84dff'); ctx.drawImage(tintB, 7 * ds, -2 * ds);
  tint(tintBG, '#ffd9e6'); ctx.drawImage(tintB, 0, -5 * ds);
  // body
  const bg = silG; // reuse sil as the dark body
  bg.setTransform(1, 0, 0, 1, 0, 0);
  bg.globalCompositeOperation = 'source-in';
  const bodyGrad = bg.createLinearGradient(0, L.dancer.y - 500 * ds, 0, L.dancer.y + 500 * ds);
  bodyGrad.addColorStop(0, '#12060f'); bodyGrad.addColorStop(.5, '#08030a'); bodyGrad.addColorStop(1, '#030103');
  bg.fillStyle = bodyGrad; bg.fillRect(0, 0, W, H);
  bg.globalCompositeOperation = 'source-over';
  ctx.drawImage(sil, 0, 0);
  ctx.restore();

  // glitter on the dress
  const P = pose(t);
  ctx.save();
  ctx.translate(L.dancer.x, L.dancer.y); ctx.scale(ds, ds);
  ctx.clip(dressPath(P));
  ctx.globalCompositeOperation = 'lighter';
  const r = rng(42);
  for (let i = 0; i < 55; i++) {
    const fx = (r() - .5) * 220, fy = -300 + r() * 460;
    const pp = add(P.hip, rot(V(fx, fy), lerp(P.pt, P.cr, clamp(-fy / 300))));
    const tw = Math.pow(Math.max(0, Math.sin(t * (2 + r() * 5) + r() * 9)), 10);
    if (tw < .05) continue;
    const a = tw * on, sz = 2 + 6 * tw;
    ctx.fillStyle = `rgba(255,${180 + (r() * 60 | 0)},220,${a})`;
    ctx.fillRect(pp.x - sz, pp.y - .8, sz * 2, 1.6); ctx.fillRect(pp.x - .8, pp.y - sz, 1.6, sz * 2);
    ctx.beginPath(); ctx.arc(pp.x, pp.y, 1.8, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawFloorFog(t){
  ctx.save();
  const g = ctx.createLinearGradient(0, L.floorY - 420, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(10,0,8,.45)'); g.addColorStop(1, 'rgba(0,0,0,.9)');
  ctx.fillStyle = g; ctx.fillRect(0, L.floorY - 420, W, H);
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 3; i++) {
    const sz = 512 * (2.4 + i * .5);
    ctx.globalAlpha = .22;
    ctx.drawImage(i % 2 ? hazeMag : hazeRed, W * (.2 + .3 * i) - sz / 2 + Math.sin(t * .3 + i * 2) * 160, L.floorY - sz / 2 + 40, sz, sz * .5);
  }
  ctx.restore();
}

function drawParticles(t, on){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const y = ((p.y - t * p.sp * p.z) % H + H) % H;
    const x = p.x + Math.sin(t * .6 + p.ph) * 30 * p.z;
    const a = on * Math.pow(.5 + .5 * Math.sin(t * p.tw + p.ph), 3) * .9 * p.z;
    const r = 1.2 + 2.2 * p.z;
    ctx.fillStyle = p.warm ? `rgba(255,200,170,${a})` : `rgba(255,90,140,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    if (p.z > 1) { ctx.fillStyle = `rgba(255,255,255,${a * .6})`; ctx.fillRect(x - 9 * a, y - .6, 18 * a, 1.2); }
  }
  ctx.restore();
}

function fitFont(text, font, size, maxW, spacing){
  ctx.font = `${size}px ${font}`; ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(text).width;
  if (w > maxW) { size *= maxW / w; ctx.font = `${size}px ${font}`; }
  return size;
}

const logoTmp = makeCanvas(1, 1), logoTmpG = logoTmp.getContext('2d');
function drawLogo(t){
  if (!logo.complete || !logo.naturalWidth) return;
  const k = prog(t, .35, 1.5);
  if (k <= 0) return;
  const e = easeOutExpo(k);
  const w = L.logoW, h = w * logo.naturalHeight / logo.naturalWidth;
  if (logoTmp.width !== Math.ceil(w)) { logoTmp.width = Math.ceil(w); logoTmp.height = Math.ceil(h); }
  logoTmpG.globalCompositeOperation = 'source-over';
  logoTmpG.clearRect(0, 0, w, h); logoTmpG.drawImage(logo, 0, 0, w, h);
  // light sweep across the logo
  const sweep = ((t - 1.0) % 5) / 1.1;
  if (sweep > 0 && sweep < 1) {
    const x = lerp(-w * .4, w * 1.4, easeInOut(sweep));
    const g = logoTmpG.createLinearGradient(x - 120, 0, x + 120, h);
    g.addColorStop(0, 'rgba(255,60,110,0)'); g.addColorStop(.5, 'rgba(255,190,215,1)'); g.addColorStop(1, 'rgba(255,60,110,0)');
    logoTmpG.globalCompositeOperation = 'source-atop'; logoTmpG.fillStyle = g; logoTmpG.fillRect(0, 0, w, h);
  }
  const sc = lerp(1.35, 1, e);
  ctx.save();
  ctx.translate(W / 2, L.logoY); ctx.scale(sc, sc);
  // ghost blur trails while flying in
  if (k < 1) for (let i = 1; i <= 4; i++) {
    ctx.globalAlpha = (1 - e) * .25;
    const s2 = 1 + i * .05 * (1 - e);
    ctx.drawImage(logoTmp, -w * s2 / 2, -h * s2 / 2, w * s2, h * s2);
  }
  ctx.globalAlpha = Math.min(1, k * 2.2);
  ctx.shadowColor = 'rgba(255,40,90,.85)'; ctx.shadowBlur = 30 + 20 * pulse(t, 5);
  ctx.drawImage(logoTmp, -w / 2, -h / 2);
  ctx.restore();
}

function chromaText(text, x, y, fill, ab, glow){
  ctx.save();
  if (ab > .3) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,0,60,.85)'; ctx.fillText(text, x - ab, y);
    ctx.fillStyle = 'rgba(0,200,255,.75)'; ctx.fillText(text, x + ab, y + ab * .3);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (glow) { ctx.shadowColor = glow.c; ctx.shadowBlur = glow.b; }
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
  ctx.restore();
}

const SLAM = 1.7;
function drawTitle(t, glitchAmt){

    ctx.save();
    ctx.translate(W / 2, L.t1Y - size * .36); ctx.scale(sc, sc); ctx.translate(-W / 2, -(L.t1Y - size * .36));

    g.addColorStop(0, '#ffffff'); g.addColorStop(.48, '#ffe3ea'); g.addColorStop(.52, '#ffb3c6'); g.addColorStop(1, '#ffffff');
    chromaText('ROMANIAN', W / 2, L.t1Y, g, ab, {c: 'rgba(255,30,80,.7)', b: 40 + 30 * pulse(t, 5)});

      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = lg; ctx.globalAlpha = .9;

    for (let i = 0; i < txt.length; i++) {
      const ch = txt[i];

      const st = 2.05 + i * .065;

      let on = 0;

      // random neon buzz later on
      if (t > 5 && Math.sin(t * 23 + i * 7) > .985) on = .25;
      if (on > 0 && ch !== ' ') {
        ctx.save();
        ctx.globalAlpha = on;
        ctx.lineJoin = 'round';
        ctx.shadowColor = '#ff1f4f'; ctx.shadowBlur = 34 + 26 * p;
        ctx.strokeStyle = '#ff2d5a'; ctx.lineWidth = 9; ctx.strokeText(ch, x, L.t2Y);
        ctx.shadowBlur = 12; ctx.strokeStyle = '#ffd0dc'; ctx.lineWidth = 3; ctx.strokeText(ch, x, L.t2Y);
        ctx.fillStyle = 'rgba(255,40,90,.10)'; ctx.fillText(ch, x, L.t2Y);
        ctx.restore();
      }
      x += cw;
    }
    ctx.textAlign = 'center';
  }

  // tricolor bar
  const kb = prog(t, 2.75, 3.35);
  if (kb > 0) {

      ctx.fillStyle = c; ctx.fillRect(x0, L.barY, segW * kk, bh);
    });
    ctx.restore();
  }
}

function drawInfo(t){
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // backdrop to keep the text readable
  const kb = prog(t, 3.1, 3.8);
  if (kb > 0) {
    ctx.save();
    const top = L.dayY - (FEED ? 90 : 130);
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.35, `rgba(4,0,6,${.5 * kb})`); g.addColorStop(1, `rgba(0,0,0,${.85 * kb})`);

    ctx.beginPath(); ctx.rect(0, L.dateY - size * 1.05, W, size * 1.25); ctx.clip();
    ctx.translate(0, size * 1.1 * (1 - e));
    const g = ctx.createLinearGradient(0, L.dateY - size * .8, 0, L.dateY);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ffc2d1');

  // time

    ctx.font = `800 ${fs}px Montserrat`; ctx.letterSpacing = '6px';

    const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
    const x0 = W / 2 - (wa + wb) / 2;
    ctx.textAlign = 'left';
    const dy = 16 * (1 - easeOutCubic(k3));
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText(a, x0, L.timeY + dy);
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ff2d5a'; ctx.shadowBlur = 22 + 20 * pulse(t, 5);
    ctx.fillText(b, x0 + wa, L.timeY + dy);
    ctx.restore();

    const numW = ctx.measureText(EVENT.phone).width;
    ctx.font = `800 ${fs * .72}px Montserrat`; ctx.letterSpacing = '6px';
    const tagW = ctx.measureText('RSVP').width + 44;
    const pw = tagW + numW + 70;
    ctx.translate(W / 2, L.rsvpY); ctx.scale(e, e);
    ctx.globalAlpha = clamp(k4 * 2);
    const p = pulse(t, 3);
    // pulse ring
    ctx.save(); ctx.globalAlpha *= (1 - (beatOf(t) % 1)) * .6;
    const grow = (beatOf(t) % 1) * 24;
    ctx.strokeStyle = '#ff2d5a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-pw / 2 - grow, -ph / 2 - grow, pw + grow * 2, ph + grow * 2, ph / 2 + grow); ctx.stroke();
    ctx.restore();
    // glass pill
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.shadowColor = 'rgba(255,40,90,.55)'; ctx.shadowBlur = 30 + 20 * p;
    ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fill();
    ctx.shadowBlur = 0;
    const bg = ctx.createLinearGradient(-pw / 2, 0, pw / 2, 0);
    bg.addColorStop(0, '#ff2d5a'); bg.addColorStop(.5, '#ffffff'); bg.addColorStop(1, '#b84dff');
    ctx.strokeStyle = bg; ctx.lineWidth = 3; ctx.stroke();
    // RSVP tag
    const tg = ctx.createLinearGradient(-pw / 2, 0, -pw / 2 + tagW, 0);
    tg.addColorStop(0, '#ff1f4f'); tg.addColorStop(1, '#d4145a');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.roundRect(-pw / 2 + 8, -ph / 2 + 8, tagW, ph - 16, (ph - 16) / 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('RSVP', -pw / 2 + 8 + tagW / 2 + 3, 2);
    ctx.font = `800 ${fs}px Montserrat`; ctx.letterSpacing = '4px';
    ctx.textAlign = 'left';
    ctx.shadowColor = 'rgba(255,60,120,.8)'; ctx.shadowBlur = 14;
    ctx.fillText(EVENT.phone, -pw / 2 + tagW + 40, 3);
    ctx.restore();
  }
}

   POST FX
   ===================================================================== */
const GLITCHES = [SLAM, 6.2, 9.95, 13.1, 14.35];
function glitchAt(t){
  let g = 0;
  for (const s of GLITCHES) { const d = t - s; if (d >= 0 && d < .22) g = Math.max(g, 1 - d / .22); }
  return g;
}
const fxC = makeCanvas(W, H), fxG = fxC.getContext('2d');
function glitchSlices(t, amt){
  if (amt <= .05) return;
  fxG.clearRect(0, 0, W, H); fxG.drawImage(cv, 0, 0);
  const r = rng(Math.floor(t * 30) + 999);
  const n = 7 + (r() * 6 | 0);
  for (let i = 0; i < n; i++) {
    const y = r() * H, h = 8 + r() * 90, dx = (r() - .5) * 140 * amt;
    ctx.drawImage(fxC, 0, y, W, h, dx, y, W, h);
    if (r() < .35) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,30,80,${.25 * amt})`; ctx.fillRect(0, y, W, h); ctx.restore(); }
  }
}
function vignette(){
  const g = ctx.createRadialGradient(W / 2, H * .48, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.78)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function grain(t){
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .13;
  const gi = grains[Math.floor(t * 24) % 4];
  ctx.drawImage(gi, 0, 0, W, H);
  ctx.restore();
}
function lightLeak(t){
  // slow drifting light leak from the edge, like a film burn
  const k = .5 + .5 * Math.sin(t * .5);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const x = W * (.95 - .2 * k), y = H * (.15 + .1 * Math.sin(t * .3));
  const g = ctx.createRadialGradient(x, y, 0, x, y, 700);
  g.addColorStop(0, `rgba(255,70,60,${.22 * k})`); g.addColorStop(.5, `rgba(200,30,120,${.1 * k})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* =====================================================================
   FRAME
   ===================================================================== */
function renderFrame(time){
  const t = ((time % DURATION) + DURATION) % DURATION;
  const lasersOn = easeOutCubic(prog(t, .1, 1.1));
  // dancer appears with a strobe flicker
  let dancerOn = 0;
  if (t > .9) { const lt = t - .9; dancerOn = lt > .55 ? 1 : ([.6, 0, 1, 0, .4, 1, 0, 1, .7, 1, 1, 1, 1, 1][Math.floor(lt / .04)] ?? 1); }
  const gl = glitchAt(t);

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // camera: slow push-in + shake on the slam & beats
  const shakeK = Math.max(0, 1 - (t - SLAM) / .45) * (t >= SLAM ? 1 : 0);
  const r = rng(Math.floor(t * 60));
  const shx = (r() - .5) * 34 * shakeK + (r() - .5) * 3 * pulse(t, 10);
  const shy = (r() - .5) * 34 * shakeK + (r() - .5) * 3 * pulse(t, 10);
  const zoom = 1.06 - .06 * easeOutCubic(prog(t, 0, DURATION)) + .006 * pulse(t, 6);
  ctx.translate(W / 2 + shx, H / 2 + shy); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);

  ctx.globalAlpha = lerp(.35, 1, lasersOn);
  drawShards(t);
  ctx.globalAlpha = 1;
  drawBokeh(t, lasersOn);
  drawHaze(t, lasersOn);
  drawLasers(t, lasersOn);
  drawDancerLayer(t, dancerOn);
  drawFloorFog(t);
  drawParticles(t, lasersOn);
  ctx.restore();

  // text is not affected by the slow zoom (stays crisp & in the safe area)
  ctx.save();
  ctx.translate(shx * .6, shy * .6);
  drawLogo(t);
  drawTitle(t, gl);
  drawInfo(t);
  ctx.restore();

  drawFixtures(t, lasersOn);
  lightLeak(t);
  vignette();
  glitchSlices(t, gl);

  // flashes
  const flash = Math.max(0, 1 - (t - SLAM) / .3) * (t >= SLAM ? .5 : 0) + .12 * pulse(t, 14) * lasersOn;
  if (flash > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,220,230,${flash})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }

  grain(t);

  // fade in / out for a seamless loop
  const fade = Math.max(1 - prog(t, 0, .35), prog(t, DURATION - .5, DURATION));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.renderFrame = renderFrame;
window.DURATION = DURATION; window.W = W; window.H = H;

window.ready = Promise.all([
  document.fonts.load('400 100px Anton', 'ROMANIAN Ă'),
  document.fonts.load('800 40px Montserrat', 'SÂMBĂTĂ'),
  document.fonts.load('800 40px Montserrat', 'DE LA 0742 RSVP'),
  new Promise(res => logo.complete ? res() : (logo.onload = logo.onerror = res)),
]).catch(() => {});

if (!CAPTURE) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { renderFrame((now - t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
