<title>AUTOFLOW</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar antracit fix + zonă de lucru pe gri foarte deschis; carduri albe; accent albastru electric. */
:root {
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --surface-3:#e7eaee;
  --line:#e3e6eb; --line-strong:#cfd4db; --fg:#0f1318; --fg-2:#49515c; --muted:#6d7580;
  --accent:#2a78d6; --accent-strong:#1c5cab; --accent-soft:#e8f1fc;
  --side:#14171c; --side-2:#1d2128; --side-fg:#c9ced6; --side-muted:#7d8591;
  --good:#0f7b4b; --good-soft:#e6f4ec; --warn:#a0620a; --warn-soft:#fbf1df; --bad:#c0352f; --bad-soft:#fbe9e8;
  --info:#1c5cab; --info-soft:#e8f1fc; --grid:#e8ebef; --axis:#6d7580;
  --shadow:0 1px 2px rgb(16 24 40/.04),0 1px 3px rgb(16 24 40/.06); --pop:0 12px 32px -8px rgb(16 24 40/.2);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0c0e11; --surface:#14171b; --surface-2:#1a1e23; --surface-3:#22272d; --line:#252a31; --line-strong:#343a43;
  --fg:#eef0f3; --fg-2:#b0b7c2; --muted:#858d99; --accent:#3987e5; --accent-strong:#5598e7; --accent-soft:#15253a;
  --side:#0f1114; --side-2:#181b20; --good:#3fb67c; --good-soft:#10261b; --warn:#e0a23a; --warn-soft:#2a2010; --bad:#ec6b65; --bad-soft:#2d1514;
  --info:#6da7ec; --info-soft:#15253a; --grid:#22272d; --axis:#858d99; --shadow:0 1px 2px rgb(0 0 0/.4); --pop:0 16px 40px -8px rgb(0 0 0/.6); color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0c0e11; --surface:#14171b; --surface-2:#1a1e23; --surface-3:#22272d; --line:#252a31; --line-strong:#343a43;
  --fg:#eef0f3; --fg-2:#b0b7c2; --muted:#858d99; --accent:#3987e5; --accent-strong:#5598e7; --accent-soft:#15253a;
  --side:#0f1114; --side-2:#181b20; --good:#3fb67c; --good-soft:#10261b; --warn:#e0a23a; --warn-soft:#2a2010; --bad:#ec6b65; --bad-soft:#2d1514;
  --info:#6da7ec; --info-soft:#15253a; --grid:#22272d; --axis:#858d99; --shadow:0 1px 2px rgb(0 0 0/.4); --pop:0 16px 40px -8px rgb(0 0 0/.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .fg2{color:var(--fg-2)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* shell */
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;z-index:30;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;height:60px;padding:0 20px}
.brand b{color:#fff;font-weight:600;letter-spacing:.14em;font-size:15px}
.dealer{margin:0 12px 14px;background:var(--side-2);border-radius:10px;padding:9px 12px}
.dealer small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.dealer span{color:#fff;font-weight:500;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{flex:1;overflow:auto;padding:0 12px 16px;display:grid;gap:2px;align-content:start}
.nav h6{margin:16px 12px 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:8px;font-size:13.5px;cursor:pointer;position:relative}
.nav button:hover{background:rgb(255 255 255/.05);color:#fff}
.nav button.on{background:rgb(255 255 255/.09);color:#fff;font-weight:500}
.nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .soon{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;font-size:13.5px;color:rgb(125 133 145/.75)}
.nav .soon em{margin-left:auto;font-style:normal;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgb(255 255 255/.1);border-radius:4px;padding:0 5px}
.nav svg,.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.side-foot{padding:14px 20px 18px;font-size:11px;color:var(--side-muted)}
.wrap{padding-left:248px;min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:60px;display:flex;align-items:center;gap:10px;justify-content:flex-end;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.demo-pill{margin-right:auto;font-size:12px;color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in oklab,var(--warn) 25%,transparent);border-radius:999px;padding:3px 10px;white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{all:unset;display:grid;place-items:center;width:28px;height:28px;border-radius:7px;color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:12px}
.who select{height:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:0 8px;font-size:12.5px}
.who label{font-size:11.5px;color:var(--muted)}
.top .burger{display:none}
main{max-width:1400px;margin:0 auto;padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:20px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.ph h1{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--fg-2)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:9px;border:1px solid transparent;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.p{background:var(--accent);color:#fff}.btn.p:hover{background:var(--accent-strong)}
.btn.s{background:var(--surface);border-color:var(--line-strong)}.btn.s:hover{background:var(--surface-2)}
.btn.g{background:transparent;color:var(--fg-2)}.btn.g:hover{background:var(--surface-2);color:var(--fg)}
.btn.d{background:var(--surface);border-color:var(--line-strong);color:var(--bad)}.btn.d:hover{background:var(--bad-soft)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:7px}
.btn .ic{width:16px;height:16px}
.alert{border-radius:9px;padding:10px 14px;font-size:13px;border:1px solid}
.alert.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in oklab,var(--bad) 25%,transparent)}
.alert.good{background:var(--good-soft);color:var(--good);border-color:color-mix(in oklab,var(--good) 25%,transparent)}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in oklab,var(--warn) 25%,transparent)}
.alert.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in oklab,var(--info) 25%,transparent)}
.badge{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-preparation{background:var(--surface-2);color:var(--fg-2)} .b-available{background:var(--good-soft);color:var(--good)}
.b-reserved{background:var(--warn-soft);color:var(--warn)} .b-sold{background:var(--info-soft);color:var(--info)} .b-withdrawn{background:var(--surface-2);color:var(--muted)}
.ex{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--warn);border:1px solid color-mix(in oklab,var(--warn) 40%,transparent);border-radius:4px;padding:0 4px;vertical-align:2px}

.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:18px}
.kpi h4{margin:0;font-size:12.5px;font-weight:500;color:var(--fg-2)}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.015em;margin-top:5px;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi .lock{font-size:12.5px;color:var(--muted);margin-top:9px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{padding:20px;min-width:0}
.panel h3{margin:0;font-size:14.5px;font-weight:600}
.panel .sub{font-size:12.5px;color:var(--muted);margin:1px 0 16px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--axis);font-size:11px;font-family:var(--font)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rank .r{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.rank .bar{height:6px;border-radius:99px;background:var(--surface-2)} .rank .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.aging{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aging div{background:var(--surface-2);border-radius:9px;padding:9px 12px}
.aging small{font-size:12px;color:var(--fg-2)} .aging b{display:block;font-size:20px;font-weight:600}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px solid var(--line)}
.rowlink{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:9px 8px;border-radius:9px;cursor:pointer}
.rowlink:hover{background:var(--surface-2)}
.thumb{width:64px;height:44px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.empty{text-align:center;padding:52px 20px}
.empty .ico{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);margin:0 auto 14px}
.empty p{max-width:380px;margin:4px auto 0;font-size:13px;color:var(--fg-2)}

/* list */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:max-content}
.tabs button{all:unset;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--fg-2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--surface-3);color:var(--fg);font-weight:500}
.scroll-x{overflow-x:auto;margin-bottom:14px}
.filters{display:grid;grid-template-columns:minmax(200px,1fr) repeat(4,minmax(0,165px));gap:8px;padding:12px;margin-bottom:14px}
.input{height:38px;width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:0 12px;font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 18%,transparent)}
textarea.input{height:auto;padding:9px 12px;resize:vertical}
.input.err{border-color:var(--bad)}
.search{position:relative} .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px} .search .input{padding-left:34px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-weight:500;font-size:12px;color:var(--fg-2);background:color-mix(in oklab,var(--surface-2) 60%,transparent);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s} tbody tr:hover{background:color-mix(in oklab,var(--surface-2) 70%,transparent)}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
.cards{display:none}

/* form */
.sec{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding:24px;margin-bottom:14px}
.sec h2{margin:0;font-size:14.5px;font-weight:600}
.sec .d{font-size:12.5px;color:var(--muted);margin-top:4px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.f label{display:block;font-size:13px;font-weight:500;color:var(--fg-2);margin-bottom:6px}
.f .e{color:var(--bad);font-size:12.5px;margin-top:4px}
.f .h{color:var(--muted);font-size:12.5px;margin-top:4px}
.f.span2{grid-column:span 2} .f.span3{grid-column:1/-1}
.unit{position:relative} .unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none} .unit .input{padding-right:44px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eqgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.eqgrid legend{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding:0}
.eqgrid fieldset{border:0;margin:0;padding:0}
.chk{display:flex;align-items:center;gap:9px;padding:4px 6px;border-radius:6px;font-size:13.5px;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;padding:16px;border-radius:10px;background:var(--surface-2)}
.calc small{font-size:12px;color:var(--fg-2)} .calc b{display:block;font-size:17px;font-weight:600}
.savebar{position:fixed;left:248px;right:0;bottom:0;z-index:15;border-top:1px solid var(--line);background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(8px);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.savebar div{max-width:1400px;margin:0 auto;display:flex;justify-content:flex-end;gap:8px}

/* detail */
.det{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.stack{display:grid;gap:14px;min-width:0}
.hero{aspect-ratio:16/10;max-width:100%;width:100%;border-radius:10px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted);cursor:zoom-in;border:0;padding:0}
.hero img{width:100%;height:100%;object-fit:cover}
.thumbs{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.thumbs li{position:relative;aspect-ratio:4/3;border-radius:7px;overflow:hidden;background:var(--surface-2);cursor:grab}
.thumbs li.prim{outline:2px solid var(--accent);outline-offset:2px}
.thumbs li.dragging{opacity:.4}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .tools{position:absolute;inset:4px 4px auto;display:flex;justify-content:space-between;opacity:0;transition:opacity .15s}
.thumbs li:hover .tools,.thumbs li:focus-within .tools{opacity:1}
.thumbs .tools button{all:unset;width:24px;height:24px;border-radius:5px;background:rgb(0 0 0/.62);color:#fff;display:grid;place-items:center;cursor:pointer}
.thumbs .tools .ic{width:14px;height:14px}
.drop{margin-top:12px;border:1px dashed var(--line-strong);border-radius:10px;padding:22px 16px;text-align:center;font-size:13px;transition:background .15s,border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .link{all:unset;color:var(--accent);font-weight:500;cursor:pointer}
.prog{height:6px;border-radius:99px;background:var(--surface-3);max-width:260px;margin:8px auto 0}.prog i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .2s}
.specs{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;margin:0}
.specs div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;font-size:13.5px}
.specs dt{color:var(--fg-2)} .specs dd{margin:0;font-weight:500;text-align:right}
.eqshow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.eqshow ul{list-style:none;margin:0;padding:0;font-size:13.5px;display:grid;gap:4px}
.eqshow li::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin:0 8px 3px 0}
.rows{margin:0;font-size:13.5px}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:5px 0}
.rows dt{color:var(--fg-2)} .rows dd{margin:0;text-align:right}
.price{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px solid var(--line);display:grid;gap:14px;font-size:13px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-21px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.sellbox{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}

/* modal / lightbox / toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.55);display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);max-width:420px;width:100%;padding:22px}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 18px;color:var(--fg-2);font-size:13.5px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.lb{position:fixed;inset:0;z-index:60;background:rgb(0 0 0/.92);display:grid;place-items:center;padding:20px}
.lb img{max-width:100%;max-height:88vh;border-radius:6px}
.lb button{all:unset;position:absolute;color:#fff;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.1)}
.lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))} .lb .pv{left:max(14px,env(safe-area-inset-left,0px))} .lb .nx{right:max(14px,env(safe-area-inset-right,0px))}
.lb .cnt{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:rgb(255 255 255/.7);font-size:13px}
.toast{position:fixed;z-index:70;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:var(--pop)}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* responsive */
@media (max-width:1180px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.fields,.eqgrid,.eqshow{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.det{grid-template-columns:1fr}.hide-l{display:none}}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--pop)}

function parseMoney(input){
  if(input==null) return null;
  let s=String(input).trim().replace(/\s|€|eur|ron|lei/gi,"");
  if(s==="") return null;
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>-1&&ld>-1) s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(lc>-1) s=/^\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,""):s.replace(",",".");
  else if(ld>-1&&/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  if(!/^\d+(\.\d{1,2})?$/.test(s)) throw new Error("Sumă invalidă.");
  const [w,f=""]=s.split(".");
  return Number(w)*100+Number(f.padEnd(2,"0"));
}

  if(!TRANS[raw.transmission])e.transmission="Selectați transmisia."; out.transmission=raw.transmission;

  if(!can(S.role,"vehicle.costs.write")) ["purchasePrice","transportCost","repairCost","preparationCost","otherCosts"].forEach(k=>delete out[k]);

function computeDash(){
  const V=S.vehicles, fin=can(S.role,"dashboard.financials");
  const c={preparation:0,available:0,reserved:0,sold:0,withdrawn:0}; V.forEach(v=>c[v.status]++);
  const stockV=V.filter(v=>IN_STOCK.includes(v.status));
  let cost=0,list=0,prof=0,miss=0; stockV.forEach(v=>{const tc=totalCost(v); if(tc!=null)cost+=tc; else miss++; if(v.listPrice!=null)list+=v.listPrice; else miss++; const p=estProfit(v); if(p!=null)prof+=p;});
  const now=new Date(); const months=[]; for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,label:new Intl.DateTimeFormat("ro-RO",{month:"short"}).format(d).replace(".",""),sold:0,profit:0,hasProfit:false,days:[]});}
  const start=new Date(now.getFullYear(),now.getMonth()-11,1);
  const soldV=V.filter(v=>v.status==="sold"&&v.soldAt&&new Date(v.soldAt)>=start);
  const byMake={}, agents={};
  soldV.forEach(v=>{const d=new Date(v.soldAt); const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; const m=months.find(x=>x.key===k); if(m){m.sold++; const p=realProfit(v); if(p!=null){m.profit+=p;m.hasProfit=true;} m.days.push(daysBetween(v.acquiredAt,v.soldAt));}
    byMake[v.make]=(byMake[v.make]||0)+1; const a=v.soldBy||"Necunoscut"; agents[a]??={n:0,rev:0}; agents[a].n++; agents[a].rev+=v.salePrice||0;});
  const allDays=soldV.map(v=>daysBetween(v.acquiredAt,v.soldAt));
  const ages=stockV.map(v=>({v,d:daysBetween(v.acquiredAt,now)}));
  return {fin,c,inStock:stockV.length,total:V.length,cost:fin?cost:null,list,prof:fin?prof:null,miss,months,thisMonth:months[11],
    avgDays:allDays.length?Math.round(allDays.reduce((a,b)=>a+b,0)/allDays.length*10)/10:null,
    byMake:Object.entries(byMake).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,8),
    agents:Object.entries(agents).sort((a,b)=>b[1].n-a[1].n).slice(0,8),
    aging:[ages.filter(a=>a.d<=30).length,ages.filter(a=>a.d>30&&a.d<=60).length,ages.filter(a=>a.d>60&&a.d<=90).length,ages.filter(a=>a.d>90).length],
    oldest:ages.filter(a=>a.d>30).sort((a,b)=>b.d-a.d).slice(0,4),
    recent:V.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5)};
}
function niceMax(v){ if(v<=0) return 4; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function barChart(data,unit){

}
function areaChart(data,fmt){

function filtered(){
  const f=S.filters; let V=S.vehicles.slice();
  if(f.status==="in_stock") V=V.filter(v=>IN_STOCK.includes(v.status)); else if(f.status) V=V.filter(v=>v.status===f.status);
  if(f.make) V=V.filter(v=>v.make===f.make); if(f.fuel) V=V.filter(v=>v.fuel===f.fuel); if(f.transmission) V=V.filter(v=>v.transmission===f.transmission);
  const q=f.q.trim().toLowerCase();
  if(q){ const sn=q.toUpperCase().replace(/^AF-?/,""); V=V.filter(v=>`${v.make} ${v.model} ${v.version||""} ${v.vin||""} ${v.plateNumber||""}`.toLowerCase().includes(q)||(/^\d+$/.test(sn)&&v.stockNumber===Number(sn))); }
  const nl=(a,b,dir)=>a==null&&b==null?0:a==null?1:b==null?-1:(a-b)*dir;
  const sorts={newest:(a,b)=>b.createdAt.localeCompare(a.createdAt),oldest:(a,b)=>a.acquiredAt.localeCompare(b.acquiredAt),price_asc:(a,b)=>nl(a.listPrice,b.listPrice,1),price_desc:(a,b)=>nl(a.listPrice,b.listPrice,-1),year_desc:(a,b)=>b.year-a.year,mileage_asc:(a,b)=>nl(a.mileageKm,b.mileageKm,1)};
  return V.sort(sorts[f.sort]||sorts.newest);
}

function liveCalc(){
  const f=document.getElementById("vform"); if(!f||!document.getElementById("c-cost")) return;
  const g=k=>safeMoney(f.elements[k]?.value); const mv={purchasePrice:g("purchasePrice"),transportCost:g("transportCost"),repairCost:g("repairCost"),preparationCost:g("preparationCost"),otherCosts:g("otherCosts"),listPrice:g("listPrice")};
  const p=estProfit(mv), mg=marginPct(p,mv.listPrice);
  document.getElementById("c-cost").textContent=money(totalCost(mv)); const cp=document.getElementById("c-prof"); cp.textContent=money(p); cp.classList.toggle("bad",p<0);
  document.getElementById("c-mg").textContent=mg==null?"—":mg+"%";
}
async function submitForm(form){
  const {raw,out,errors}=parseVehicleForm(new FormData(form));
  const editing=S.route.id?S.vehicles.find(v=>v.id===S.route.id):null;
  if(!Object.keys(errors).length&&out.vin){ const dup=S.vehicles.find(v=>v.vin===out.vin&&v.id!==editing?.id); if(dup) errors.vin=`VIN folosit deja la ${stock(dup.stockNumber)}.`; }
  if(!Object.keys(errors).length&&editing?.status==="available"&&"listPrice" in out&&out.listPrice==null) errors.listPrice="Prețul de listare este obligatoriu pentru statusul Disponibil.";
  if(Object.keys(errors).length){ S.form={values:{...raw,equipment:out.equipment},errors,error:"Verificați câmpurile marcate."}; renderMain(); document.querySelector(".input.err")?.focus(); return; }
  const now=new Date().toISOString();
  let v;
  if(editing){ v={...editing,...out,updatedAt:now}; }
  else{ S.profile.stockSeq=(S.profile.stockSeq||0)+1; v={id:uid(),stockNumber:S.profile.stockSeq,...Object.fromEntries(["purchasePrice","transportCost","repairCost","preparationCost","otherCosts","listPrice","minPrice","salePrice"].map(k=>[k,null])),...out,
      status:"preparation",statusChangedAt:now,listedAt:null,soldAt:null,soldBy:null,createdBy:actor(),createdAt:now,updatedAt:now,history:[{from:null,to:"preparation",at:now,by:actor()}]};
    await Store.saveProfile(S.profile); }
  try{ await Store.saveVehicle(v); }catch(err){ S.form.error="Salvarea a eșuat: "+(err.message||err.code); renderMain(); return; }
  S.flash=editing?"Modificările au fost salvate.":"created"; go("vehicle",{id:v.id});
}

      :`<section class="card panel"><h3 style="margin-bottom:6px">Situație financiară</h3><p class="muted" style="margin:0;font-size:13px">Costurile de achiziție și profitul sunt vizibile doar proprietarului și managerului.</p></section>`}
     <section class="card panel"><h3 style="margin-bottom:10px">Evidență</h3><dl class="rows">${row("Data achiziției",fdate(v.acquiredAt))}${row(sold?"Zile până la vânzare":"Zile în stoc",d,!sold&&d>90?"bad":!sold&&d>60?"warn":"")}${row("Listat la vânzare",fdate(v.listedAt))}${v.soldAt?row("Vândut",fdate(v.soldAt)):""}${v.soldBy?row("Vândut de",esc(v.soldBy)):""}${row("Ultima actualizare",fdt(v.updatedAt))}</dl></section>

async function changeStatus(to){
  const v=S.vehicles.find(x=>x.id===S.route.id); if(!v) return;
  const err=checkTransition(S.role,v.status,to,v); if(err){ S.ui={error:err}; renderMain(); return; }
  const now=new Date().toISOString(), from=v.status, nv={...v,status:to,statusChangedAt:now,updatedAt:now,history:[...(v.history||[]),{from,to,at:now,by:actor()}]};
  if(to==="sold"){ let sp; try{sp=parseMoney(S.ui.salePrice);}catch{sp=null} if(sp==null){S.ui={...S.ui,error:"Introduceți un preț final de vânzare valid."};renderMain();return;}
    if(v.minPrice!=null&&sp<v.minPrice&&!can(S.role,"vehicle.sell.override")){S.ui={...S.ui,error:"Prețul final este sub prețul minim acceptat. Este necesară aprobarea unui manager."};renderMain();return;}
    Object.assign(nv,{salePrice:sp,soldAt:now,soldBy:actor()}); }
  if(from==="sold") Object.assign(nv,{salePrice:null,soldAt:null,soldBy:null});
  if(to==="available"&&!v.listedAt) nv.listedAt=now;
  S.ui={}; await Store.saveVehicle(nv); renderMain(); toast(`Status actualizat: ${STATUS[to]}`);
}

// ───────────── Fotografii: compresie în browser ─────────────
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{URL.revokeObjectURL(u);res(im)}; im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("invalid"))}; im.src=u; }); }
function encode(im,maxW,maxH,cover,budget){
  let w=im.naturalWidth,h=im.naturalHeight,sx=0,sy=0,sw=w,sh=h,dw,dh;
  if(cover){ const r=Math.max(maxW/w,maxH/h); dw=maxW; dh=maxH; sw=maxW/r; sh=maxH/r; sx=(w-sw)/2; sy=(h-sh)/2; }
  else { const r=Math.min(1,maxW/w,maxH/h); dw=Math.round(w*r); dh=Math.round(h*r); }
  const c=document.createElement("canvas"); c.width=dw; c.height=dh; c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,dw,dh);
  let q=.82, out=c.toDataURL("image/webp",q); if(!out.startsWith("data:image/webp")) out=c.toDataURL("image/jpeg",q);
  while(out.length>budget&&q>.35){ q-=.1; out=c.toDataURL(out.startsWith("data:image/webp")?"image/webp":"image/jpeg",q); }
  if(out.length>budget&&!cover) return encode(im,maxW*.75,maxH*.75,false,budget);
  return out;
}
async function uploadPhotos(files){
  const v=S.vehicles.find(x=>x.id===S.route.id); if(!v) return;
  const ok=["image/jpeg","image/png","image/webp"]; const list=[...files].filter(f=>ok.includes(f.type));
  if(!list.length){ S.ui={error:"Selectați fișiere JPG, PNG sau WebP."}; renderMain(); return; }
  const existing=S.photos[v.id]||[]; if(existing.length+list.length>20){ S.ui={error:"Maximum 20 de fotografii per autoturism în versiunea demonstrativă."}; renderMain(); return; }
  let pos=Math.max(-1,...existing.map(p=>p.position)), hasPrim=existing.some(p=>p.isPrimary);
  S.ui={progress:{done:0,total:list.length}}; renderMain();
  for(const [i,f] of list.entries()){
    try{ const im=await loadImg(f); // canvas re-encode: metadatele EXIF/GPS nu sunt copiate
      const full=encode(im,1600,1600,false,230000), thumb=encode(im,400,300,true,40000);
      const p={id:uid(),vehicleId:v.id,thumb,position:++pos,isPrimary:!hasPrim&&i===0,createdAt:new Date().toISOString()};
      if(p.isPrimary) hasPrim=true; await Store.savePhoto(p,full);
    }catch(err){ S.ui={error:err.message==="invalid"?`${f.name} nu este o imagine validă.`:"Fotografia nu a putut fi salvată: "+(err.message||err.code)}; renderMain(); return; }
    S.ui={progress:{done:i+1,total:list.length}}; renderMain();
  }
  S.ui={}; renderMain(); toast(`${list.length} ${list.length===1?"fotografie adăugată":"fotografii adăugate"}`);
}
async function setPrimary(pid){ const arr=S.photos[S.route.id]||[]; for(const p of arr){ const was=p.isPrimary; p.isPrimary=p.id===pid; if(was!==p.isPrimary) await Store.updatePhoto(p);} renderMain(); }
async function reorder(fromId,toId){ const arr=(S.photos[S.route.id]||[]).sort((a,b)=>a.position-b.position); const fi=arr.findIndex(p=>p.id===fromId), ti=arr.findIndex(p=>p.id===toId); if(fi<0||ti<0||fi===ti) return;
  const [m]=arr.splice(fi,1); arr.splice(ti,0,m); for(const [i,p] of arr.entries()){ if(p.position!==i){p.position=i; await Store.updatePhoto(p);} } renderMain(); }
async function deletePhoto(pid){ const arr=S.photos[S.route.id]||[]; const p=arr.find(x=>x.id===pid); if(!p) return; await Store.deletePhoto(p);
  if(p.isPrimary){ const n=(S.photos[S.route.id]||[]).sort((a,b)=>a.position-b.position)[0]; if(n){n.isPrimary=true; await Store.updatePhoto(n);} } renderMain(); toast("Fotografie ștearsă"); }

async function submitCompany(form){
  const d=Object.fromEntries(new FormData(form).entries()); const e={};
  for(const k in d) d[k]=String(d[k]).trim();
  if(d.name.length<2) e.name="Numele este obligatoriu.";
  if(d.cui){ d.cui=d.cui.toUpperCase().replace(/\s/g,""); if(!/^(RO)?\d{2,10}$/.test(d.cui)) e.cui="CUI invalid (ex. RO12345678)."; }
  if(d.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) e.email="Email invalid.";
  if(d.website&&!/^https?:\/\/\S+\.\S+/.test(d.website)) e.website="Adresă web invalidă (ex. https://…).";
  if(Object.keys(e).length){ S.profile={...S.profile,...d}; S.ui={errors:e}; renderMain(); return; }
  await Store.saveProfile({...S.profile,...d}); S.ui={saved:true}; refresh();
}

function modal(title,text,okLabel,onOk){
  const L=document.getElementById("layer");
  L.innerHTML=`<div class="overlay" data-close><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t"><h3 id="m-t">${title}</h3><p>${text}</p><div class="acts"><button class="btn g" data-close>Renunță</button><button class="btn d" id="m-ok">${okLabel}</button></div></div></div>`;
  L.querySelector("#m-ok").onclick=async()=>{L.innerHTML="";await onOk();}; L.querySelector("#m-ok").focus();
}
async function lightbox(pid){
  const arr=(S.photos[S.route.id]||[]).slice().sort((a,b)=>a.position-b.position); let i=arr.findIndex(p=>p.id===pid); if(i<0) return;
  const L=document.getElementById("layer");
  const show=async()=>{ const p=arr[i]; L.innerHTML=`<div class="lb" data-close role="dialog" aria-modal="true"><button class="x" data-close aria-label="Închide">${ic("x")}</button>${arr.length>1?`<button class="pv" data-lbn="-1" aria-label="Anterioara">${ic("back")}</button><button class="nx" data-lbn="1" aria-label="Următoarea">${ic("next")}</button>`:""}<img src="${p.thumb}" alt="" id="lb-img"><span class="cnt">${i+1} / ${arr.length}</span></div>`;
    const full=await Store.full(p.id).catch(()=>null); const im=document.getElementById("lb-img"); if(full&&im) im.src=full; };
  S.lb={next:d=>{i=(i+d+arr.length)%arr.length;show();}}; show();
}
let toastT; function toast(t){ let el=document.querySelector(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=t; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2600); }

// ───────────── Evenimente ─────────────
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-go],[data-open],[data-act],[data-tab],[data-status],[data-primary],[data-delphoto],[data-lb],[data-lbn],[data-close],[data-theme-set]"); if(!t) return;
  if(t.dataset.close!==undefined&&(e.target===t||t.tagName==="BUTTON")){ document.getElementById("layer").innerHTML=""; return; }
  if(t.dataset.lbn){ e.stopPropagation(); S.lb?.next(Number(t.dataset.lbn)); return; }
  if(t.dataset.themeSet){ const v=t.dataset.themeSet; if(v==="system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=v; store_set("af_theme",v); renderShell(); return; }
  if(t.dataset.go){ go(t.dataset.go,t.dataset.id?{id:t.dataset.id}:{}); return; }
  if(t.dataset.open){ go("vehicle",{id:t.dataset.open}); return; }
  if(t.dataset.tab!==undefined){ S.filters.status=t.dataset.tab; renderMain(); return; }
  if(t.dataset.status){ if(t.dataset.status==="sold"){ const v=S.vehicles.find(x=>x.id===S.route.id); S.ui={selling:true,salePrice:toInput(v.listPrice)}; renderMain(); document.getElementById("salePrice")?.focus(); }
    else if(t.dataset.status==="available"&&S.vehicles.find(x=>x.id===S.route.id)?.status==="sold") modal("Anulați vânzarea?","Prețul final și data vânzării vor fi șterse, iar autoturismul revine în stoc ca disponibil.","Anulează vânzarea",()=>changeStatus("available"));
    else changeStatus(t.dataset.status); return; }
  if(t.dataset.primary){ setPrimary(t.dataset.primary); return; }
  if(t.dataset.delphoto){ modal("Ștergeți fotografia?","Fotografia va fi eliminată definitiv din fișă.","Șterge",()=>deletePhoto(t.dataset.delphoto)); return; }
  if(t.dataset.lb!==undefined){ if(t.dataset.lb) lightbox(t.dataset.lb); return; }
  const a=t.dataset.act;
  if(a==="menu"){ const s=document.getElementById("side"); s.classList.add("open"); const sc=document.createElement("div"); sc.className="scrim"; sc.onclick=()=>{s.classList.remove("open");sc.remove();}; document.body.appendChild(sc); }
  if(a==="pick") document.getElementById("file")?.click();
  if(a==="cancel-sale"){ S.ui={}; renderMain(); }
  if(a==="confirm-sale") changeStatus("sold");
  if(a==="reset-filters"){ S.filters={status:"",q:"",make:"",fuel:"",transmission:"",sort:"newest"}; renderMain(); }
  if(a==="ask-delete") modal("Ștergeți definitiv fișa?","Fișa și fotografiile ei vor fi șterse. Folosiți această opțiune doar pentru fișe introduse greșit; pentru mașini scoase din vânzare folosiți „Retrage”.","Șterge fișa",async()=>{ await Store.deleteVehicle(S.route.id); go("vehicles"); toast("Fișa a fost ștearsă"); });
  if(a==="clear-examples") modal("Ștergeți autoturismele de exemplu?","Rămân doar fișele introduse de dumneavoastră. Puteți reîncărca exemplele oricând stocul este gol.","Șterge exemplele",async()=>{ await clearExamples(); refresh(); toast("Exemplele au fost șterse"); });
  if(a==="load-examples"){ t.disabled=true; await loadExamples(); refresh(); }
});

// drag & drop: încărcare fișiere + reordonare miniaturi
let dragPid=null;
document.addEventListener("dragstart",e=>{ const li=e.target.closest?.("#thumbs li"); if(li){ dragPid=li.dataset.pid; li.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; } });
document.addEventListener("dragend",()=>{ dragPid=null; document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging")); });
document.addEventListener("dragover",e=>{ const li=e.target.closest?.("#thumbs li"), drop=e.target.closest?.("#drop");
  if(li&&dragPid){ e.preventDefault(); return; } if(drop&&!dragPid){ e.preventDefault(); drop.classList.add("over"); } });
document.addEventListener("dragleave",e=>{ const drop=e.target.closest?.("#drop"); if(drop) drop.classList.remove("over"); });

window.addEventListener("dragover",e=>{ if(e.dataTransfer?.types?.includes("Files")) e.preventDefault(); });
