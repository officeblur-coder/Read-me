<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KitzAlpen Hero</title>
    <meta name="description" content="Pension, Chalet und Restaurant in Hollersbach im Pinzgau." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- LCP: the summer photograph is the first thing painted -->
    <!-- season before first paint: no flash of the wrong palette -->
    <script>try{var s=sessionStorage.getItem('kitzalpen-season');if(s!=='winter'&&s!=='summer'){var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Vienna',month:'numeric',day:'numeric'}).formatToParts(new Date()),m=+p.find(function(x){return x.type==='month'}).value,d=+p.find(function(x){return x.type==='day'}).value;s=(m>=11||m<=3||(m===4&&d<=15))?'winter':'summer';}document.documentElement.dataset.season=s;}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
