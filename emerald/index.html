<title>Emerald Event Manager</title>
<meta name="description" content="Prototip: soft de gestiune a evenimentelor pentru Emerald Luxury Events">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: graphite sidebar (brand surface, same in both themes) + calm working area; the event sheet is the centre of the product. */
:root {
  --ink: #121416;          /* sidebar, brand graphite */
  --ink-2: #1B1E21;
  --chrome: #C8CDD1;       /* silver, from the logo */
  --chrome-dim: #858C92;
  --bg: #F3F4F3;
  --surface: #FFFFFF;
  --surface-2: #F8F9F8;
  --fg: #1A1D1F;
  --muted: #69706C;
  --line: #E2E5E3;
  --accent: #0E6B50;       /* emerald */
  --accent-fg: #FFFFFF;
  --accent-soft: #E2F0EA;
  --amber: #A86A12;
  --amber-soft: #FBF0DC;
  --slate: #52647A;
  --slate-soft: #E8EDF2;
  --danger: #B42318;
  --danger-soft: #FCEAE8;
  --shadow: 0 1px 2px rgba(18,20,22,.05), 0 4px 16px rgba(18,20,22,.04);
  --font-display: "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #0B0C0D; --ink-2: #15181A; --chrome: #C8CDD1; --chrome-dim: #7D858B;
    --bg: #101213; --surface: #171A1C; --surface-2: #1C2022; --fg: #E7EAE8; --muted: #9AA19D; --line: #2A2F2F;
    --accent: #3DB389; --accent-fg: #0B0C0D; --accent-soft: #15322A;
    --amber: #E3AA4D; --amber-soft: #382B15; --slate: #A3B4C8; --slate-soft: #1F2731;
    --danger: #F2806F; --danger-soft: #3A1B17; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #0B0C0D; --ink-2: #15181A; --chrome: #C8CDD1; --chrome-dim: #7D858B;
  --bg: #101213; --surface: #171A1C; --surface-2: #1C2022; --fg: #E7EAE8; --muted: #9AA19D; --line: #2A2F2F;
  --accent: #3DB389; --accent-fg: #0B0C0D; --accent-soft: #15322A;
  --amber: #E3AA4D; --amber-soft: #382B15; --slate: #A3B4C8; --slate-soft: #1F2731;
  --danger: #F2806F; --danger-soft: #3A1B17; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100%; }

/* Sidebar */
.side { background: var(--ink); color: var(--chrome); display: flex; flex-direction: column; gap: 28px; padding: 28px 16px 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0 6px; }
.brand svg { width: 38px; height: 30px; }
.word { font-family: var(--font-display); font-weight: 300; font-size: 23px; letter-spacing: .32em; margin-right: -.32em; color: #E9ECEE; line-height: 1; }
.word-sub { font-family: var(--font-display); font-weight: 400; font-size: 9.5px; letter-spacing: .42em; margin-right: -.42em; color: var(--chrome-dim); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-family: var(--font-display); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--chrome-dim); padding: 0 12px 8px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; color: var(--chrome); padding: 9px 12px; border-radius: 8px; text-align: left; font-weight: 500; transition: background .15s, color .15s; }
.nav button:hover { background: var(--ink-2); color: #fff; }
.nav button.on { background: var(--ink-2); color: #fff; box-shadow: inset 0 0 0 1px #2A2F33; }
.nav button svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav .count { margin-left: auto; font-size: 11.5px; background: #2A2F33; color: #E9ECEE; border-radius: 999px; padding: 1px 8px; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #23272A; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #2A2F33; color: #E9ECEE; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.side-foot b { display: block; color: #E9ECEE; font-weight: 600; font-size: 13px; }
.side-foot span { font-size: 12px; color: var(--chrome-dim); }

/* Main */
.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 32px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; place-items: center; }
.search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; height: 38px; }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.demo-badge { font-size: 11.5px; font-weight: 600; color: var(--amber); background: var(--amber-soft); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.role { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.role select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 36px; padding: 0 10px; font-weight: 600; color: var(--fg); }

.page { padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 24px; max-width: 1360px; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-family: var(--font-display); font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: .01em; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.card-b { padding: 16px 20px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn svg { width: 16px; height: 16px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.kpi .note { font-size: 12.5px; color: var(--muted); }
.kpi .note b { color: var(--fg); font-weight: 600; }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
.grid-2b { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--accent); background: var(--accent-soft); }
.chip.warn { color: var(--amber); background: var(--amber-soft); }
.chip.info { color: var(--slate); background: var(--slate-soft); }
.chip.bad { color: var(--danger); background: var(--danger-soft); }
.chip.plain { color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); }
.chip.plain::before { display: none; }

/* Lists */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 20px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.when { display: flex; flex-direction: column; line-height: 1.25; }
.when b { font-size: 13px; }
.when span { font-size: 12px; color: var(--muted); }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.depts { display: flex; gap: 4px; }
.dot { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; }
.dot.ok { background: var(--accent-soft); color: var(--accent); }
.dot.pending { background: var(--amber-soft); color: var(--amber); }

.alert { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 20px 13px 0; border-top: 1px solid var(--line); }
.alert:first-child { border-top: 0; }
.alert .bar { align-self: stretch; border-radius: 0 3px 3px 0; }
.alert.bad .bar { background: var(--danger); }
.alert.warn .bar { background: var(--amber); }
.alert.info .bar { background: var(--slate); }
.alert .t { font-weight: 600; font-size: 13.5px; }
.alert .m { color: var(--muted); font-size: 12.5px; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 500 11px var(--font-body); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Saturdays */
.sat { display: grid; grid-template-columns: 120px repeat(8, minmax(0, 1fr)); gap: 6px; align-items: center; font-size: 12.5px; }
.sat .h { color: var(--muted); font-size: 11px; text-align: center; }
.sat .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sat .c { height: 26px; border-radius: 6px; background: var(--surface-2); border: 1px dashed var(--line); }
.sat .c.ok { background: var(--accent); border: 0; }
.sat .c.warn { background: var(--amber-soft); border: 1px solid var(--amber); }

/* Calendar */
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: 150px repeat(7, minmax(128px, 1fr)); min-width: 1050px; }
.cal > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.cal > div:nth-child(8n) { border-right: 0; }
.cal .dh { padding: 12px; font-size: 12px; color: var(--muted); background: var(--surface-2); }
.cal .dh b { display: block; font-size: 17px; color: var(--fg); font-weight: 700; }
.cal .dh.today { background: var(--accent-soft); }
.cal .dh.today b { color: var(--accent); }
.cal .dh.we b::after { content: " · weekend"; font-size: 11px; color: var(--muted); font-weight: 500; }
.cal .hall { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.cal .hall b { font-size: 13.5px; }
.cal .hall span { font-size: 12px; color: var(--muted); }
.cal .cell { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; }
.cal .cell.today { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.ev { text-align: left; border: 0; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 1.35; transition: transform .15s; width: 100%; }
.ev:hover { transform: translateY(-1px); }
.ev b { font-size: 12.5px; font-weight: 700; }
.ev.confirmat { background: var(--accent-soft); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
.ev.optiune { background: var(--amber-soft); color: var(--fg); box-shadow: inset 3px 0 0 var(--amber); }
.ev.discutie { background: var(--slate-soft); color: var(--fg); box-shadow: inset 3px 0 0 var(--slate); }
.ev span { color: var(--muted); }
.free { flex: 1; border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--muted); font-size: 12px; opacity: 0; transition: opacity .15s; }
.cell:hover .free { opacity: 1; }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

/* Table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th { text-align: left; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
td .t { font-weight: 600; }
td .m { color: var(--muted); font-size: 12.5px; }
.right { text-align: right; }
.progress { height: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; min-width: 80px; }
.progress i { display: block; height: 100%; background: var(--accent); }

/* Event sheet */
.back { background: none; border: 0; color: var(--muted); font-weight: 600; padding: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.back:hover { color: var(--fg); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 13.5px; margin-top: 10px; }
.meta b { color: var(--fg); font-weight: 600; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.dept-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dept { padding: 14px 20px; border-left: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dept:first-child { border-left: 0; }
.dept b { display: block; font-size: 13.5px; }
.dept span { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 16px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; }
.courses { display: flex; flex-direction: column; }
.course { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line); align-items: baseline; }
.course:first-child { border-top: 0; }
.course .time { font-weight: 700; color: var(--accent); }
.course .t { font-weight: 600; }
.course .m { color: var(--muted); font-size: 12.5px; }
.timeline { display: flex; flex-direction: column; padding: 6px 0; }
.tl { display: grid; grid-template-columns: 64px 18px minmax(0, 1fr); gap: 10px; padding: 8px 20px; align-items: start; }
.tl .time { font-weight: 700; font-size: 13px; }
.tl .pin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); margin-top: 5px; background: var(--surface); position: relative; }
.tl .who { color: var(--muted); font-size: 12.5px; }
.special { display: flex; flex-direction: column; gap: 8px; }
.special div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
.floor svg { width: 100%; height: auto; display: block; }
.floor text { font: 600 11px var(--font-body); fill: var(--fg); }
.hist { display: flex; flex-direction: column; }
.hist div { padding: 12px 20px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; font-size: 13px; }
.hist div:first-child { border-top: 0; }
.hist span { color: var(--muted); font-size: 12.5px; }

/* Pipeline */
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px; }
.col-h b { font-size: 13px; }
.col-h span { font-size: 12px; color: var(--muted); }
.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.lead .t { font-weight: 700; font-size: 13.5px; }
.lead .m { color: var(--muted); font-size: 12.5px; }
.lead .f { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Modal + toast */
.overlay { position: fixed; inset: 0; background: rgba(10,12,13,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: pop .18s ease-out; }
.modal.wide { width: min(760px, 100%); }
.modal-h { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-b { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
.modal-f { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field textarea { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 9px 12px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.diff { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.diff b { font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #E9ECEE; padding: 12px 18px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 30; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); animation: pop .2s ease-out; }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: #3DB389; flex: none; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.99); } }
.toast { animation-name: toast; }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } }
.kitchen h3 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kitchen table { min-width: 0; }
.scrim { display: none; }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2, .grid-2b { grid-template-columns: minmax(0, 1fr); }
  .dept-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dept:nth-child(3) { border-left: 0; }
  .dept:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }

const upcoming = () => EV.filter(e => e.date >= TODAY).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
const weekEvents = () => { const m = mondayOf(TODAY), s = addDays(m, 6); return upcoming().filter(e => e.date >= m && e.date <= s); };

function alerts() {
  const out = [];
  EV.filter(e => e.status === "optiune" && diffDays(e.optionExpires, TODAY) <= 3).forEach(e =>
    out.push({ sev: "warn", t: `Opțiunea expiră ${inDays(diffDays(e.optionExpires, TODAY))}`, m: `${e.title} · ${fmtLong(e.date)} · ${hallName(e.hall)}`, id: e.id, cta: "Sună clientul" }));
  EV.forEach(e => e.payments.forEach(p => { if (payState(p) === "overdue") out.push({ sev: "bad", t: `Plată restantă: ${lei(p.amount)}`, m: `${e.title} · ${p.label}, scadentă pe ${fmtShort(p.due)}`, id: e.id, cta: "Vezi plata" }); }));
  upcoming().filter(e => diffDays(e.date, TODAY) <= 7).forEach(e => {
    const pend = DEPTS.filter(d => e.depts[d.id] === "pending");
    if (pend.length) out.push({ sev: "warn", t: `${pend.map(d => d.name).join(" și ")}: modificare neconfirmată`, m: `${e.title} · ${fmtLong(e.date)}`, id: e.id, cta: "Deschide fișa" });
    if (e.incomplete) out.push({ sev: "info", t: "Fișă incompletă", m: `${e.title} · ${e.incomplete}`, id: e.id, cta: "Completează" });
  });
  return out;
}

function monthly() {
  const months = [];
  for (let i = 0; i < 12; i++) {
    const d = toDate(TODAY); d.setDate(1); d.setMonth(d.getMonth() + i);
    const key = iso(d).slice(0, 7);
    const fromList = EV.filter(e => e.status === "confirmat" && e.date >= TODAY && e.date.startsWith(key)).reduce((s, e) => s + value(e), 0);
    months.push({ key, label: MON[d.getMonth()], year: d.getFullYear(), v: fromList + (LATER_MONTHS[key] || 0) });
  }
  return months;
}

function saturdays(n) { const out = []; let d = TODAY; while (toDate(d).getDay() !== 6) d = addDays(d, 1); for (let i = 0; i < n; i++) out.push(addDays(d, i * 7)); return out; }

function eventRow(e) {

}

function chart(months) {
  const W = 640, H = 230, L = 48, B = 26, T = 12, R = 8;
  const max = Math.max(...months.map(m => m.v));
  const step = max > 600000 ? 200000 : 100000;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / months.length;
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v / 1000}k</text>`;
  months.forEach((m, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    g += `<rect x="${x}" y="${y(m.v)}" width="${w}" height="${y(0) - y(m.v)}" rx="3" fill="var(--accent)" opacity="${i === 0 ? 1 : 0.35}"><title>${m.label} ${m.year}: ${lei(m.v)}</title></rect>`;
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${m.label}${m.label === "ian" ? " ’" + String(m.year).slice(2) : ""}</text>`;
  });
  const peak = months.reduce((a, b) => b.v > a.v ? b : a);
  const pi = months.indexOf(peak);
  g += `<text x="${L + pi * bw + bw / 2}" y="${y(peak.v) - 6}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${Math.round(peak.v / 1000)}k</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Venit contractat pe următoarele 12 luni, în mii de lei">${g}</svg>`;
}

    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="card"><div class="card-h"><h2>Valoare și încasări</h2><button class="link" data-action="tab" data-t="payments">Detalii</button></div><div class="card-b" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;gap:12px"><span class="sub" style="margin:0">Valoare totală</span><b class="num" style="font-size:20px">${lei(v)}</b></div>
        <div class="progress" style="height:8px"><i style="width:${v ? Math.round(paid / v * 100) : 0}%"></i></div>
        <div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><span>Încasat <b class="num">${lei(paid)}</b></span><span class="sub" style="margin:0">Rămas <b class="num" style="color:var(--fg)">${lei(v - paid)}</b></span></div>
      </div></div>
      <div class="card"><div class="card-h"><h2>Meniuri speciale</h2></div><div class="card-b special">${e.special.map(([t, n, m]) => `<div><span><b>${t}</b> · ${m}</span><b class="num">${n}</b></div>`).join("")}</div></div>
    </div>
  </section>`;

  if (S.tab === "menu") return `
  <section class="grid-2">
    <div class="card"><div class="card-h"><h2>${pkg.name}</h2><span class="chip plain num">${total} porții</span></div>
      <div class="courses">${pkg.courses.map(([k, t, m]) => `<div class="course"><span class="time">${k}</span><span style="min-width:0"><div class="t">${t}</div><div class="m">${m}</div></span><span class="num">${e.adults} + ${e.kids}</span></div>`).join("")}</div></div>
    <div class="card"><div class="card-h"><h2>Meniuri speciale</h2></div><div class="card-b special">${e.special.map(([t, n, m]) => `<div><span><b>${t}</b> · ${m}</span><b class="num">${n}</b></div>`).join("")}</div></div>
  </section>`;

  if (S.tab === "program") return `
  <div class="card"><div class="card-h"><h2>Programul serii</h2><span class="sub" style="margin:0">Fiecare departament vede momentele lui</span></div>
  ${e.program.length ? `<div class="timeline">${e.program.map(([t, w, who]) => `<div class="tl"><span class="time num">${t}</span><span class="pin"></span><span><b>${w}</b><div class="who">${who}</div></span></div>`).join("")}</div>` : `<div class="card-b"><p class="sub" style="margin:0">Programul nu a fost completat încă. ${e.incomplete || ""}</p></div>`}</div>`;

  if (S.tab === "room") return `
  <section class="grid-2">
    <div class="card"><div class="card-h"><h2>Plan ${hallName(e.hall)}</h2><span class="chip plain num">${Math.ceil(total / 10)} mese</span></div><div class="card-b floor">${floor(e, total)}</div></div>
    <div class="card"><div class="card-h"><h2>Aranjare</h2></div><div class="card-b"><dl class="kv">
      <dt>Mese</dt><dd class="num">${Math.ceil(total / 10)} rotunde × 10 persoane</dd>
      <dt>Masa principală</dt><dd>${e.type === "nunta" ? "Masa mirilor, lângă ring" : "Prezidiu"}</dd>
      <dt>Ring de dans</dt><dd>Central, 10 × 8 m</dd>
      <dt>Ospătari</dt><dd class="num">${Math.ceil(total / 15)} (1 la 15 invitați)</dd>
      <dt>Montaj</dt><dd class="num">${e.start === "13:00" ? "08:00–12:00" : "12:00–16:00"}</dd>
      <dt>Atenție</dt><dd>${e.special.filter(s => s[0].startsWith("Alergie")).map(s => s[2]).join("; ") || "Fără observații"}</dd>
    </dl></div></div>
  </section>`;

  if (S.tab === "vendors") return `
  <div class="card tbl-wrap"><table style="min-width:560px"><thead><tr><th>Serviciu</th><th>Furnizor</th><th>Logistică</th></tr></thead><tbody>
    ${e.vendors.length ? e.vendors.map(([s, n, l]) => `<tr><td class="t">${s}</td><td>${n}</td><td class="m">${l || "—"}</td></tr>`).join("") : `<tr><td colspan="3" class="m" style="padding:24px 16px">Niciun furnizor extern.</td></tr>`}
  </tbody></table></div>`;

  if (S.tab === "payments") return `
  <div class="card tbl-wrap"><table style="min-width:620px"><thead><tr><th>Tranșă</th><th>Scadență</th><th class="right">Sumă</th><th>Status</th><th></th></tr></thead><tbody>
    ${e.payments.length ? e.payments.map((p, i) => `<tr><td class="t">${p.label}</td><td class="num">${fmtLong(p.due)}</td><td class="right num">${lei(p.amount)}</td><td>${chip(PAY_CHIP[payState(p)])}</td><td class="right">${p.paid ? "" : `<button class="btn sm" data-action="pay" data-id="${e.id}" data-i="${i}">Marchează încasat</button>`}</td></tr>`).join("") : `<tr><td colspan="5" class="m" style="padding:24px 16px">Graficul de plăți se generează la semnarea contractului.</td></tr>`}
  </tbody></table></div>`;

  return `<div class="card"><div class="card-h"><h2>Istoricul modificărilor</h2></div><div class="hist">${e.history.map(([t, w, m]) => `<div><span>${t}</span><span style="color:var(--fg)"><b>${w}</b> · ${m}</span></div>`).join("")}</div></div>`;
}

function floor(e, total) {
  const n = Math.ceil(total / 10);
  const pos = [];
  [50, 110, 170].forEach(x => [100, 160, 220, 280, 340].forEach(y => pos.push([x, y])));
  [430, 490, 550].forEach(x => [100, 160, 220, 280, 340].forEach(y => pos.push([x, y])));
  [255, 345].forEach(x => pos.push([x, 330]));
  pos.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  const allergy = e.special.some(s => s[0].startsWith("Alergie")) ? 12 : -1;
  let g = `<rect x="200" y="22" width="200" height="30" rx="6" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="300" y="41" text-anchor="middle">${e.type === "nunta" ? "Masa mirilor" : "Prezidiu"}</text>`;
  g += `<rect x="215" y="120" width="170" height="160" rx="10" fill="var(--surface-2)" stroke="var(--line)" stroke-dasharray="4 4"/><text x="300" y="204" text-anchor="middle" style="fill:var(--muted)">Ring de dans</text>`;
  pos.slice(0, Math.min(n, pos.length)).forEach(([x, y], i) => {
    const k = i + 1, a = k === allergy;
    g += `<circle cx="${x}" cy="${y}" r="21" fill="${a ? "var(--danger-soft)" : "var(--surface)"}" stroke="${a ? "var(--danger)" : "var(--chrome-dim)"}" stroke-width="${a ? 2 : 1}"/><text x="${x}" y="${y + 4}" text-anchor="middle">${k}</text>`;
  });
  return `<svg viewBox="0 0 600 380" role="img" aria-label="Planul sălii cu ${n} mese">${g}</svg>${allergy > 0 ? `<p class="sub" style="font-size:12.5px;margin:10px 0 0"><span class="chip bad">Masa 12</span> are un invitat cu alergie la nuci.</p>` : ""}`;
}

function viewSales() {
  const sum = st => LEADS.filter(l => l.stage === st).reduce((s, l) => s + l.value, 0);
  return `
  <div class="head">
    <div><p class="eyebrow">Vânzări și oferte</p><h1>De la cerere la contract</h1><p class="sub">Fiecare cerere are un pas următor. Contractul semnat creează automat fișa evenimentului.</p></div>
    <button class="btn primary" data-action="new-event">${icon("plus")}Cerere nouă</button>
  </div>
  <div class="board">${STAGES.map(([k, t], si) => `
    <div class="col"><div class="col-h"><b>${t}</b><span class="num">${LEADS.filter(l => l.stage === k).length} · ${lei(sum(k))}</span></div>
    ${LEADS.filter(l => l.stage === k).map(l => `<div class="lead">
      <div><div class="t">${l.name}</div><div class="m num">${fmtLong(l.date)} · ${l.guests} pers.</div></div>
      <div class="m">${l.note}</div>
      <div class="f"><span class="chip plain">${l.source}</span><b class="num">${lei(l.value)}</b></div>
      ${si < 3 ? `<button class="btn sm" data-action="advance" data-id="${l.id}">${["Trimite oferta", "Pune opțiune pe dată", "Semnează contractul"][si]} ${icon("right")}</button>` : ""}
    </div>`).join("")}</div>`).join("")}
  </div>`;
}

function viewPayments() {
  const all = [];
  EV.forEach(e => e.payments.forEach((p, i) => all.push({ e, p, i, st: payState(p) })));
  const open = all.filter(x => x.st !== "paid").sort((a, b) => a.p.due.localeCompare(b.p.due));
  const month = TODAY.slice(0, 7);
  const sumOf = arr => arr.reduce((s, x) => s + x.p.amount, 0);
  return `
  <div class="head"><div><p class="eyebrow">Plăți</p><h1>Încasări de urmărit</h1><p class="sub">Avansurile și tranșele tuturor evenimentelor confirmate, în ordinea scadenței.</p></div></div>
  <section class="kpis">
    <div class="card kpi"><span class="label">Restanțe</span><span class="value num" style="color:var(--danger)">${lei(sumOf(open.filter(x => x.st === "overdue")))}</span><span class="note">${open.filter(x => x.st === "overdue").length} tranșe</span></div>
    <div class="card kpi"><span class="label">Scadente în 14 zile</span><span class="value num">${lei(sumOf(open.filter(x => x.st === "soon")))}</span><span class="note">${open.filter(x => x.st === "soon").length} tranșe</span></div>
    <div class="card kpi"><span class="label">Programate</span><span class="value num">${lei(sumOf(open.filter(x => x.st === "scheduled")))}</span><span class="note">după 14 zile</span></div>
    <div class="card kpi"><span class="label">Încasat în ${MON_FULL[toDate(TODAY).getMonth()]}</span><span class="value num">${lei(sumOf(all.filter(x => x.st === "paid" && x.p.due.startsWith(month))))}</span><span class="note">Facturile ajung în programul de facturare</span></div>
  </section>
  <div class="card tbl-wrap"><table><thead><tr><th>Scadență</th><th>Eveniment</th><th>Tranșă</th><th class="right">Sumă</th><th>Status</th><th></th></tr></thead><tbody>
  ${open.map(({ e, p, i, st }) => `<tr><td><div class="t num">${fmtShort(p.due)}</div><div class="m">${inDays(diffDays(p.due, TODAY))}</div></td><td><button class="link" style="color:var(--fg);text-align:left" data-action="open" data-id="${e.id}">${e.title}</button><div class="m">${fmtLong(e.date)}</div></td><td>${p.label}</td><td class="right num">${lei(p.amount)}</td><td>${chip(PAY_CHIP[st])}</td><td class="right"><button class="btn sm" data-action="pay" data-id="${e.id}" data-i="${i}">Marchează încasat</button></td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ---------- Modals ---------- */
function modalHTML() {
  if (!S.modal) return "";
  const e = EV.find(x => x.id === S.eventId);
  if (S.modal === "guests") {
    return `<div class="overlay" data-action="close-modal"><form class="modal" id="guestForm" role="dialog" aria-modal="true" aria-labelledby="mg">
      <div class="modal-h"><h2 id="mg">Modifică invitații · ${e.title}</h2><button type="button" class="x" data-action="close-modal" aria-label="Închide">×</button></div>
      <div class="modal-b">
        <div class="fields">
          <div class="field"><label for="fa">Adulți</label><input id="fa" type="number" min="0" max="400" value="${e.adults}"></div>
          <div class="field"><label for="fk">Copii (50% din preț)</label><input id="fk" type="number" min="0" max="100" value="${e.kids}"></div>
        </div>
        <div class="field"><label for="fn">Motiv (opțional)</label><input id="fn" type="text" placeholder="De exemplu: au confirmat încă 12 invitați din diaspora"></div>
        <div class="diff" id="diff"></div>
      </div>
      <div class="modal-f"><button type="button" class="btn" data-action="close-modal">Renunță</button><button type="submit" class="btn primary">Salvează și anunță departamentele</button></div>
    </form></div>`;
  }
  if (S.modal === "kitchen") {
    const total = e.adults + e.kids;
    return `<div class="overlay" data-action="close-modal"><div class="modal wide kitchen" role="dialog" aria-modal="true" aria-labelledby="mk">
      <div class="modal-h"><div><p class="eyebrow" style="margin:0 0 4px">Fișa pentru bucătărie</p><h2 id="mk">${e.title} · ${fmtLong(e.date)} · ${hallName(e.hall)}</h2></div><button class="x" data-action="close-modal" aria-label="Închide">×</button></div>
      <div class="modal-b">
        <div><h3>Porții</h3><div class="tbl-wrap"><table><thead><tr><th>Ora</th><th>Preparat</th><th class="right">Adulți</th><th class="right">Copii</th><th class="right">Total</th></tr></thead><tbody>
        ${PKG[e.pkg].courses.map(([k, t]) => { const pr = e.program.find(p => p[1].toLowerCase().includes(k.toLowerCase().slice(0, 5))); return `<tr><td class="num">${pr ? pr[0] : /^\d/.test(k) ? k : "—"}</td><td class="t">${t}</td><td class="right num">${e.adults}</td><td class="right num">${e.kids}</td><td class="right num"><b>${total}</b></td></tr>`; }).join("")}
        </tbody></table></div></div>
        <div><h3>Meniuri speciale</h3><div class="special">${e.special.map(([t, n, m]) => `<div><span><b>${t}</b> · ${m}</span><b class="num">${n}</b></div>`).join("")}</div></div>
        <p class="sub" style="margin:0;font-size:12.5px">Fișa se actualizează automat la fiecare modificare. Ultima modificare: ${e.history[0][0]}, ${e.history[0][1]}.</p>
      </div>
      <div class="modal-f"><button class="btn" data-action="close-modal">Închide</button></div>
    </div></div>`;
  }
  if (S.modal === "new") {
    return `<div class="overlay" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mn">
      <div class="modal-h"><h2 id="mn">Eveniment nou</h2><button class="x" data-action="close-modal" aria-label="Închide">×</button></div>
      <div class="modal-b"><p style="margin:0">În versiunea finală, aici se introduce o cerere nouă: client, dată, sală, număr de invitați și pachet. Sistemul verifică pe loc dacă sala e liberă și generează oferta în PDF.</p>
      <p class="sub" style="margin:0">În această simulare, încearcă fluxul pe un eveniment existent: deschide <b>Nunta Andreea & Mihai</b> și modifică numărul de invitați.</p></div>
      <div class="modal-f"><button class="btn" data-action="close-modal">Închide</button><button class="btn primary" data-action="open" data-id="e1">Deschide Nunta Andreea & Mihai</button></div>
    </div></div>`;
  }
  return "";
}

function updateDiff() {
  const e = EV.find(x => x.id === S.eventId);
  const a = Math.max(0, parseInt(document.getElementById("fa").value, 10) || 0);
  const k = Math.max(0, parseInt(document.getElementById("fk").value, 10) || 0);
  const nv = a * PKG[e.pkg].pp + Math.round(k * PKG[e.pkg].pp * 0.5), ov = value(e);
  const d = nv - ov;
  const tablesOld = Math.ceil((e.adults + e.kids) / 10), tablesNew = Math.ceil((a + k) / 10);
  const cap = HALLS.find(h => h.id === e.hall).cap;
  document.getElementById("diff").innerHTML = `
    <span>Valoare nouă: <b class="num">${lei(nv)}</b> <span style="color:${d >= 0 ? "var(--accent)" : "var(--danger)"}" class="num">(${d >= 0 ? "+" : "−"}${lei(Math.abs(d))})</span></span>
    <span>Mese: <b class="num">${tablesOld} → ${tablesNew}</b> · Ospătari: <b class="num">${Math.ceil((e.adults + e.kids) / 15)} → ${Math.ceil((a + k) / 15)}</b></span>
    ${a + k > cap ? `<span style="color:var(--danger)"><b>Atenție:</b> ${hallName(e.hall)} are capacitate de ${cap} persoane.</span>` : `<span style="color:var(--muted)">Vor fi anunțate: Bucătăria, Sala și Barul. Diferența se adaugă la soldul final.</span>`}`;
}

/* ---------- Render ---------- */
function render() {
  renderNav();
  const V = { dashboard: viewDashboard, calendar: viewCalendar, events: viewEvents, event: viewEvent, sales: viewSales, payments: viewPayments };
  document.getElementById("page").innerHTML = V[S.view]();
  document.getElementById("layer").innerHTML = modalHTML();
  if (S.modal === "guests") { updateDiff(); document.getElementById("fa").focus(); }
}

let toastTimer;
function toast(msg) {
  clearTimeout(toastTimer);
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.innerHTML = `<i></i><span>${msg}</span>`;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 4200);
}

function go(view) { S.view = view; S.modal = null; document.getElementById("app").classList.remove("open"); render(); window.scrollTo(0, 0); }

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "close-modal" && el.classList.contains("overlay") && ev.target !== el) return;
  if (a === "go") go(el.dataset.view);
  else if (a === "open") { S.eventId = el.dataset.id; S.tab = "overview"; go("event"); }
  else if (a === "tab") { S.tab = el.dataset.t; render(); }
  else if (a === "filter") { S.filter = el.dataset.f; render(); }
  else if (a === "week") { const d = +el.dataset.d; S.week = d === 0 ? mondayOf(TODAY) : addDays(S.week, d); render(); }
  else if (a === "open-menu") document.getElementById("app").classList.add("open");
  else if (a === "close-menu") document.getElementById("app").classList.remove("open");
  else if (a === "edit-guests") { S.modal = "guests"; render(); }
  else if (a === "kitchen") { S.modal = "kitchen"; render(); }
  else if (a === "new-event") { S.modal = "new"; render(); }
  else if (a === "close-modal") { S.modal = null; render(); }
  else if (a === "confirm-dept") {
    const e = EV.find(x => x.id === S.eventId), d = DEPTS.find(x => x.id === el.dataset.d);
    e.depts[d.id] = "ok";
    e.history.unshift(["acum", d.owner, `${d.name}: a confirmat ultima versiune a fișei.`]);
    render(); toast(`${d.name} a confirmat fișa evenimentului.`);
  }
  else if (a === "pay") {
    const e = EV.find(x => x.id === el.dataset.id), p = e.payments[+el.dataset.i];
    p.paid = true; e.history.unshift(["acum", "Ioana Marin", `${p.label} încasată: ${lei(p.amount)}.`]);
    render(); toast(`${lei(p.amount)} marcat ca încasat pentru ${e.title}.`);
  }
  else if (a === "advance") {
    const l = LEADS.find(x => x.id === el.dataset.id), i = STAGES.findIndex(s => s[0] === l.stage);
    l.stage = STAGES[i + 1][0];
    l.note = ["", "Oferta a fost trimisă azi pe email", "Data e ținută 7 zile", "Fișa evenimentului creată"][i + 1];
    render(); toast(i + 1 === 3 ? `Contract semnat: ${l.name}. Fișa a fost trimisă departamentelor.` : `${l.name}: ${STAGES[i + 1][1].toLowerCase()}.`);
  }
  else if (a === "sign") {
    const e = EV.find(x => x.id === el.dataset.id);
    e.status = "confirmat"; e.payments = buildPayments(e); e.payments.forEach((p, i) => { p.paid = i === 0; });
    DEPTS.forEach(d => { e.depts[d.id] = "pending"; });
    e.history.unshift(["acum", "Ioana Marin", "Contract semnat. Fișa a fost trimisă tuturor departamentelor."]);
    const l = LEADS.find(x => x.name.includes(e.title.replace("Nunta ", "").split(" ")[0]) && x.stage === "optiune"); if (l) l.stage = "contract";
    render(); toast("Contract semnat. Bucătăria, Sala, Barul și Recepția au primit fișa.");
  }
});

document.addEventListener("input", ev => { if (ev.target.id === "fa" || ev.target.id === "fk") updateDiff(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.modal) { S.modal = null; render(); } });

document.addEventListener("submit", ev => {
  if (ev.target.id !== "guestForm") return;
  ev.preventDefault();
  const e = EV.find(x => x.id === S.eventId);
  const a = Math.max(0, parseInt(document.getElementById("fa").value, 10) || 0);
  const k = Math.max(0, parseInt(document.getElementById("fk").value, 10) || 0);
  const note = document.getElementById("fn").value.trim();
  if (a === e.adults && k === e.kids) { S.modal = null; render(); return; }
  const ov = value(e), oa = e.adults, ok = e.kids;
  e.adults = a; e.kids = k;
  const kidsMenu = e.special.find(s => s[0] === "Meniu copii"); if (kidsMenu) kidsMenu[1] = k;
  const last = e.payments.find(p => !p.paid); if (last) last.amount += value(e) - ov;
  ["bucatarie", "sala", "bar"].forEach(d => { e.depts[d] = "pending"; });
  e.history.unshift(["acum", "Ioana Marin", `Invitați: ${oa} → ${a} adulți, ${ok} → ${k} copii.${note ? " " + note + "." : ""} Bucătăria, Sala și Barul trebuie să confirme.`]);
  S.modal = null; render();
  toast("Modificare salvată. Bucătăria, Sala și Barul au fost anunțate.");
});

document.getElementById("q").addEventListener("input", ev => { S.q = ev.target.value; if (S.view !== "events") { S.view = "events"; S.filter = "toate"; } render(); ev.target.focus(); });

const roleSel = document.getElementById("role");
roleSel.value = S.role;
roleSel.addEventListener("change", () => {
  S.role = roleSel.value;
  try { localStorage.setItem("emerald-role", S.role); } catch (_) {}
  if (!NAV.find(n => n.id === S.view || (S.view === "event" && n.id === "events")).roles.includes(S.role)) S.view = "events";
  render();
  toast({ manager: "Vizualizare Manager: vezi tot.", bucatarie: "Vizualizare Bucătărie: doar meniuri, porții și program.", sala: "Vizualizare Șef de sală: mese, program și furnizori." }[S.role]);
});

if (S.role !== "manager" && S.view === "dashboard") S.view = "events";
render();
})();
</script>
