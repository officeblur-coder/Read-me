<title>Emerald Event Manager</title>
<meta name="description" content="Prototip: soft de gestiune a evenimentelor pentru Emerald Luxury Events">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: graphite brand sidebar + calm working area. The event sheet and the seating plan are the heart of the product. */
:root {
  --ink: #121416; --ink-2: #1B1E21; --chrome: #C8CDD1; --chrome-dim: #858C92;
  --bg: #F3F4F3; --surface: #FFFFFF; --surface-2: #F7F8F7; --fg: #1A1D1F; --muted: #69706C; --line: #E2E5E3;
  --accent: #0E6B50; --accent-fg: #FFFFFF; --accent-soft: #E2F0EA;
  --veg: #4E7D22; --veg-soft: #EAF3DF;
  --amber: #A86A12; --amber-soft: #FBF0DC; --slate: #4F6480; --slate-soft: #E8EDF3; --danger: #B42318; --danger-soft: #FCEAE8;
  --wa: #1F8F4E;
  --shadow: 0 1px 2px rgba(18,20,22,.05), 0 4px 16px rgba(18,20,22,.04);
  --font-display: "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #0B0C0D; --ink-2: #15181A; --chrome: #C8CDD1; --chrome-dim: #7D858B;
    --bg: #101213; --surface: #171A1C; --surface-2: #1C2022; --fg: #E7EAE8; --muted: #9AA19D; --line: #2A2F2F;
    --accent: #3DB389; --accent-fg: #0B0C0D; --accent-soft: #15322A; --veg: #93C35F; --veg-soft: #22301A;
    --amber: #E3AA4D; --amber-soft: #382B15; --slate: #A3B4C8; --slate-soft: #1F2731; --danger: #F2806F; --danger-soft: #3A1B17;
    --wa: #3CC274; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #0B0C0D; --ink-2: #15181A; --chrome: #C8CDD1; --chrome-dim: #7D858B;
  --bg: #101213; --surface: #171A1C; --surface-2: #1C2022; --fg: #E7EAE8; --muted: #9AA19D; --line: #2A2F2F;
  --accent: #3DB389; --accent-fg: #0B0C0D; --accent-soft: #15322A; --veg: #93C35F; --veg-soft: #22301A;
  --amber: #E3AA4D; --amber-soft: #382B15; --slate: #A3B4C8; --slate-soft: #1F2731; --danger: #F2806F; --danger-soft: #3A1B17;
  --wa: #3CC274; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--ink); color: var(--chrome); display: flex; flex-direction: column; gap: 26px; padding: 28px 16px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0; }
.brand svg { width: 38px; height: 30px; flex: none; }
.word { font-family: var(--font-display); font-weight: 300; font-size: 23px; letter-spacing: .32em; margin-right: -.32em; color: #E9ECEE; line-height: 1; }
.word-sub { font-family: var(--font-display); font-weight: 400; font-size: 9.5px; letter-spacing: .42em; margin-right: -.42em; color: var(--chrome-dim); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-family: var(--font-display); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--chrome-dim); padding: 0 12px 8px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; color: var(--chrome); padding: 9px 12px; border-radius: 8px; text-align: left; font-weight: 500; transition: background .15s, color .15s; }
.nav button:hover { background: var(--ink-2); color: #fff; }
.nav button.on { background: var(--ink-2); color: #fff; box-shadow: inset 0 0 0 1px #2A2F33; }
.nav button svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav .count { margin-left: auto; font-size: 11.5px; background: #2A2F33; color: #E9ECEE; border-radius: 999px; padding: 1px 8px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 12px; border-top: 1px solid #23272A; }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #2A2F33; color: #E9ECEE; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.who b { display: block; color: #E9ECEE; font-weight: 600; font-size: 13px; }
.who span { font-size: 12px; color: var(--chrome-dim); }
.reset { background: none; border: 1px solid #2A2F33; color: var(--chrome-dim); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
.reset:hover { color: #fff; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 32px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; place-items: center; }
.search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; height: 38px; }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.demo-badge { font-size: 11.5px; font-weight: 600; color: var(--amber); background: var(--amber-soft); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.role { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
select, .input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 38px; padding: 0 10px; color: var(--fg); min-width: 0; }
.role select { font-weight: 600; }
textarea.input { height: auto; padding: 9px 10px; resize: vertical; }

.page { padding: 28px 32px 56px; display: flex; flex-direction: column; gap: 22px; max-width: 1380px; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-family: var(--font-display); font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: .01em; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; }
.small { font-size: 12.5px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-b { padding: 16px 20px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rowflex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0; text-align: left; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, filter .15s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn.wa:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.btn.solid-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.x { background: none; border: 0; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--danger); background: var(--danger-soft); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.kpi .value { font-size: 25px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.kpi .note { font-size: 12.5px; color: var(--muted); }
.kpi .note b { color: var(--fg); font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }

.side-panel .chip { white-space: normal; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--accent); background: var(--accent-soft); }
.chip.warn { color: var(--amber); background: var(--amber-soft); }
.chip.info { color: var(--slate); background: var(--slate-soft); }
.chip.bad { color: var(--danger); background: var(--danger-soft); }
.chip.veg { color: var(--veg); background: var(--veg-soft); }
.chip.plain { color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); }
.chip.plain::before, .chip.nodot::before { display: none; }

.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 20px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.when { display: flex; flex-direction: column; line-height: 1.25; }
.when b { font-size: 13px; }
.when span { font-size: 12px; color: var(--muted); }
.t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.row .t, .row .m { white-space: nowrap; }
.m { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 26px 20px; color: var(--muted); }

.alert { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 20px 13px 0; border-top: 1px solid var(--line); }
.alert:first-child { border-top: 0; }
.alert .bar { align-self: stretch; border-radius: 0 3px 3px 0; }
.alert.bad .bar { background: var(--danger); } .alert.warn .bar { background: var(--amber); } .alert.info .bar { background: var(--slate); }
.alert .t { font-size: 13.5px; }

.sat { display: grid; grid-template-columns: 96px repeat(8, minmax(0, 1fr)); gap: 6px; align-items: center; font-size: 12.5px; }
.sat .h { color: var(--muted); font-size: 11px; text-align: center; }
.sat .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sat .c { height: 26px; border-radius: 6px; background: var(--surface-2); border: 1px dashed var(--line); }
.sat .c.ok { background: var(--accent); border: 0; } .sat .c.warn { background: var(--amber-soft); border: 1px solid var(--amber); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: 160px repeat(7, minmax(128px, 1fr)); min-width: 1060px; }
.cal > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.cal > div:nth-child(8n) { border-right: 0; }
.cal .dh { padding: 12px; font-size: 12px; color: var(--muted); background: var(--surface-2); }
.cal .dh b { display: block; font-size: 17px; color: var(--fg); font-weight: 700; }
.cal .dh.today { background: var(--accent-soft); } .cal .dh.today b { color: var(--accent); }
.cal .hall { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.cal .hall b { font-size: 13.5px; } .cal .hall span { font-size: 12px; color: var(--muted); }
.cal .cell { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; }
.cal .cell.today { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.ev { text-align: left; border: 0; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 1.35; width: 100%; color: var(--fg); transition: transform .15s; }
.ev:hover { transform: translateY(-1px); }
.ev b { font-size: 12.5px; font-weight: 700; }
.ev span { color: var(--muted); }
.ev.confirmat { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.ev.optiune { background: var(--amber-soft); box-shadow: inset 3px 0 0 var(--amber); }
.free { flex: 1; min-height: 40px; border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--muted); font-size: 12px; opacity: 0; transition: opacity .15s; }
.cell:hover .free, .free:focus-visible { opacity: 1; }
@media (hover: none) { .free { opacity: .7; } }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; align-self: flex-start; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 820px; }
th { text-align: left; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--surface-2); }
.right { text-align: right; }
.progress { height: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; min-width: 80px; }
.progress i { display: block; height: 100%; background: var(--accent); }

.back { background: none; border: 0; color: var(--muted); font-weight: 600; padding: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.back svg { width: 16px; height: 16px; }
.back:hover { color: var(--fg); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 13.5px; margin-top: 10px; }
.meta b { color: var(--fg); font-weight: 600; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px 16px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.counts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.count-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
.count-box b { display: block; font-size: 20px; font-weight: 700; }
.count-box span { font-size: 12px; color: var(--muted); }
.contact-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.contact-line .val { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }

.variants { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.variant { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.variant b { font-size: 13px; } .variant span { font-size: 12px; color: var(--muted); }
.variant.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.items { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 20px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .i { color: var(--muted); font-size: 12px; font-weight: 700; }
.item .name { font-weight: 600; font-size: 13.5px; min-width: 0; }
.item .from { margin-left: 8px; }
.item .tools { display: flex; gap: 4px; align-items: center; }
.item input.input { width: 100%; height: 34px; }
.price-box { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .input, .field select, .field textarea { width: 100%; }
.big { font-size: 22px; font-weight: 700; line-height: 1.2; }
.strike { text-decoration: line-through; color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 6px; }

.note { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
.note:first-child { border-top: 0; }
.note p { margin: 6px 0 8px; }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.toggle.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.checks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }

.plan-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.plan { width: 100%; height: auto; display: block; background: var(--surface-2); border-radius: 8px; user-select: none; -webkit-user-select: none; }
.plan.edit { touch-action: none; }
.plan text { font-family: var(--font-body); }
.plan .tbl { cursor: pointer; }
.plan.edit .tbl { cursor: grab; }
.side-panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.adds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.adds .btn { padding: 0 6px; }
.guest { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.guest:first-child { border-top: 0; }
.guest .gn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banner { border-radius: var(--r); padding: 14px 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.ok { background: var(--accent-soft); } .banner.warn { background: var(--amber-soft); }
.banner svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; }

.client-top { background: var(--ink); color: var(--chrome); padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-radius: var(--r); }
.client-top .brand { flex-direction: row; gap: 14px; padding: 0; }
.client-top .brand-text { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.client-top .word { font-size: 18px; }
.client-mode .side, .client-mode .top { display: none; }
.client-mode.app { grid-template-columns: minmax(0, 1fr); }
.exit { background: none; border: 1px solid #2A2F33; color: var(--chrome); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start; }

/* ===== Money ===== */
function price(e) { return e.customPrice ?? e.menu.std; }
function value(e) { return Math.round(e.adults * price(e) + e.kids * price(e) * e.kidsPct / 100); }
const paidSum = e => e.payments.filter(p => p.paid).reduce((s, p) => s + p.amount, 0);
const payState = p => p.paid ? "paid" : p.due < TODAY ? "overdue" : diffDays(p.due, TODAY) <= 14 ? "soon" : "scheduled";
const PAY_CHIP = { paid: ["ok", "Încasat"], overdue: ["bad", "Restant"], soon: ["warn", "Scadent curând"], scheduled: ["plain", "Programat"] };
const STATUS_CHIP = { confirmat: ["ok", "Confirmat"], optiune: ["warn", "Opțiune"] };
function syncPayments(e) {
  if (e.status !== "confirmat" || !e.payments.length) return;
  const remaining = value(e) - paidSum(e);
  const open = e.payments.filter(p => !p.paid);
  if (!open.length) { if (remaining > 0) e.payments.push({ label: "Diferență după modificare", amount: remaining, due: addDays(e.date, -3) < TODAY ? TODAY : addDays(e.date, -3), paid: false }); return; }
  const cur = open.reduce((s, p) => s + p.amount, 0);
  let left = remaining;
  open.forEach((p, i) => { p.amount = i === open.length - 1 ? left : Math.round(cur ? p.amount / cur * remaining : remaining / open.length); left -= p.amount; });
}

  const list = upcoming().filter(F[S.filter] || F.toate).filter(e => !q || `${e.title} ${e.contact.name} ${hall(e.hall).name}`.toLowerCase().includes(q));
  const labels = [["toate", "Toate"], ["saptamana", "Săptămâna aceasta"], ["nunta", "Nunți"], ["botez", "Botezuri"], ["corporate", "Corporate"], ["optiuni", "Opțiuni"]];
  const M = isManager();
  return `
  <div class="head">
    <div><p class="eyebrow">Evenimente${roleHall() ? " · " + hall(roleHall()).name : ""}</p><h1>Următoarele evenimente</h1><p class="sub">${list.length} ${list.length === 1 ? "eveniment" : "evenimente"}${q ? ` pentru „${esc(S.q)}”` : ""}</p></div>
    ${M ? `<button class="btn primary" data-action="new-event">${icon("plus")}Eveniment nou</button>` : ""}
  </div>
  <div class="seg">${labels.map(([k, t]) => `<button class="${S.filter === k ? "on" : ""}" data-action="filter" data-f="${k}">${t}</button>`).join("")}</div>
  <div class="card tbl-wrap"><table>
    <thead><tr><th>Data</th><th>Eveniment</th><th>Salon</th><th class="right">Invitați</th><th>Meniu</th>${M ? `<th class="right">Valoare</th><th>Încasat</th>` : ""}<th>Status</th></tr></thead>
    <tbody>${list.map(e => { const v = value(e), p = paidSum(e); return `<tr class="click" data-action="open" data-id="${e.id}">
      <td><div class="t num">${fmtShort(e.date)}</div><div class="m">${DAYS[toDate(e.date).getDay()]} · ${e.start}</div></td>
      <td><div class="t">${esc(e.title)}</div><div class="m">${TYPES[e.type]}${M ? ` · ${esc(e.contact.name)}` : ""}</div></td>
      <td>${hall(e.hall).name}</td><td class="right num">${guestTotal(e)}</td>
      <td><div class="t">${esc(menuName(e))}</div>${M ? `<div class="m num">${lei(price(e))}/pers.${e.customPrice ? " · ajustat" : ""}</div>` : ""}</td>
      ${M ? `<td class="right num">${lei(v)}</td><td>${e.payments.length ? `<div class="progress"><i style="width:${Math.min(100, Math.round(p / v * 100))}%"></i></div>` : `<span class="m">—</span>`}</td>` : ""}
      <td>${chip(STATUS_CHIP[e.status])}</td></tr>`; }).join("") || `<tr><td colspan="8" class="empty">Niciun eveniment nu se potrivește.</td></tr>`}</tbody>
  </table></div>`;
}

/* ===== Event sheet ===== */
function viewEvent() {
  const e = getEv(S.eventId);
  if (!e || !canSeeEvent(e)) { S.view = "events"; return viewEvents(); }
  const M = isManager();
  const all = { overview: "Prezentare", menu: M ? "Meniu și preț" : "Meniu", notes: M ? "Note și departamente" : "Note", seating: "Aranjare sală", payments: "Plăți", history: "Istoric" };
  const allowed = M ? Object.keys(all) : S.role === "bucatarie" ? ["overview", "menu", "notes"] : ["overview", "menu", "notes", "seating"];
  if (!allowed.includes(S.tab)) S.tab = "overview";
  return `
  <div class="head">
    <div style="min-width:0">
      <button class="back" data-action="go" data-view="events">${icon("left")}Evenimente</button>
      <div class="rowflex" style="margin-top:10px;gap:10px"><h1>${esc(e.title)}</h1>${chip(STATUS_CHIP[e.status])}<span class="chip plain">${TYPES[e.type]}</span></div>
      <div class="meta"><span><b>${fmtLong(e.date)}</b> · ${inDays(diffDays(e.date, TODAY))}</span><span><b class="num">${e.start}–${e.end}</b></span><span><b>${hall(e.hall).name}</b></span><span><b class="num">${e.adults}</b> adulți, <b class="num">${e.kids}</b> copii</span></div>
    </div>
    <div class="actions">
      ${M ? `<button class="btn" data-action="edit-event">${icon("edit")}Editează detaliile</button>` : ""}
      ${canArrange(e) ? `<button class="btn primary" data-action="share" ${e.layout.tables.length ? "" : "disabled"} title="${e.layout.tables.length ? "Trimite planul de mese clientului" : "Aranjează mai întâi mesele"}">${icon("share")}Distribuie așezarea</button>` : ""}
    </div>
  </div>
  ${e.status === "optiune" && M ? `<div class="banner warn"><span>Data este ținută până pe <b>${fmtLong(e.optionExpires)}</b> (${inDays(diffDays(e.optionExpires, TODAY))}).</span><button class="btn primary sm" data-action="sign">Marchează contractul semnat</button></div>` : ""}
  <div class="tabs" role="tablist">${allowed.map(k => `<button class="${S.tab === k ? "on" : ""}" data-action="tab" data-t="${k}" role="tab" aria-selected="${S.tab === k}">${all[k]}</button>`).join("")}</div>
  ${({ overview: tabOverview, menu: tabMenu, notes: tabNotes, seating: tabSeating, payments: tabPayments, history: tabHistory })[S.tab](e)}`;
}

function countsHTML(e) {
  const vegS = dietCount(e, "vegetarian"), allS = e.layout.guests.filter(g => g.diet === "alergie");
  return `<div class="counts">
    <div class="count-box"><b class="num">${e.adults}</b><span>Adulți</span></div>
    <div class="count-box"><b class="num">${e.kids}</b><span>Copii · meniu copii</span></div>
    <div class="count-box"><b class="num">${Math.max(e.vegCount, vegS)}</b><span>Vegetarieni${vegS ? ` · ${vegS} în lista de mese` : ""}</span></div>
    <div class="count-box"><b class="num">${allS.length}</b><span>Alergii în lista de mese</span></div>
  </div>
  ${allS.length ? `<div class="stack small">${allS.map(g => { const t = e.layout.tables.find(x => x.id === g.table); return `<div class="rowflex">${chip(["bad", "Alergie"])}<span><b>${esc(g.name)}</b>${g.note ? ` · ${esc(g.note)}` : ""} · ${t ? tableName(t).toLowerCase() : "fără masă"}</span></div>`; }).join("")}</div>` : ""}`;

function tabHistory(e) {
  return `<div class="card"><div class="card-h"><h2>Istoricul modificărilor</h2></div><div>${e.history.map(([t, w, m]) => `<div class="note" style="grid-template-columns:120px minmax(0,1fr)"><span class="muted small">${esc(t)}</span><span><b>${esc(w)}</b> · ${esc(m)}</span></div>`).join("")}</div></div>`;
}

/* ===== Seating plan ===== */
function planSVG(e, mode, sel) {
  const h = hall(e.hall), L = e.layout, cx = h.W / 2, cy = h.H / 2 + 30;
  let g = `<rect x="${cx - 150}" y="${cy - 110}" width="300" height="220" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="18" font-weight="600" fill="var(--muted)">Ring de dans</text>`;
  const dotFill = gu => !gu ? "var(--surface)" : gu.diet === "vegetarian" ? "var(--veg)" : gu.diet === "copil" ? "var(--slate)" : gu.diet === "alergie" ? "var(--danger)" : "var(--accent)";
  L.tables.forEach(t => {
    const gs = guestsAt(L, t.id);
    const veg = gs.some(x => x.diet === "vegetarian"), alg = gs.some(x => x.diet === "alergie");
    const on = sel === t.id;
    let inner = "";
    if (t.kind === "head") {
      const w = Math.max(200, t.seats * 30);
      inner += `<rect x="${-w / 2}" y="-24" width="${w}" height="48" rx="8" fill="${on ? "var(--accent-soft)" : "var(--surface)"}" stroke="${on ? "var(--accent)" : "var(--chrome-dim)"}" stroke-width="${on ? 3 : 1.5}"/>
        <text y="6" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)">Masa mirilor</text>`;
      for (let i = 0; i < t.seats; i++) inner += `<circle cx="${-w / 2 + (i + 0.5) * (w / t.seats)}" cy="36" r="7" fill="${dotFill(gs[i])}" stroke="var(--chrome-dim)" stroke-width="1"/>`;
    } else {
      const r = SEATS_R[t.seats] || 38;
      inner += `<circle r="${r}" fill="${on ? "var(--accent-soft)" : veg ? "var(--veg-soft)" : "var(--surface)"}" stroke="${on ? "var(--accent)" : alg ? "var(--danger)" : "var(--chrome-dim)"}" stroke-width="${on || alg ? 3 : 1.5}"/>
        <text y="3" text-anchor="middle" font-size="17" font-weight="700" fill="var(--fg)">${t.num}</text>
        <text y="19" text-anchor="middle" font-size="11" fill="var(--muted)">${gs.length}/${t.seats}</text>`;
      for (let i = 0; i < t.seats; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / t.seats; inner += `<circle cx="${(Math.cos(a) * (r + 11)).toFixed(1)}" cy="${(Math.sin(a) * (r + 11)).toFixed(1)}" r="6.5" fill="${dotFill(gs[i])}" stroke="var(--chrome-dim)" stroke-width="1"/>`; }
      if (veg) inner += `<circle cx="${r * .8}" cy="${-r * .8}" r="11" fill="var(--veg)"/><text x="${r * .8}" y="${-r * .8 + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">V</text>`;
      if (alg) inner += `<circle cx="${-r * .8}" cy="${-r * .8}" r="11" fill="var(--danger)"/><text x="${-r * .8}" y="${-r * .8 + 4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">!</text>`;
    }
    g += `<g class="tbl" data-tid="${t.id}" transform="translate(${t.x} ${t.y})" tabindex="0" role="button" aria-label="${tableName(t)}, ${gs.length} din ${t.seats} locuri">${inner}</g>`;
  });
  if (!L.tables.length) g += `<text x="${cx}" y="${cy - 150}" text-anchor="middle" font-size="16" fill="var(--muted)">Adaugă mese din panoul alăturat sau generează-le automat.</text>`;
  return `<svg class="plan ${mode === "edit" ? "edit" : ""}" id="plan" data-mode="${mode}" viewBox="0 0 ${h.W} ${h.H}" role="img" aria-label="Planul salonului ${h.name}">${g}</svg>`;
}
const LEGEND = `<div class="legend"><span><i style="background:var(--accent);border-radius:50%"></i>Invitat</span><span><i style="background:var(--veg);border-radius:50%"></i>Vegetarian</span><span><i style="background:var(--slate);border-radius:50%"></i>Copil</span><span><i style="background:var(--danger);border-radius:50%"></i>Alergie</span><span><i style="background:var(--surface);border:1px solid var(--chrome-dim);border-radius:50%"></i>Loc liber</span></div>`;

function tabSeating(e) {
  const L = e.layout, sel = L.tables.find(t => t.id === S.sel);
  const seats = seatCount(L), need = guestTotal(e);
  return `
  <div class="plan-wrap">
    <div class="card"><div class="card-h"><h2>${hall(e.hall).name}</h2>${LEGEND}</div><div class="card-b">${planSVG(e, "edit", S.sel)}
      <p class="muted small" style="margin:10px 0 0">Trage mesele ca să le muți. Apasă pe o masă ca s-o selectezi. Ringul rămâne în mijloc.</p></div></div>
    <div class="side-panel">
      <div class="card"><div class="card-h"><h2>Adaugă mese</h2></div><div class="card-b stack">

          <button class="btn primary" type="submit">${icon("plus")}Adaugă la masă</button></form>` : !locked ? `<p class="muted small" style="margin:12px 0 0">Masa este completă.</p>` : ""}

/* ===== Payments ===== */
function viewPayments() {
  const all = [];
  EV().forEach(e => e.payments.forEach((p, i) => all.push({ e, p, i, st: payState(p) })));
  const open = all.filter(x => x.st !== "paid").sort((a, b) => a.p.due.localeCompare(b.p.due));
  const sum = arr => arr.reduce((s, x) => s + x.p.amount, 0);
  const f = st => open.filter(x => x.st === st);
  return `
  <div class="head"><div><p class="eyebrow">Plăți</p><h1>Încasări de urmărit</h1><p class="sub">Tranșele tuturor evenimentelor confirmate, în ordinea scadenței.</p></div></div>
  <section class="kpis">
    <div class="card kpi"><span class="label">Restanțe</span><span class="value num" style="color:var(--danger)">${lei(sum(f("overdue")))}</span><span class="note">${f("overdue").length} tranșe</span></div>
    <div class="card kpi"><span class="label">Scadente în 14 zile</span><span class="value num">${lei(sum(f("soon")))}</span><span class="note">${f("soon").length} tranșe</span></div>
    <div class="card kpi"><span class="label">Programate</span><span class="value num">${lei(sum(f("scheduled")))}</span><span class="note">după 14 zile</span></div>
    <div class="card kpi"><span class="label">Încasat total</span><span class="value num">${lei(sum(all.filter(x => x.st === "paid")))}</span><span class="note">pentru evenimentele din listă</span></div>
  </section>
  <div class="card tbl-wrap"><table><thead><tr><th>Scadență</th><th>Eveniment</th><th>Tranșă</th><th class="right">Sumă</th><th>Status</th><th></th></tr></thead><tbody>
  ${open.map(({ e, p, i, st }) => `<tr><td><div class="t num">${fmtShort(p.due)}</div><div class="m">${inDays(diffDays(p.due, TODAY))}</div></td><td><button class="link" style="color:var(--fg)" data-action="open" data-id="${e.id}" data-tab="payments">${esc(e.title)}</button><div class="m">${fmtLong(e.date)}</div></td><td>${esc(p.label)}</td><td class="right num">${lei(p.amount)}</td><td>${chip(PAY_CHIP[st])}</td><td class="right"><button class="btn sm" data-action="pay" data-id="${e.id}" data-i="${i}">Marchează încasat</button></td></tr>`).join("") || `<tr><td colspan="6" class="empty">Nicio plată de urmărit.</td></tr>`}
  </tbody></table></div>`;
}

/* ===== Modals ===== */
function modalHTML() {
  const M = S.modal;
  if (!M) return "";

    <div class="modal-h"><h2>${esc(title)}</h2><button type="button" class="x" data-action="close-modal" aria-label="Închide">×</button></div>
    <div class="modal-b">${body}</div><div class="modal-f">${foot}</div></${tag}></div>`;

  if (M.kind === "event") {
    const x = M.id ? getEv(M.id) : null;
    const v = x || { title: "", type: "nunta", status: "confirmat", date: M.date || addDays(TODAY, 30), start: "18:00", end: "04:00", hall: M.hall || "gold", adults: 150, kids: 0, contact: { name: "", phone: "", email: "" }, optionExpires: addDays(TODAY, 7) };
    return wrap(x ? "Editează evenimentul" : "Eveniment nou", `
      <div class="field"><label for="f-title">Numele evenimentului</label><input class="input" id="f-title" required value="${esc(v.title)}" placeholder="De exemplu: Nunta Maria & Alin"></div>
      <div class="fields three">
        <div class="field"><label for="f-type">Tip</label><select id="f-type">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${v.type === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="f-status">Status</label><select id="f-status">${Object.entries(STATUS_CHIP).map(([k, [, t]]) => `<option value="${k}" ${v.status === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="f-opt">Opțiune valabilă până</label><input class="input" id="f-opt" type="date" value="${v.optionExpires || addDays(TODAY, 7)}"></div>
      </div>
      <div class="fields three">
        <div class="field"><label for="f-date">Data</label><input class="input" id="f-date" type="date" required value="${v.date}"></div>
        <div class="field"><label for="f-start">Ora de început</label><input class="input" id="f-start" type="time" required value="${v.start}"></div>
        <div class="field"><label for="f-end">Ora de final</label><input class="input" id="f-end" type="time" required value="${v.end}"></div>
      </div>
      <div class="fields three">
        <div class="field"><label for="f-hall">Salon</label><select id="f-hall">${HALLS.map(h => `<option value="${h.id}" ${v.hall === h.id ? "selected" : ""}>${h.name} (${h.cap})</option>`).join("")}</select></div>
        <div class="field"><label for="f-adults">Adulți</label><input class="input num" id="f-adults" type="number" min="0" required value="${v.adults}"></div>
        <div class="field"><label for="f-kids">Copii</label><input class="input num" id="f-kids" type="number" min="0" value="${v.kids}"></div>
      </div>
      ${x ? "" : `<div class="field"><label for="f-menu">Meniu</label><select id="f-menu">${VARIANTS.map(k => `<option value="${k}" ${k === "classic" ? "selected" : ""}>${esc(DB.catalog[k].name)} · ${lei(DB.catalog[k].price)}/pers.</option>`).join("")}</select><span class="muted small">Componentele și prețul se pot ajusta după salvare, în tabul „Meniu și preț”.</span></div>`}
      <div class="fields three">
        <div class="field"><label for="f-cname">Persoana de contact</label><input class="input" id="f-cname" value="${esc(v.contact.name)}" autocomplete="off"></div>
        <div class="field"><label for="f-cphone">Telefon (WhatsApp)</label><input class="input" id="f-cphone" type="tel" value="${esc(v.contact.phone)}" placeholder="07xx xxx xxx" autocomplete="off"></div>
        <div class="field"><label for="f-cemail">Email</label><input class="input" id="f-cemail" type="email" value="${esc(v.contact.email)}" autocomplete="off"></div>
      </div>
      <p class="err" id="f-err" hidden></p>`,
      `${x ? `<button type="button" class="btn danger" data-action="ask-delete" style="margin-right:auto">Șterge evenimentul</button>` : ""}<button type="button" class="btn" data-action="close-modal">Renunță</button><button type="submit" class="btn primary">${x ? "Salvează" : "Creează evenimentul"}</button>`, true, "form", "evForm");
  }
  if (M.kind === "delete") return wrap("Ștergi evenimentul?", `<p style="margin:0"><b>${esc(e.title)}</b> din ${fmtFull(e.date)} va fi șters împreună cu meniul, notele, planul de mese și plățile. Acțiunea nu poate fi anulată.</p>`, `<button class="btn" data-action="close-modal">Renunță</button><button class="btn solid-danger" data-action="do-delete">Șterge definitiv</button>`);

      `<button class="btn" data-action="close-modal">Renunță</button>`, true);

  if (M.kind === "share") {
    const txt = shareText(e);
    return wrap("Distribuie așezarea clientului", `
      <p style="margin:0">Clientul primește un link spre planul salonului, unde poate adăuga invitații la mese până pe <b>${fmtFull(editDeadline(e))}</b>.</p>
      <dl class="kv"><dt>Către</dt><dd>${esc(e.contact.name) || "—"} · <span class="num">${esc(e.contact.phone) || "fără telefon"}</span></dd></dl>
      <div class="msg">${esc(txt)}</div>
      ${e.contact.phone ? "" : `<p class="err">Adaugă un număr de telefon la persoana de contact ca să poți trimite pe WhatsApp.</p>`}`,
      `<button class="btn" data-action="copy" data-text="${esc(txt)}">${icon("copy")}Copiază mesajul</button><button class="btn" data-action="as-client">${icon("eye")}Vezi ca client</button>${e.contact.phone ? `<a class="btn wa" href="${waLink(e.contact.phone, txt)}" target="_blank" rel="noopener" data-action="shared">${icon("wa")}Trimite pe WhatsApp</a>` : ""}`, true);
  }
  if (M.kind === "reset") return wrap("Resetezi datele demo?", `<p style="margin:0">Toate modificările făcute în acest browser se pierd, iar aplicația revine la evenimentele de exemplu.</p>`, `<button class="btn" data-action="close-modal">Renunță</button><button class="btn primary" data-action="do-reset">Resetează</button>`);
  return "";
}

/* ===== Render ===== */
function render() {
  const app = document.getElementById("app");
  app.classList.toggle("client-mode", S.view === "client");
  if (S.view === "client") {
    document.getElementById("page").innerHTML = clientTop() + viewClient();
  } else {
    if (!NAV.some(n => (n.id === S.view || (S.view === "event" && n.id === "events")) && navAllowed(n))) S.view = "events";
    renderNav();
    const V = { dashboard: viewDashboard, calendar: viewCalendar, events: viewEvents, event: viewEvent, menus: viewMenus, payments: viewPayments };
    document.getElementById("page").innerHTML = V[S.view]();
  }
  document.getElementById("layer").innerHTML = modalHTML();
  if (S.modal && S.modal.kind === "event") { const f = document.getElementById("f-title"); if (f) f.focus(); }
}

let toastTimer;
function toast(msg) {
  clearTimeout(toastTimer);
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.innerHTML = `<i></i><span>${esc(msg)}</span>`;
  document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 4200);
}
function go(view) { S.view = view; S.modal = null; S.sel = null; document.getElementById("app").classList.remove("open"); render(); window.scrollTo(0, 0); }
function commit(msg) { save(); render(); if (msg) toast(msg); }

/* ===== Actions ===== */
const ACTIONS = {
  "go": el => go(el.dataset.view),
  "open": el => { S.eventId = el.dataset.id; S.tab = el.dataset.tab || "overview"; S.secFrom = {}; go("event"); },
  "tab": el => { S.tab = el.dataset.t; S.sel = null; render(); },
  "filter": el => { S.filter = el.dataset.f; render(); },
  "week": el => { const d = +el.dataset.d; S.week = d === 0 ? mondayOf(TODAY) : addDays(S.week, d); render(); },
  "open-menu": () => document.getElementById("app").classList.add("open"),
  "close-menu": () => document.getElementById("app").classList.remove("open"),
  "close-modal": () => { S.modal = null; render(); },
  "new-event": el => { S.modal = { kind: "event", date: el.dataset.date, hall: el.dataset.hall }; render(); },
  "edit-event": () => { S.modal = { kind: "event", id: S.eventId }; render(); },
  "ask-delete": () => { S.modal = { kind: "delete" }; render(); },
  "do-delete": () => { const e = getEv(S.eventId); DB.events = DB.events.filter(x => x.id !== S.eventId); save(); go("events"); toast(`${e.title} a fost șters.`); },
  "reset": () => { S.modal = { kind: "reset" }; render(); },
  "do-reset": () => { DB = seed(); save(); go(isManager() ? "dashboard" : "events"); toast("Datele demo au fost resetate."); },
  "sign": () => { const e = getEv(S.eventId); e.status = "confirmat"; e.payments = buildPayments(e); e.payments.forEach((p, i) => { p.paid = i === 0; }); log(e, MANAGER.name, "Contract semnat. S-a generat graficul de plăți."); commit("Contract semnat. Graficul de plăți a fost generat."); },
  "pay": el => { const e = getEv(el.dataset.id), p = e.payments[+el.dataset.i]; p.paid = true; log(e, MANAGER.name, `${p.label} încasată: ${lei(p.amount)}.`); commit(`${lei(p.amount)} marcat ca încasat.`); },
  "copy": el => {
    const text = el.dataset.text;
    const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); toast(ok ? "Copiat." : "Selectează textul și copiază-l manual."); };
    try { navigator.clipboard.writeText(text).then(() => toast("Copiat."), fallback); } catch (_) { fallback(); }
  },
  "base-pick": el => { const e = getEv(S.eventId); if (e.menu.base === el.dataset.v && !countSwaps(e) && !e.customPrice) return; S.modal = { kind: "base", v: el.dataset.v }; render(); },
  "do-base": () => { const e = getEv(S.eventId), v = S.modal.v; e.menu = menuFrom(DB.catalog, v); e.customPrice = null; syncPayments(e); log(e, MANAGER.name, `Meniul a fost schimbat în ${DB.catalog[v].name} (${lei(e.menu.std)}/pers.).`); S.modal = null; commit(`Meniul este acum ${DB.catalog[v].name}.`); },
  "sec-replace": el => { const e = getEv(S.eventId), s = el.dataset.s, sel = document.getElementById("sf-" + s), v = sel ? sel.value : e.menu.base; e.menu.sections[s] = DB.catalog[v][s].map(name => ({ name, from: v })); const label = SECTIONS.find(x => x[0] === s)[1]; log(e, MANAGER.name, `${label}: preluat integral din ${DB.catalog[v].name}.`); commit(`${label} preluat din ${DB.catalog[v].name}.`); },
  "pick": el => { S.modal = { kind: "pick", s: el.dataset.s, i: +el.dataset.i }; render(); },
  "pick-tab": el => { S.modal.v = el.dataset.v; render(); },
  "pick-do": el => applyPick({ name: DB.catalog[el.dataset.v][S.modal.s][+el.dataset.k], from: el.dataset.v }),
  "pick-custom": () => { const inp = document.getElementById("pk-custom"), v = inp.value.trim(); if (!v) { inp.focus(); return; } applyPick({ name: v, from: "custom" }); },
  "item-del": el => { const e = getEv(S.eventId), it = e.menu.sections[el.dataset.s].splice(+el.dataset.i, 1)[0]; log(e, MANAGER.name, `Componentă eliminată: ${it.name}.`); commit(`Eliminat: ${it.name}.`); },
  "price-reset": () => { const e = getEv(S.eventId); e.customPrice = null; syncPayments(e); log(e, MANAGER.name, `Preț readus la standard: ${lei(e.menu.std)}/pers.`); commit("Prețul a revenit la cel standard."); },
  "note-to": el => { const e = getEv(S.eventId), n = e.notes.find(x => x.id === el.dataset.n), to = el.dataset.to; n.to = n.to.includes(to) ? n.to.filter(x => x !== to) : n.to.concat(to); const who = to === "bucatarie" ? "Bucătărie" : hall(e.hall).chief; const on = n.to.includes(to); log(e, MANAGER.name, `Nota „${n.cat}” ${on ? "trimisă la" : "retrasă de la"} ${who}.`); commit(on ? `Nota a fost trimisă la ${who}.` : `Nota nu mai e vizibilă pentru ${who}.`); },
  "note-del": el => { const e = getEv(S.eventId); e.notes = e.notes.filter(x => x.id !== el.dataset.n); log(e, MANAGER.name, "Notă ștearsă."); commit("Nota a fost ștearsă."); },
  "add-table": el => { const e = getEv(S.eventId), n = +el.dataset.n, L = e.layout, h = hall(e.hall); const num = Math.max(0, ...L.tables.map(t => t.num)) + 1; const t = { id: uid("t"), kind: "round", seats: n, x: 80 + ((num - 1) * 97) % (h.W - 160), y: h.H - 60, num }; L.tables.push(t); S.sel = t.id; commit(`Masa ${num} (${n} locuri) a fost adăugată jos. Trage-o unde vrei.`); },
  "add-head": () => { const e = getEv(S.eventId), h = hall(e.hall); const t = { id: uid("t"), kind: "head", seats: 8, x: h.W / 2, y: 70, num: 0 }; e.layout.tables.push(t); S.sel = t.id; commit("Masa mirilor a fost adăugată."); },
  "auto": () => { const e = getEv(S.eventId), n = +document.getElementById("auto-n").value; e.layout.tables = autoTables(e.hall, guestTotal(e), n, e.type === "nunta"); const ids = new Set(e.layout.tables.map(t => t.id)); e.layout.guests.forEach(g => { if (!ids.has(g.table)) g.table = null; }); S.sel = null; log(e, ROLES[S.role].name, `Plan generat automat: ${e.layout.tables.length} mese de ${n}.`); commit(`Am așezat ${e.layout.tables.length} mese în jurul ringului.`); },
  "desel": () => { S.sel = null; render(); },
  "del-table": () => { const e = getEv(S.eventId), L = e.layout; L.guests.forEach(g => { if (g.table === S.sel) g.table = null; }); L.tables = L.tables.filter(t => t.id !== S.sel); S.sel = null; commit("Masa a fost ștearsă. Invitații ei au rămas fără masă."); },
  "share": () => { S.modal = { kind: "share" }; render(); },
  "shared": () => { const e = getEv(S.eventId); e.layout.sharedAt = TODAY; log(e, ROLES[S.role].name, `Planul de mese a fost trimis pe WhatsApp către ${e.contact.name}.`); save(); setTimeout(() => { S.modal = null; render(); toast("Planul a fost marcat ca trimis."); }, 300); },
  "as-client": () => { S.client = S.eventId; S.clientSel = null; S.clientPreview = true; S.modal = null; S.view = "client"; render(); window.scrollTo(0, 0); },
  "exit-client": () => { S.clientPreview = false; S.eventId = S.client; S.tab = "seating"; S.view = "event"; render(); window.scrollTo(0, 0); },
  "g-unseat": el => { const e = getEv(S.client), g = e.layout.guests.find(x => x.id === el.dataset.g); g.table = null; commit(`${g.name} nu mai are masă.`); },
  "g-seat": el => { const e = getEv(S.client), g = e.layout.guests.find(x => x.id === el.dataset.g); g.table = S.clientSel; commit(`${g.name} a fost așezat la masă.`); },
  "g-del": el => { const e = getEv(S.client), g = e.layout.guests.find(x => x.id === el.dataset.g); e.layout.guests = e.layout.guests.filter(x => x.id !== g.id); commit(`${g.name} a fost șters din listă.`); },
  "cat-add": el => { DB.catalog[el.dataset.v][el.dataset.s].push("Componentă nouă"); commit(); const inputs = document.querySelectorAll(`[data-change="cat-item"][data-v="${el.dataset.v}"][data-s="${el.dataset.s}"]`); const last = inputs[inputs.length - 1]; if (last) { last.focus(); last.select(); } },
  "cat-del": el => { const n = DB.catalog[el.dataset.v][el.dataset.s].splice(+el.dataset.i, 1)[0]; commit(`Eliminat din ${DB.catalog[el.dataset.v].name}: ${n}.`); },
};
function applyPick(item) {
  const e = getEv(S.eventId), s = S.modal.s, i = S.modal.i, label = SECTIONS.find(x => x[0] === s)[1];
  if (i >= 0) { const old = e.menu.sections[s][i]; e.menu.sections[s][i] = item; log(e, MANAGER.name, `${label}: „${old.name}” înlocuit cu „${item.name}”.`); }
  else { e.menu.sections[s].push(item); log(e, MANAGER.name, `${label}: adăugat „${item.name}”.`); }
  S.modal = null; commit(i >= 0 ? "Componenta a fost schimbată." : "Componenta a fost adăugată.");
}
function selectTable(tid) {
  if (S.view === "client") S.clientSel = S.clientSel === tid ? null : tid;
  else S.sel = S.sel === tid ? null : tid;
  render();
}

document.addEventListener("click", ev => {
  if (dragMoved) { dragMoved = false; return; }
  const el = ev.target.closest("[data-action]");
  if (el) {
    const a = el.dataset.action;
    if (a === "close-modal" && el.classList.contains("overlay") && ev.target !== el) return;
    if (el.disabled) return;
    const fn = ACTIONS[a];
    if (fn) { if (el.tagName !== "A") ev.preventDefault(); fn(el); }
    return;
  }
  const t = ev.target.closest(".tbl");
  if (t) selectTable(t.dataset.tid);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && S.modal) { S.modal = null; render(); return; }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("tbl")) { ev.preventDefault(); selectTable(ev.target.dataset.tid); }
});

document.addEventListener("change", ev => {
  const el = ev.target, c = el.dataset.change;
  if (!c) return;
  const e = getEv(S.eventId);
  if (c === "price") { const v = el.value === "" ? null : Math.max(0, Math.round(+el.value)); e.customPrice = v === e.menu.std ? null : v; syncPayments(e); log(e, MANAGER.name, e.customPrice ? `Preț ajustat: ${lei(e.customPrice)}/pers. (standard ${lei(e.menu.std)}).` : "Preț readus la standard."); commit(e.customPrice ? `Preț final: ${lei(e.customPrice)} / pers.` : "Se aplică din nou prețul standard."); }
  else if (c === "kids-pct") { e.kidsPct = Math.min(100, Math.max(0, Math.round(+el.value || 0))); syncPayments(e); commit(`Copiii plătesc ${e.kidsPct}% din preț.`); }
  else if (c === "sec-from") { S.secFrom[el.dataset.s] = el.value; }
  else if (c === "seats") { const t = e.layout.tables.find(x => x.id === S.sel); t.seats = +el.value; guestsAt(e.layout, t.id).slice(t.seats).forEach(g => { g.table = null; }); commit(`${tableName(t)} are acum ${t.seats} locuri.`); }
  else if (c === "unlock") { e.layout.clientUnlock = el.checked; log(e, ROLES[S.role].name, el.checked ? "Clientul poate modifica și după termen." : "Modificările clientului se blochează cu 3 zile înainte."); commit(el.checked ? "Clientul poate modifica lista și după termen." : "Lista se blochează cu 3 zile înainte de eveniment."); }
  else if (c === "cat-price") { DB.catalog[el.dataset.v].price = Math.max(0, Math.round(+el.value || 0)); commit(`${DB.catalog[el.dataset.v].name}: preț standard ${lei(DB.catalog[el.dataset.v].price)}.`); }
  else if (c === "cat-item") { const v = el.value.trim(); if (v) { DB.catalog[el.dataset.v][el.dataset.s][+el.dataset.i] = v; save(); toast("Componenta a fost salvată."); } }
});

document.addEventListener("submit", ev => {
  ev.preventDefault();
  const id = ev.target.id;
  if (id === "evForm") { submitEvent(); return; }
  if (id === "noteForm") {
    const e = getEv(S.eventId), text = document.getElementById("n-text").value.trim();
    if (!text) return;
    const to = []; if (document.getElementById("n-k").checked) to.push("bucatarie"); if (document.getElementById("n-s").checked) to.push("sala");
    const n = { id: uid("n"), cat: document.getElementById("n-cat").value, text, to };
    e.notes.push(n);
    const who = to.map(t => t === "bucatarie" ? "Bucătărie" : hall(e.hall).chief).join(" și ");
    log(e, MANAGER.name, `Notă nouă (${n.cat})${who ? ", trimisă la " + who : ""}.`);
    commit(who ? `Nota a fost trimisă la ${who}.` : "Nota a fost salvată doar pentru manager.");
    return;
  }
  if (id === "guestForm") {
    const e = getEv(S.client), name = document.getElementById("g-name").value.trim();
    if (!name || clientLocked(e)) return;
    const t = e.layout.tables.find(x => x.id === S.clientSel);
    if (!t || guestsAt(e.layout, t.id).length >= t.seats) return;
    e.layout.guests.push({ id: uid("g"), name, diet: document.getElementById("g-diet").value, note: document.getElementById("g-note").value.trim(), table: t.id });
    commit(`${name} a fost adăugat la ${tableName(t).toLowerCase()}.`);
    const n = document.getElementById("g-name"); if (n) n.focus();
  }
});

function submitEvent() {
  const val = id => document.getElementById(id).value;
  const err = msg => { const p = document.getElementById("f-err"); p.textContent = msg; p.hidden = false; };
  const f = { title: val("f-title").trim(), type: val("f-type"), status: val("f-status"), optionExpires: val("f-opt"), date: val("f-date"), start: val("f-start"), end: val("f-end"), hall: val("f-hall"),
    adults: Math.max(0, parseInt(val("f-adults"), 10) || 0), kids: Math.max(0, parseInt(val("f-kids"), 10) || 0),
    contact: { name: val("f-cname").trim(), phone: val("f-cphone").trim(), email: val("f-cemail").trim() } };
  if (!f.title) return err("Scrie numele evenimentului.");
  if (!f.date || !f.start || !f.end) return err("Completează data și orele.");
  const h = hall(f.hall);
  if (f.adults + f.kids > h.cap) return err(`${h.name} are ${h.cap} de locuri, iar evenimentul are ${f.adults + f.kids} de invitați.`);
  const span = x => { const s = toMin(x.start); let en = toMin(x.end); if (en <= s) en += 1440; return [s, en]; };
  const [s1, e1] = span(f);
  const clash = EV().find(x => x.id !== S.modal.id && x.hall === f.hall && x.date === f.date && (([s2, e2]) => s1 < e2 && s2 < e1)(span(x)));
  if (clash) return err(`${h.name} este ocupat atunci: ${clash.title}, ${clash.start}–${clash.end}.`);
  if (S.modal.id) {
    const e = getEv(S.modal.id);
    const changes = [];
    if (e.date !== f.date) changes.push(`data ${fmtShort(e.date)} → ${fmtShort(f.date)}`);
    if (e.hall !== f.hall) changes.push(`salonul ${hall(e.hall).short} → ${h.short}`);
    if (e.adults !== f.adults || e.kids !== f.kids) changes.push(`invitați ${guestTotal(e)} → ${f.adults + f.kids}`);
    if (e.hall !== f.hall) { e.layout.tables = []; e.layout.guests.forEach(g => { g.table = null; }); e.layout.sharedAt = null; }
    const wasOption = e.status === "optiune";
    Object.assign(e, f);
    if (wasOption && e.status === "confirmat" && !e.payments.length) { e.payments = buildPayments(e); e.payments.forEach((p, i) => { p.paid = i === 0; }); }
    syncPayments(e);
    log(e, MANAGER.name, changes.length ? `Detalii modificate: ${changes.join(", ")}.` : "Detaliile evenimentului au fost actualizate.");
    S.modal = null; commit("Evenimentul a fost salvat.");
  } else {
    const e = makeEvent(DB.catalog, Object.assign(f, { variant: val("f-menu") }));
    e.payments.forEach(p => { p.paid = false; if (p.due < TODAY) p.due = TODAY; });
    DB.events.push(e);
    S.eventId = e.id; S.tab = "overview"; save(); go("event"); toast(`${e.title} a fost creat în ${h.name}.`);
  }
}

/* ===== Dragging tables ===== */
let drag = null, dragMoved = false;
const svgPoint = (svg, ev) => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
document.addEventListener("pointerdown", ev => {
  const g = ev.target.closest && ev.target.closest(".tbl");
  const svg = g && g.ownerSVGElement;
  if (!g || !svg || svg.dataset.mode !== "edit") return;
  const e = getEv(S.eventId), t = e.layout.tables.find(x => x.id === g.dataset.tid);
  const p = svgPoint(svg, ev);
  drag = { g, svg, t, e, dx: p.x - t.x, dy: p.y - t.y, sx: ev.clientX, sy: ev.clientY, moved: false };
  try { svg.setPointerCapture(ev.pointerId); } catch (_) {}
});
document.addEventListener("pointermove", ev => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 4) return;
  drag.moved = true;
  const h = hall(drag.e.hall), p = svgPoint(drag.svg, ev);
  const pad = drag.t.kind === "head" ? 110 : (SEATS_R[drag.t.seats] || 38) + 18;
  drag.t.x = Math.round(Math.min(h.W - pad, Math.max(pad, p.x - drag.dx)));
  drag.t.y = Math.round(Math.min(h.H - 50, Math.max(50, p.y - drag.dy)));
  drag.g.setAttribute("transform", `translate(${drag.t.x} ${drag.t.y})`);
});
const endDrag = () => { if (!drag) return; if (drag.moved) { dragMoved = true; save(); setTimeout(() => { dragMoved = false; }, 0); } drag = null; };
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

/* ===== Top bar ===== */
document.getElementById("q").addEventListener("input", ev => { S.q = ev.target.value; if (S.view !== "events") { S.view = "events"; S.filter = "toate"; } render(); ev.target.focus(); });
const roleSel = document.getElementById("role");
roleSel.addEventListener("change", () => {
  S.role = roleSel.value; S.sel = null;
  try { localStorage.setItem("emerald-role", S.role); } catch (_) {}
  if (S.view === "event") { const e = getEv(S.eventId); if (!e || !canSeeEvent(e)) S.view = "events"; }
  if (!isManager() && ["dashboard", "menus", "payments"].includes(S.view)) S.view = "events";
  render();
  toast({ manager: "Manager: acces complet.", bucatarie: "Bucătărie: toate evenimentele, doar informațiile despre mâncare." }[S.role] || `${ROLES[S.role].label}: doar evenimentele din ${hall(roleHall()).name}.`);
});

/* ===== Boot ===== */
function fromHash() {
  const m = /^#client-([A-Za-z0-9_-]+)$/.exec(location.hash || "");
  if (m && getEv(m[1])) { S.client = m[1]; S.clientSel = null; S.clientPreview = false; S.view = "client"; return true; }
  return false;
}
roleSel.value = S.role;
if (!fromHash() && !isManager()) S.view = "events";
window.addEventListener("hashchange", () => { if (fromHash()) render(); });
render();
})();
</script>
