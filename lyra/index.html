<title>Lyra Comenzi</title>
<meta name="description" content="Simulare platformă de comenzi Restaurant Lyra: aplicația clientului și consola de recepție, sincronizate live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: brand bar on top; a two-pane stage — the client app in a phone frame (left) and the reception console (right).
   Either pane can go full-screen. Visual world: the menu's forest green + brass gold, one deliberate dark look. */
:root{
  --forest:#0a1d14; --forest-2:#10291c; --forest-3:#163523; --forest-4:#1e452f;
  --line:rgba(233,183,112,.15); --line-2:rgba(233,183,112,.34);
  --gold:#e9b770; --gold-2:#f6d9a6; --cream:#f3ead9; --paper:#f7f0e1; --ink:#13241a;
  --muted:#a3b6a7; --dim:#6f8a77;
  --ember:#ff7a3d; --ok:#5fd39a; --warn:#f4c04e; --bad:#f2675a;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--forest);color:var(--cream);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 10% -10%,rgba(46,110,64,.35),transparent 60%),radial-gradient(900px 600px at 110% 20%,rgba(30,80,50,.4),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:400}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,29,20,.88);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:.32em;font-weight:400;color:var(--gold-2)}
.brand small{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:-3px}
.seg{display:inline-flex;padding:4px;border:1px solid var(--line-2);border-radius:999px;background:var(--forest-2)}
.seg button{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.live{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(95,211,154,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(95,211,154,0)}100%{box-shadow:0 0 0 0 rgba(95,211,154,0)}}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;padding-inline:24px;padding-block:22px 40px;align-items:start;max-width:1720px;margin:0 auto}
.stage.only-client{grid-template-columns:minmax(0,1fr);justify-items:center}
.stage.only-rx{grid-template-columns:minmax(0,1fr)}
.stage.only-client #rx-wrap,.stage.only-rx #client-wrap{display:none}
.pane-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 10px 6px;display:flex;gap:10px;align-items:center}
.pane-label b{color:var(--gold);font-weight:600}

/* ---------- phone ---------- */
.phone{position:relative;width:400px;max-width:100%;height:min(840px,calc(100dvh - 130px));min-height:620px;border-radius:44px;padding:10px;background:linear-gradient(160deg,#2a2f2a,#0d0f0d 40%,#22261f);box-shadow:0 40px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(233,183,112,.25)}
.screen{position:relative;height:100%;border-radius:36px;overflow:hidden;background:var(--forest);isolation:isolate}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:20px;background:#000;z-index:40}
.ph-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:150px;scrollbar-width:none}
.ph-scroll::-webkit-scrollbar{display:none}
@media (max-width:560px){
  .stage{padding-inline:0;padding-block:0}
  .phone{width:100%;height:calc(100dvh - 120px);min-height:560px;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}.notch{display:none}
  .pane-label{margin-left:16px;margin-top:10px}
  .top{padding:12px 16px}.live{display:none}
}

/* ---------- client: header ---------- */
.c-head{position:relative;z-index:20;padding:44px 18px 12px}
.c-row{display:flex;align-items:center;gap:10px}
.c-logo{display:flex;align-items:center;gap:8px;margin-right:auto}
.c-logo svg{width:28px;height:28px}
.c-logo b{font-family:var(--f-display);letter-spacing:.3em;font-size:20px;font-weight:400;color:var(--gold-2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:700;color:var(--gold-2);background:rgba(233,183,112,.07)}
.pill svg{width:14px;height:14px}
.lang{font-size:12px;font-weight:700;letter-spacing:.08em;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px;padding:4px;border-radius:14px;background:var(--forest-2);border:1px solid var(--line)}
.mode button{padding:8px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.mode button small{font-weight:500;font-size:11px;opacity:.8}
.mode button[aria-pressed="true"]{background:var(--forest-4);color:var(--cream);box-shadow:inset 0 0 0 1px var(--line-2)}
.c-body{padding:0 18px}
.hello{margin:6px 0 2px;font-family:var(--f-display);font-size:26px;line-height:1.15;color:var(--cream)}
.hello em{font-style:normal;color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin:0}

/* moods */
.moods{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;margin:0 -18px;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.mood{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--forest-2);font-size:13px;font-weight:600;white-space:nowrap}
.mood img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.mood[aria-pressed="true"]{border-color:var(--gold);background:rgba(233,183,112,.12);color:var(--gold-2)}
.recs{display:flex;gap:12px;overflow-x:auto;margin:12px -18px 0;padding:0 18px 6px;scrollbar-width:none}
.recs::-webkit-scrollbar{display:none}
.rec{flex:0 0 150px;border-radius:16px;overflow:hidden;background:var(--forest-2);border:1px solid var(--line);text-align:left}
.rec img{width:100%;height:100px;object-fit:cover}
.rec div{padding:8px 10px 10px}
.rec b{display:block;font-size:13px;line-height:1.25;font-weight:700;min-height:2.5em}
.rec span{font-size:12.5px;color:var(--gold);font-weight:700}

/* hero */
.hero{position:relative;margin:16px 0 4px;border-radius:22px;overflow:hidden;background:#0c0c0b;border:1px solid var(--line-2);min-height:178px;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;text-align:left;width:100%}
.hero img.h-photo{position:absolute;right:-28px;bottom:-14px;width:62%;height:auto;mask-image:radial-gradient(closest-side,#000 70%,transparent);-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent)}
.hero .h-txt{position:relative;padding:18px;z-index:1}
.hero .k{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ember);font-weight:800}
.hero h3{font-family:"Oswald",Impact,"Arial Narrow",sans-serif;font-weight:700;font-size:28px;line-height:.98;color:#f2b33d;text-transform:uppercase;letter-spacing:.01em;margin:6px 0}
.hero p{margin:0 0 10px;font-size:12.5px;color:#d7cbb5}
.hero .cta{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:800;color:var(--ink);background:#f2b33d;border-radius:999px;padding:7px 13px}
.hero .logo{width:52px;height:52px;border-radius:50%;margin-bottom:6px}

/* tools */
.tools{display:flex;gap:8px;margin-top:16px}
.search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--forest-2);border-radius:14px;padding:0 12px;min-width:0}
.search svg{width:16px;height:16px;color:var(--dim);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;padding:11px 0;outline:none;font-size:14px}
.search input::placeholder{color:var(--dim)}
.tbtn{display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--forest-2);font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.tbtn[aria-pressed="true"]{border-color:var(--bad);color:#ffb3a9;background:rgba(242,103,90,.1)}
.tbtn svg{width:15px;height:15px}

.cats{position:sticky;top:0;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:44px 18px 10px;margin:8px -18px 0;background:linear-gradient(var(--forest) 80%,rgba(10,29,20,0));scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid transparent;white-space:nowrap}
.cat[aria-current="true"]{color:var(--ink);background:var(--gold)}
.sec{scroll-margin-top:190px;padding-top:10px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:14px 0 10px}
.sec-h h2{font-family:var(--f-display);font-size:21px;color:var(--gold-2)}
.sec-h span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-style:italic}
.sec-note{font-size:12px;color:var(--muted);margin:-6px 0 10px}

/* item */
.it{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.it.noimg{grid-template-columns:minmax(0,1fr)}
.it-img{position:relative;width:104px;height:104px;border-radius:16px;overflow:hidden;background:var(--forest-3)}
.it-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.it:hover .it-img img{transform:scale(1.06)}
.flame{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;background:rgba(10,29,20,.75);display:grid;place-items:center;color:var(--ember)}
.flame svg{width:14px;height:14px}
.it-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.it-open{text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.it-t{display:flex;gap:6px;align-items:baseline}
.it-no{font-family:var(--f-mono);font-size:10.5px;color:var(--gold);opacity:.8}
.it h4{font-size:14.5px;font-weight:700;line-height:1.25;color:var(--cream)}
.it p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.gr{font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
.al{display:inline-flex;gap:3px}
.al i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(233,183,112,.1);color:var(--gold)}
.al i svg{width:11px;height:11px}
.al i.warn{background:rgba(242,103,90,.22);color:#ffb3a9}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:rgba(233,183,112,.12);color:var(--gold-2)}
.tag.green{background:rgba(95,211,154,.12);color:#9be8c0}
.tag.red{background:rgba(242,103,90,.16);color:#ffb3a9}
.it-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
.price{font-weight:800;font-size:15px;color:var(--gold-2)}
.price s{color:var(--dim);font-weight:500;font-size:12px;margin-left:6px}
.add{width:34px;height:34px;border-radius:12px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:700;transition:transform .15s}
.add:active{transform:scale(.9)}
.step{display:inline-flex;align-items:center;gap:2px;border-radius:12px;background:var(--forest-3);border:1px solid var(--line-2)}
.step button{width:32px;height:32px;font-size:18px;font-weight:700;color:var(--gold-2)}
.step b{min-width:20px;text-align:center;font-size:14px}
.it.out{opacity:.45}
.it.out .add{background:var(--forest-4);color:var(--dim);cursor:not-allowed}
.it.blocked .it-img{filter:grayscale(.7)}

/* bottom nav + fab */
.c-nav{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(12,32,22,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.c-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim);padding:4px;position:relative}
.c-nav button svg{width:22px;height:22px}
.c-nav button[aria-current="true"]{color:var(--gold)}
.c-nav .badge{position:absolute;top:0;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ember);color:#fff;font-size:10px;display:grid;place-items:center}
.fab{position:absolute;left:14px;right:14px;bottom:82px;z-index:29;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,#f0c27f,#d99b4e);color:var(--ink);box-shadow:0 14px 30px -10px rgba(0,0,0,.7);font-weight:800;animation:rise .35s ease}
.fab .q{width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--gold-2);display:grid;place-items:center;font-size:13px}
.fab span{margin-right:auto}
@keyframes rise{from{transform:translateY(20px);opacity:0}}

/* sheet */
.veil{position:absolute;inset:0;z-index:60;background:rgba(3,10,6,.6);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:92%;overflow-y:auto;background:var(--forest-2);border-radius:28px 28px 0 0;border-top:1px solid var(--line-2);animation:up .3s cubic-bezier(.2,.9,.3,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(40%);opacity:.3}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:10px auto}
.sh-pad{padding:6px 20px 24px}
.sh-close{position:absolute;right:14px;top:14px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(10,29,20,.75);display:grid;place-items:center;font-size:18px}
.d-img{position:relative;height:250px}
.d-img img{width:100%;height:100%;object-fit:cover}
.d-img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,var(--forest-2))}
.d-name{font-family:var(--f-display);font-size:26px;line-height:1.12;color:var(--cream);margin-top:-8px}
.d-hu{font-style:italic;color:#9fd4a8;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:4px 0 10px}
.d-desc{color:var(--muted);font-size:14px;margin:0 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--cream)}
.fact svg{width:13px;height:13px;color:var(--gold)}
.fact.hot svg{color:var(--ember)}
.fact.warn{border-color:rgba(242,103,90,.5);color:#ffb3a9}
.wine{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(120deg,rgba(120,30,50,.35),rgba(233,183,112,.08));border:1px solid rgba(233,183,112,.2);margin-bottom:14px;font-size:13px}
.wine svg{width:24px;height:24px;color:#e7a3b1;flex:none}
.wine b{color:var(--gold-2)}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;font-size:14px;cursor:pointer}
.opt input{accent-color:var(--gold);width:18px;height:18px}
.opt span{margin-right:auto}
.opt b{color:var(--gold-2);font-size:13px}
textarea,.in{width:100%;background:var(--forest);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;outline:none;resize:none}
textarea:focus,.in:focus{border-color:var(--gold)}
.big{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:15px;border-radius:16px;background:var(--gold);color:var(--ink);font-weight:800;font-size:15px}
.big:disabled{opacity:.45;cursor:not-allowed}
.big.ghost{background:transparent;color:var(--gold-2);border:1px solid var(--line-2)}
.row-btw{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* cart */
.cl{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cl img,.cl .ph{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--forest-3)}
.cl b{font-size:13.5px;display:block;line-height:1.25}
.cl small{display:block;color:var(--dim);font-size:11.5px}
.cl .p{font-size:13px;color:var(--gold-2);font-weight:700}
.ups{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.ups::-webkit-scrollbar{display:none}
.up{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:14px;border:1px dashed var(--line-2);font-size:12.5px;font-weight:600}
.up img,.up .ph{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--forest-3)}
.up em{font-style:normal;color:var(--gold)}
.prog{height:6px;border-radius:3px;background:var(--forest);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:3px;transition:width .4s}
.note-ok{font-size:12.5px;color:var(--muted)}
.note-ok b{color:var(--gold-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2);background:rgba(233,183,112,.1)}
.sum{display:grid;gap:6px;font-size:13.5px;margin:14px 0}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:17px;font-weight:800;color:var(--gold-2);padding-top:8px;border-top:1px solid var(--line)}
.sum .neg{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ptsbox{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:linear-gradient(120deg,rgba(233,183,112,.14),rgba(233,183,112,.03));border:1px solid var(--line-2)}
.ptsbox .t{flex:1;font-size:13px}
.ptsbox .t b{display:block;color:var(--gold-2)}
.switch{position:relative;width:46px;height:26px;border-radius:13px;background:var(--forest-4);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--cream);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* tracking */
.track{margin-top:10px;padding:18px;border-radius:24px;background:linear-gradient(170deg,var(--forest-3),var(--forest-2));border:1px solid var(--line-2);text-align:center}
.ring{position:relative;width:184px;height:184px;margin:6px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center}
.ring .c b{font-family:var(--f-display);font-size:46px;line-height:1;color:var(--gold-2)}
.ring .c small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ring.wait svg{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(270deg)}}
.t-title{font-family:var(--f-display);font-size:20px}
.t-sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:18px 0 6px;text-align:center}
.steps div{font-size:10.5px;color:var(--dim);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.2}
.steps i{width:100%;height:4px;border-radius:2px;background:var(--forest)}
.steps .done i{background:var(--gold)}.steps .done{color:var(--gold-2)}
.steps .now i{background:linear-gradient(90deg,var(--gold),var(--forest));background-size:200% 100%;animation:shim 1.4s linear infinite}
.steps .now{color:var(--cream)}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.msgs{display:grid;gap:8px;margin-top:14px;text-align:left}
.msg{padding:10px 12px;border-radius:14px 14px 14px 4px;background:var(--forest);border:1px solid var(--line);font-size:13px}
.msg small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.stars button svg{width:32px;height:32px;color:var(--forest-4)}
.stars button.on svg{color:var(--gold)}
.hist{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hist .imgs{display:flex}
.hist .imgs img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--forest);margin-left:-12px}
.hist .imgs img:first-child{margin-left:0}
.hist div.t{flex:1;min-width:0;font-size:13px}
.hist div.t b{display:block}
.hist div.t small{color:var(--dim)}
.mini{padding:7px 12px;border-radius:10px;border:1px solid var(--line-2);font-size:12px;font-weight:700;color:var(--gold-2)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.empty svg{width:56px;height:56px;color:var(--gold);opacity:.6;margin:0 auto 10px}

/* club */
.card{position:relative;margin-top:12px;border-radius:22px;padding:20px;overflow:hidden;min-height:196px;color:#1a1408;display:flex;flex-direction:column;
  background:linear-gradient(135deg,#f7e2b5 0%,#d9a75b 38%,#f3d394 55%,#b98236 100%);box-shadow:0 20px 40px -18px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.6)}
.card.silver{background:linear-gradient(135deg,#f1f3f1 0%,#b7bfba 38%,#e9ecea 55%,#8d9893 100%)}
.card.bronze{background:linear-gradient(135deg,#f1c9a5 0%,#b8774a 38%,#e7b48a 55%,#8c5530 100%)}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 48%,transparent 60%);background-size:250% 100%;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,60%{background-position:130% 0}100%{background-position:-60% 0}}
.card .ct{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.card .ct b{font-family:var(--f-display);letter-spacing:.3em;font-size:18px;font-weight:400}
.card .ct span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.card .cp{position:relative;margin-top:auto}
.card .cp b{font-family:var(--f-display);font-size:40px;line-height:1;font-weight:400}
.card .cp small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.75}
.card .cn{position:relative;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;margin-top:10px;opacity:.85}
.card svg.cons{position:absolute;right:-10px;top:30px;width:150px;height:150px;opacity:.22}
.tierbar{margin-top:14px;font-size:12.5px;color:var(--muted)}
.tierbar b{color:var(--gold-2)}
.const{margin-top:16px;padding:16px;border-radius:20px;background:radial-gradient(circle at 60% 30%,#163a2a,#08160f 70%);border:1px solid var(--line-2);display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.const svg{width:150px;height:150px}
.const h3{font-family:var(--f-display);font-size:19px;color:var(--gold-2)}
.const p{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.star-on{fill:#ffe7b0;filter:drop-shadow(0 0 6px rgba(255,214,140,.9))}
.star-off{fill:#2d4a3a}
.rw{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;border:1px solid var(--line);margin-bottom:8px}
.rw img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.rw div{flex:1;min-width:0;font-size:13px}
.rw div b{display:block}
.rw div small{color:var(--gold)}
.code{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line-2);font-family:var(--f-mono);font-size:15px;color:var(--gold-2)}
.code span{margin-right:auto}

/* promo popup */
.pop{position:absolute;inset:0;z-index:80;display:grid;place-items:center;padding:22px;background:rgba(3,10,6,.7);backdrop-filter:blur(6px);animation:fade .25s}
.pop-card{position:relative;width:100%;border-radius:26px;overflow:hidden;background:var(--forest-2);border:1px solid var(--gold);box-shadow:0 30px 60px -10px rgba(0,0,0,.8),0 0 60px -10px rgba(233,183,112,.35);animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.85) translateY(20px);opacity:0}}
.pop-card .pi{position:relative;height:210px}
.pop-card .pi img{width:100%;height:100%;object-fit:cover}
.pop-card .pi::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,var(--forest-2))}
.pop-card .ribbon{position:absolute;left:14px;top:14px;z-index:2;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--ink);background:var(--gold);padding:5px 10px;border-radius:999px}
.pop-card .pb{padding:4px 20px 20px;text-align:center}
.pop-card h3{font-family:var(--f-display);font-size:27px;line-height:1.1;color:var(--gold-2)}
.pop-card p{color:var(--muted);font-size:13.5px;margin:8px 0 12px}
.pop-card .pp{font-size:28px;font-weight:800;color:var(--cream)}
.pop-card .pp s{font-size:15px;color:var(--dim);font-weight:500;margin-left:8px}
.pop-card .cd{font-family:var(--f-mono);font-size:12px;color:var(--ember);margin:4px 0 14px}
.pop-card .codebox{display:inline-block;font-family:var(--f-mono);font-size:18px;letter-spacing:.14em;padding:8px 16px;border:1px dashed var(--gold);border-radius:12px;color:var(--gold-2);margin-bottom:14px}
.later{display:block;margin:10px auto 0;font-size:13px;color:var(--muted)}

/* toast */
.toast-host{position:absolute;left:12px;right:12px;top:48px;z-index:90;display:grid;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(246,217,166,.97);color:var(--ink);font-size:13px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);animation:drop .35s cubic-bezier(.2,1.3,.4,1)}
.toast svg{width:20px;height:20px;flex:none}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}

/* ======================= RECEPTION ======================= */
.rx{position:relative;border-radius:24px;border:1px solid var(--line-2);background:rgba(13,36,24,.82);min-height:min(840px,calc(100dvh - 130px));overflow:hidden;display:grid;grid-template-columns:200px minmax(0,1fr)}
.rx-side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:rgba(8,24,16,.6)}
.rx-side .rb{display:flex;align-items:center;gap:8px;padding:0 6px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.rx-side .rb svg{width:28px;height:28px}
.rx-side .rb b{font-family:var(--f-display);letter-spacing:.28em;font-size:18px;font-weight:400;color:var(--gold-2)}
.rx-side .rb small{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.rnav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--muted);text-align:left}
.rnav svg{width:18px;height:18px}
.rnav[aria-current="true"]{background:var(--forest-4);color:var(--cream);box-shadow:inset 0 0 0 1px var(--line-2)}
.rnav .n{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ember);color:#fff;font-size:11px;display:grid;place-items:center}
.openbox{margin-top:auto;padding:12px;border-radius:14px;border:1px solid var(--line);font-size:12.5px;display:grid;gap:8px}
.openbox .row-btw b{font-size:13px}
.rx-main{min-width:0;display:flex;flex-direction:column;max-height:min(840px,calc(100dvh - 130px));overflow:auto}
.rx-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:rgba(13,36,24,.96);backdrop-filter:blur(8px)}
.rx-top h2{font-family:var(--f-display);font-size:24px;color:var(--cream);margin-right:auto}
.rx-top h2 small{display:block;font-family:var(--f-body);font-size:12px;color:var(--dim);letter-spacing:.04em}
.clock{font-family:var(--f-mono);font-size:20px;color:var(--gold-2)}
.rbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line-2);font-size:13px;font-weight:700;color:var(--gold-2);white-space:nowrap}
.rbtn svg{width:16px;height:16px}
.rbtn.solid{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.rbtn.on{background:rgba(95,211,154,.12);border-color:rgba(95,211,154,.5);color:#9be8c0}
.rx-body{padding:18px 22px 28px;display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{padding:12px 14px;border-radius:16px;background:var(--forest-2);border:1px solid var(--line)}
.kpi small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.2;color:var(--cream);font-weight:400}
.kpi em{font-style:normal;font-size:11.5px;color:var(--muted)}
.load{height:6px;border-radius:3px;background:var(--forest);overflow:hidden;margin-top:6px}
.load i{display:block;height:100%;border-radius:3px;transition:width .5s}

/* incoming */
.incoming{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;border-radius:22px;overflow:hidden;border:1px solid var(--gold);box-shadow:0 0 0 0 rgba(233,183,112,.5);animation:ringglow 1.6s infinite}
@keyframes ringglow{0%{box-shadow:0 0 0 0 rgba(233,183,112,.55)}70%{box-shadow:0 0 0 16px rgba(233,183,112,0)}100%{box-shadow:0 0 0 0 rgba(233,183,112,0)}}
.inc-h{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--gold);color:var(--ink)}
.inc-h b{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.inc-h .bell{width:22px;height:22px;animation:shake 1s infinite}
@keyframes shake{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.inc-h span{margin-left:auto;font-family:var(--f-mono);font-size:13px}
.ticket{background:var(--paper);color:var(--ink);padding:18px 20px 22px;font-family:var(--f-mono);font-size:13.5px;position:relative;
  -webkit-mask:radial-gradient(circle 7px at 100% 50%,transparent 98%,#000) 0 0/100% 22px;mask:radial-gradient(circle 7px at 100% 50%,transparent 98%,#000) 0 0/100% 22px}
.ticket .tno{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed rgba(19,36,26,.35);padding-bottom:10px;margin-bottom:10px}
.ticket .tno b{font-size:26px;font-family:var(--f-display);font-weight:400}
.ticket .tl{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;padding:5px 0;align-items:baseline}
.ticket .tl .q{font-size:20px;font-weight:500}
.ticket .tl b{font-family:var(--f-body);font-weight:800;font-size:15px}
.ticket .tl small{display:block;color:#5d6b60;font-size:12px}
.ticket .tl .x{color:#a0491d;font-size:12px;display:block}
.ticket .tot{display:flex;justify-content:space-between;border-top:2px dashed rgba(19,36,26,.35);margin-top:10px;padding-top:10px;font-size:16px;font-weight:500}
.ticket .alert{margin:10px 0;padding:8px 10px;border-radius:8px;background:#f2675a;color:#fff;font-family:var(--f-body);font-weight:800;font-size:13px;display:flex;gap:8px;align-items:center}
.ticket .alert svg{width:18px;height:18px;flex:none}
.ticket .gift{margin:10px 0;padding:8px 10px;border-radius:8px;background:#13241a;color:var(--gold-2);font-family:var(--f-body);font-weight:700;font-size:12.5px;display:flex;gap:8px;align-items:center}
.ticket .gift svg{width:18px;height:18px;flex:none}
.ticket .tn{background:#fff3c9;border-left:4px solid #e0a43d;padding:6px 10px;margin:8px 0;font-family:var(--f-body);font-size:13px}
.decide{background:var(--forest-2);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:var(--ink);flex:none}
.who b{display:block;font-size:15px}
.who small{color:var(--muted);font-size:12.5px}
.insight{font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--forest);border:1px solid var(--line);display:grid;gap:4px}
.insight b{color:var(--gold-2)}
.etas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eta{position:relative;padding:14px 6px;border-radius:14px;border:1px solid var(--line-2);text-align:center;font-family:var(--f-display);font-size:24px;line-height:1;color:var(--cream)}
.eta small{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--dim);margin-top:4px;letter-spacing:.06em}
.eta[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.eta[aria-pressed="true"] small{color:var(--ink)}
.eta .rec{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-family:var(--f-body);font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--ok);color:var(--ink);white-space:nowrap}
.accept{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:16px;border-radius:16px;background:var(--ok);color:#06240f;font-weight:800;font-size:16px}
.reject{font-size:13px;color:#ffb3a9;font-weight:700;padding:6px}
.rsn{display:flex;flex-wrap:wrap;gap:6px}
.rsn button{padding:7px 10px;border-radius:10px;border:1px solid rgba(242,103,90,.4);font-size:12px;color:#ffb3a9}
.queue{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.queue button{padding:6px 10px;border-radius:10px;border:1px solid var(--line-2);font-family:var(--f-mono);font-size:12px;color:var(--gold-2)}
.queue button[aria-current="true"]{background:var(--gold);color:var(--ink)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{border-radius:18px;background:rgba(8,24,16,.5);border:1px solid var(--line);padding:12px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);padding:2px 4px}
.col-h i{width:8px;height:8px;border-radius:50%}
.col-h span{margin-left:auto;font-family:var(--f-mono);color:var(--gold-2)}
.oc{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--forest-2);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .2s,transform .2s}
.oc:hover{border-color:var(--line-2);transform:translateY(-1px)}
.oc .h{display:flex;align-items:center;gap:8px}
.oc .h b{font-family:var(--f-mono);font-size:14px;color:var(--gold-2)}
.oc .h .tm{margin-left:auto;font-family:var(--f-mono);font-size:13px;font-weight:500;padding:2px 8px;border-radius:8px}
.tm.ok{background:rgba(95,211,154,.14);color:#9be8c0}.tm.warn{background:rgba(244,192,78,.16);color:#ffe09a}.tm.bad{background:rgba(242,103,90,.2);color:#ffb3a9}
.oc .who2{font-size:13px;font-weight:700}
.oc .its{font-size:12.5px;color:var(--muted);line-height:1.4}
.oc .bar{height:4px;border-radius:2px;background:var(--forest);overflow:hidden}
.oc .bar i{display:block;height:100%;border-radius:2px}
.oc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.oc .ft .tag{font-size:9.5px}
.oc .ft .go{margin-left:auto}
.go{padding:7px 11px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:800}
.colempty{font-size:12.5px;color:var(--dim);text-align:center;padding:20px 8px;border:1px dashed var(--line);border-radius:12px}

/* drawer */
.drawer-veil{position:absolute;inset:0;z-index:60;background:rgba(3,10,6,.55);animation:fade .2s}
.drawer{position:absolute;right:0;top:0;bottom:0;z-index:61;width:min(460px,100%);background:var(--forest-2);border-left:1px solid var(--line-2);overflow-y:auto;animation:slide .3s cubic-bezier(.2,.9,.3,1);padding:20px}
@keyframes slide{from{transform:translateX(30%);opacity:.3}}
.drawer h3{font-family:var(--f-display);font-size:24px}
.tl2{display:grid;gap:0;margin:10px 0}
.tl2 div{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;font-size:13px;padding:6px 0;color:var(--muted)}
.tl2 div i{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--forest-4)}
.tl2 div.done{color:var(--cream)}.tl2 div.done i{background:var(--gold)}
.tl2 div span{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.qr{display:flex;flex-wrap:wrap;gap:6px}
.qr button{padding:8px 11px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;text-align:left}
.qr button:hover{border-color:var(--gold)}

/* promos */
.pgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.pc{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:12px;border-radius:18px;background:var(--forest-2);border:1px solid var(--line);margin-bottom:10px}
.pc img{width:120px;height:100px;border-radius:12px;object-fit:cover}
.pc h4{font-family:var(--f-display);font-size:18px;color:var(--gold-2)}
.pc p{margin:4px 0 8px;font-size:12.5px;color:var(--muted)}
.pc .ft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.form{padding:16px;border-radius:20px;background:var(--forest-2);border:1px solid var(--line-2);display:grid;gap:10px}
.form label{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.form select{width:100%;background:var(--forest);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.prev{border-radius:18px;overflow:hidden;border:1px solid var(--gold);background:var(--forest);margin-top:4px}
.prev img{width:100%;height:120px;object-fit:cover}
.prev div{padding:10px 14px 14px;text-align:center}
.prev b{font-family:var(--f-display);font-size:19px;color:var(--gold-2);display:block;font-weight:400}
.prev small{color:var(--muted);font-size:12px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:18px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:left;padding:12px 14px;background:rgba(8,24,16,.6);font-weight:700}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tier{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:var(--ink)}
.tier.Aur{background:linear-gradient(135deg,#f7e2b5,#d9a75b)}.tier.Argint{background:linear-gradient(135deg,#f1f3f1,#aab3ae)}.tier.Bronz{background:linear-gradient(135deg,#f1c9a5,#b8774a)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rule{padding:14px;border-radius:16px;background:var(--forest-2);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.rule b{display:block;font-family:var(--f-display);font-size:20px;color:var(--gold-2);font-weight:400}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mi{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--forest-2);border:1px solid var(--line)}
.mi img,.mi .ph{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--forest-3)}
.mi b{font-size:12.5px;display:block;line-height:1.25}
.mi .row-btw{margin-top:4px;font-size:12px;color:var(--gold-2)}
.mi.off{opacity:.55}
.mi .switch{width:40px;height:22px}.mi .switch::after{width:16px;height:16px}.mi .switch[aria-checked="true"]::after{transform:translateX(18px)}
.h3{font-family:var(--f-display);font-size:20px;color:var(--gold-2);margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}

@media (max-width:760px){.rx{grid-template-columns:minmax(0,1fr)}.rx-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.rx-side .rb,.openbox{display:none}.rnav{white-space:nowrap}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rx-top,.rx-body{padding-inline:16px}.pc{grid-template-columns:minmax(0,1fr)}.pc img{width:100%;height:140px}.etas{grid-template-columns:repeat(3,1fr)}}

.big svg,.accept svg{width:20px;height:20px;flex:none}
.mini svg{width:15px;height:15px;vertical-align:-3px}
.oc>*,.col{min-width:0}
.oc .h{flex-wrap:wrap}
.ph{background:radial-gradient(circle at 35% 35%,#f6d9a6,#c98a3d 60%,#7a4f1d)!important}
td:first-child{min-width:150px}
.stage.only-client #client-wrap{width:100%}
.phone{margin-inline:auto}
@media (max-width:1180px){.stage #client-wrap{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const $ = s => document.querySelector(s);

function lineUnit(l){ const it = BY[l.id]; if(l.pp!=null) return l.pp; return it.p + (l.ex||[]).reduce((s,k)=>s+(BY[k]?.p||0),0); }
function priceOrder(items, mode, c, usePts, code){
  const sub = items.reduce((s,l)=>s+lineUnit(l)*l.qty,0);
  let disc = 0, codeL = "";
  const cd = CODES[code];
  if(cd){ const base = cd.cat ? items.filter(l=>BY[l.id].c===cd.cat && l.pp==null).reduce((s,l)=>s+lineUnit(l)*l.qty,0) : sub; disc = base*cd.pct/100; codeL = cd.l; }
  const tier = tierOf(c.life);
  const fee = mode==="livrare" && sub>0 && sub<FREE_OVER && tier.n!=="Aur" ? DELIV_FEE : 0;
  const ptsVal = usePts ? Math.min(Math.floor(c.pts/100)*10, Math.floor((sub-disc)*0.5/10)*10) : 0;
  const total = Math.max(0, sub - disc - ptsVal + fee);
  const earn = Math.floor(total * tier.mult);
  return {sub, disc, codeL, fee, ptsVal, ptsUsed:ptsVal*10, total, earn};
}

function trackCard(o){

  if(o.status==="new"){
    ring = `<div class="ring wait"><svg viewBox="0 0 184 184"><circle cx="92" cy="92" r="${R}" stroke="#1e452f" stroke-width="10" fill="none"/><circle cx="92" cy="92" r="${R}" stroke="#e9b770" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${CIRC*.22} ${CIRC}"/></svg><div class="c"><b style="font-size:30px">#${o.no}</b><small>trimisă</small></div></div>`;
    title = "Restaurantul confirmă comanda"; sub = "De obicei durează sub un minut. Vei vedea aici ora estimată.";
  } else if(o.status==="rejected"){

  } else {
    const rem = remaining(o), frac = Math.max(0, Math.min(1, rem/(o.eta*MIN)));
    ring = `<div class="ring"><svg viewBox="0 0 184 184"><circle cx="92" cy="92" r="${R}" stroke="#1e452f" stroke-width="10" fill="none"/><circle data-ring="${o.id}" cx="92" cy="92" r="${R}" stroke="#e9b770" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC*(1-frac)}" style="transition:stroke-dashoffset 1s linear"/></svg><div class="c"><b class="num" data-min="${o.id}">${Math.max(0,Math.ceil(rem/MIN))}</b><small>minute</small></div></div>`;

function addToCart(id, qty=1, ex=[], note="", extra={}){
  const it = BY[id]; if(!it || S.soldOut[id]) return;
  const key = id+"|"+ex.slice().sort().join(",")+"|"+note+"|"+(extra.pp??"");
  const ex1 = C.cart.find(l=>l.key===key && !l.gift && !l.reward);
  if(ex1) ex1.qty += qty; else C.cart.push({key,id,qty,ex,note,...extra});
}
function ensureGift(){
  const c = me();
  const has = C.cart.find(l=>l.gift);
  if(c.free && !has && C.cart.length) C.cart.push({key:"gift",id:"papanas",qty:1,ex:[],pp:0,gift:true});
  if((!c.free || !C.cart.some(l=>!l.gift)) && has) C.cart = C.cart.filter(l=>!l.gift);
}
function placeOrder(){
  const c = me(), P = cartTotals();
  const f = C.form;
  if(!f.name.trim() || !f.phone.trim() || (C.mode==="livrare" && !f.addr.trim())){ ctoast("alert","Completează numele, telefonul și adresa."); return; }
  const o = {id:"o"+(++S.seq), no:S.seq, cust:c.id, name:f.name, phone:f.phone, addr:C.mode==="livrare"?f.addr:"Ridicare din restaurant", mode:C.mode, pay:C.pay,
    items:C.cart.map(l=>({id:l.id,qty:l.qty,ex:l.ex||[],note:l.note||"",pp:l.pp,gift:l.gift,reward:l.reward,promo:l.promo})), note:C.note, created:now(), msgs:[], status:"new", allergies:c.allergies.slice(), code:C.code, ...P};
  c.pts -= P.ptsUsed;
  if(C.cart.some(l=>l.gift)) c.free = false;
  S.orders.push(o);
  C.cart = []; C.usePts = false; C.code = ""; C.codeMsg = ""; C.note = "";
  closeSheet(); C.tab = "orders";
  commit();
  $("#c-scroll").scrollTop = 0;
  ctoast("send", `Comanda #${o.no} a fost trimisă restaurantului.`);
}

/* ---- client events ---- */
$("#screen").addEventListener("click", e => {
  const b = e.target.closest("button,[data-act],input[type=checkbox]"); if(!b) return;
  const d = b.dataset;
  if(d.ctab){ C.tab = d.ctab; closeSheet(); renderClient(); $("#c-scroll").scrollTop=0; return; }
  if(d.mode){ C.mode = d.mode; renderClient(); if(C.sheet?.kind==="cart") renderSheet(); return; }
  if(d.mood){ C.mood = C.mood===d.mood?null:d.mood; renderClient(); return; }
  if(d.jump){ C.cat = d.jump; const s = $("#sec-"+d.jump); if(s){ $("#c-scroll").scrollTo({top:s.offsetTop-84,behavior:"smooth"}); } updateCats(); return; }
  if(d.open){ openSheet("item",{id:d.open,qty:1,ex:[],note:""}); return; }
  if(d.quick){ addToCart(d.quick); ensureGift(); renderClient(); if(C.sheet?.kind==="cart") renderSheet(); bump(); return; }
  if(d.inc){ const l = [...C.cart].reverse().find(l=>l.id===d.inc&&!l.gift&&!l.reward); l ? l.qty++ : addToCart(d.inc); renderClient(); return; }
  if(d.dec){ const l = [...C.cart].reverse().find(l=>l.id===d.dec&&!l.gift&&!l.reward); if(l){ l.qty--; if(!l.qty) C.cart.splice(C.cart.indexOf(l),1);} ensureGift(); renderClient(); return; }
  if(d.cinc){ C.cart[+d.cinc].qty++; renderSheet(); renderClient(); return; }
  if(d.cdec){ const l = C.cart[+d.cdec]; l.qty--; if(!l.qty) C.cart.splice(+d.cdec,1); ensureGift(); renderSheet(); renderClient(); return; }
  if(d.sq){ C.sheet.qty = Math.max(1, C.sheet.qty + +d.sq); C.sheet.note = $("#it-note")?.value||""; renderSheet(); return; }
  if(d.ex){ const s = C.sheet; s.note = $("#it-note")?.value||""; s.ex = b.checked ? [...s.ex,d.ex] : s.ex.filter(k=>k!==d.ex); renderSheet(); return; }
  if(d.pay){ C.pay = d.pay; renderSheet(); return; }
  if(d.rate){ const [id,n] = d.rate.split(":"); const o = S.orders.find(x=>x.id===id); if(!o.rating) S.ratings.push(+n); else S.ratings[S.ratings.length-1] = +n; o.rating = +n; commit(); return; }
  if(d.reorder){ const o = S.orders.find(x=>x.id===d.reorder); o.items.filter(l=>!l.gift&&!l.reward).forEach(l=>addToCart(l.id,l.qty,l.ex,l.note)); ensureGift(); C.tab="menu"; renderClient(); openSheet("cart"); return; }
  if(d.reorderIds){ d.reorderIds.split(",").forEach(id=>addToCart(id)); ensureGift(); C.tab="menu"; renderClient(); openSheet("cart"); return; }
  if(d.redeem){ const [id,cost] = d.redeem.split(":"); const c = me(); if(c.pts<+cost) return; c.pts -= +cost; C.cart.push({key:"rw"+now(),id,qty:1,ex:[],pp:0,reward:true}); ensureGift(); commit(); ctoast("gift", `${nm(BY[id])} a fost adăugat în coș, plătit cu ${cost} puncte.`); return; }
  if(d.alg){ const c = me(); c.allergies = c.allergies.includes(d.alg) ? c.allergies.filter(a=>a!==d.alg) : [...c.allergies,d.alg]; commit(); return; }
  if(d.promo){ const p = S.promos.find(x=>x.id===d.promo); $("#c-pop").innerHTML="";
    if(p.price!=null){ addToCart(p.item,1,p.extras||[],"",{pp:p.price,promo:p.title}); ensureGift(); renderClient(); openSheet("cart"); }
    else if(p.code){ C.code = p.code; C.codeMsg = "Codul "+p.code+" a fost aplicat: "+CODES[p.code].l; ctoast("check","Codul "+p.code+" e salvat pentru comanda ta."); renderClient(); }
    else { C.tab="menu"; renderClient(); }
    return; }
  switch(d.act){
    case "close": closeSheet(); break;
    case "pop-close": $("#c-pop").innerHTML=""; break;
    case "open-cart": ensureGift(); openSheet("cart"); break;
    case "add-item": { const s = C.sheet; addToCart(s.id, s.qty, s.ex, ($("#it-note")?.value||"").trim()); ensureGift(); closeSheet(); renderClient(); bump(); ctoast("check", `${nm(BY[s.id])} a fost adăugat în coș.`); break; }
    case "lang": C.lang = C.lang==="ro"?"hu":"ro"; renderClient(); if(C.sheet) renderSheet(); break;
    case "allergy": if(!me().allergies.length){ C.tab="club"; renderClient(); ctoast("shield","Alege alergiile tale; le marcăm în tot meniul."); setTimeout(()=>{const el=$(".chips"); el && $("#c-scroll").scrollTo({top:el.offsetTop-200,behavior:"smooth"})},50);} else { C.hideBlocked=!C.hideBlocked; renderClient(); } break;
    case "pts": C.usePts = !C.usePts; renderSheet(); break;
    case "code": { const v = ($("#f-code").value||"").trim().toUpperCase(); if(CODES[v]){ C.code=v; C.codeMsg="Cod aplicat: "+CODES[v].l; } else { C.code=""; C.codeMsg = v ? "Codul „"+esc(v)+"” nu există sau a expirat." : ""; } renderSheet(); break; }
    case "place": placeOrder(); break;
    case "copy": { const t="IOANA-LYRA"; navigator.clipboard?.writeText(t).then(()=>ctoast("check","Codul a fost copiat."),()=>ctoast("copy","Codul tău: "+t)); break; }
  }
});

/* ---- order lifecycle (reception actions) ---- */
function pushMsg(o, text){ o.msgs.push({at:now(), text}); }
function accept(o, eta){
  o.status="prep"; o.acceptedAt=now(); o.eta=eta;
  pushMsg(o, `Comanda a fost acceptată. Estimăm ${o.mode==="livrare"?"livrarea":"ridicarea"} în ${eta} minute, la ${hm(now()+eta*MIN)}.`);
  R.eta=null; R.inc=0; commit();
}
function advance(o){
  if(o.status==="prep"){ o.status="road"; o.roadAt=now(); pushMsg(o, o.mode==="livrare"?"Curierul a preluat comanda și e pe drum spre tine.":"Comanda e gata. Te așteptăm la restaurant."); }
  else if(o.status==="road"){ o.status="done"; o.doneAt=now(); const c = cust(o.cust);
    c.orders++; c.spent += o.total; c.pts += o.earn; c.life += o.earn; c.stars++;
    if(c.stars>=STARS){ c.stars=0; c.free=true; pushMsg(o,"Ai aprins Vega! Papanașul din partea casei e deja în coșul următoarei comenzi."); }
    pushMsg(o, `Poftă bună! Ai primit ${o.earn} puncte Lyra Club.`); }
  commit();
}
function simulate(){
  const pool = ["c2","c3","c4","c5","c6"];
  const cid = pool[Math.floor(Math.random()*pool.length)], c = cust(cid);
  const mains = ["ciolan-lyra","costite","eleven-burger","double-smash","papricas","cordon-bleu","snitel-lyra","fasole-batuta","burger-ozn","carbonara","halloumi","tocanita","borzas"].filter(id=>!S.soldOut[id]);
  const sides = ["varza-murata","muraturi","salata-asortata","mujdei","sosul-casei","cartofi"];
  const des = ["papanas","lapte-pasare","tarta-mere"];
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const items = [{id:pick(mains),qty:1+(Math.random()<.35?1:0),ex:Math.random()<.4?["mujdei"]:[]}];
  if(Math.random()<.7) items.push({id:pick(mains),qty:1,ex:[]});
  if(Math.random()<.6) items.push({id:pick(sides),qty:1,ex:[]});
  if(Math.random()<.5) items.push({id:pick(des),qty:1+(Math.random()<.3?1:0),ex:[]});
  items.forEach(l=>{ if(["smash","burger"].includes(BY[l.id].c)) l.ex=[]; });
  const mode = Math.random()<.75?"livrare":"ridicare";
  const notes = ["","",items.some(l=>["smash","burger"].includes(BY[l.id].c))?"Fără ceapă la burger, vă rog.":"Fără ceapă, vă rog.","Sună când ajungi, interfonul nu merge.","Sosul separat.",""];
  const o = {id:"o"+(++S.seq), no:S.seq, cust:cid, name:c.name, phone:c.phone, addr:mode==="livrare"?c.addr:"Ridicare din restaurant", mode, pay:pick(["card","cash","online"]), items, note:pick(notes), created:now(), msgs:[], status:"new", allergies:c.allergies.slice(), ...priceOrder(items, mode, c, false, "")};
  S.orders.push(o); commit();
}

$("#rx").addEventListener("click", e => {
  unlockAudio();
  const b = e.target.closest("[data-rtab],[data-ract],[data-eta],[data-accept],[data-reject],[data-adv],[data-od],[data-inc],[data-delay],[data-msg],[data-ptog],[data-push],[data-bonus],[data-stock]"); if(!b) return;
  const d = b.dataset;
  if(d.rtab){ R.tab=d.rtab; R.drawer=null; renderRx(); $("#rx-main").scrollTop=0; return; }
  if(d.eta){ R.eta=+d.eta; renderRx(); return; }
  if(d.inc){ R.inc=+d.inc; R.eta=null; renderRx(); return; }
  if(d.accept){ accept(S.orders.find(o=>o.id===d.accept), R.eta); return; }
  if(d.reject){ const [id,r] = d.reject.split(":"); const o = S.orders.find(x=>x.id===id); o.status="rejected"; o.reason=r; pushMsg(o,"Ne pare rău, nu putem prelua comanda: "+r.toLowerCase()+"."); if(o.ptsUsed) cust(o.cust).pts += o.ptsUsed; R.rejecting=false; R.eta=null; commit(); return; }
  if(d.adv){ e.stopPropagation(); advance(S.orders.find(o=>o.id===d.adv)); return; }
  if(d.od){ R.drawer=d.od; renderDrawer(); return; }
  if(d.delay){ const [id,m] = d.delay.split(":"); const o = S.orders.find(x=>x.id===id); o.eta = Math.max(5, o.eta + +m); pushMsg(o, +m>0 ? `Avem nevoie de încă ${m} minute ca totul să iasă perfect. Noua oră estimată: ${hm(o.acceptedAt+o.eta*MIN)}.` : `Vești bune: comanda ajunge mai repede, la ${hm(o.acceptedAt+o.eta*MIN)}.`); commit(); return; }
  if(d.msg){ const o = S.orders.find(x=>x.id===d.msg); pushMsg(o, b.textContent.trim()); commit(); rxFlash(b); return; }
  if(d.ptog){ const p = S.promos.find(x=>x.id===d.ptog); p.active=!p.active; commit(); return; }
  if(d.push){ S.pushPromo = {id:d.push, at:now()}; commit(); return; }
  if(d.bonus){ const c = cust(d.bonus); c.pts+=100; c.life+=100; commit(); if(c.id===C.me) ctoast("gift","Lyra ți-a oferit 100 de puncte bonus."); return; }
  if(d.stock){ S.soldOut[d.stock] = !S.soldOut[d.stock]; commit(); return; }
  switch(d.ract){
    case "open": S.open=!S.open; commit(); break;
    case "sound": S.sound=!S.sound; commit(); break;
    case "sim": simulate(); break;
    case "rej": R.rejecting=true; renderRx(); break;
    case "norej": R.rejecting=false; renderRx(); break;
    case "dclose": R.drawer=null; renderDrawer(); break;
    case "publish": { const dr = R.draft; if(!dr.title.trim()){ $("#pd-title").focus(); return; }
      const it = BY[dr.item]; const p = {id:"p"+now(), kicker:dr.kicker||"Ofertă", title:dr.title.trim(), text:dr.text.trim()||it.ro, item:dr.code?null:dr.item, extras:[], price:dr.price&&!dr.code?+String(dr.price).replace(",","."):null, code:dr.code||null, img:it.img, active:true, popup:true};
      S.promos.unshift(p); S.pushPromo={id:p.id,at:now()}; R.draft={kicker:"Ofertă specială",title:"",text:"",item:"ciolan-lyra",price:"",code:"",img:"ciolan-lyra"}; commit(); break; }
  }
});

/* ---- sound: two-tone bell for new orders ---- */
let AC = null;
function unlockAudio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } AC && AC.state==="suspended" && AC.resume(); }
document.addEventListener("pointerdown", unlockAudio, {once:true});
function chime(){
  if(!AC || !S.sound) return;
  const t = AC.currentTime;
  [[880,0],[1318.5,.16],[1760,.32]].forEach(([f,dt])=>{ const o = AC.createOscillator(), g = AC.createGain(); o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0,t+dt); g.gain.linearRampToValueAtTime(.18,t+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dt+.9); o.connect(g).connect(AC.destination); o.start(t+dt); o.stop(t+dt+1); });
}

/* ================= global render + ticking ================= */
let lastNew = new Set(S.orders.filter(o=>o.status==="new").map(o=>o.id));
let lastStatus = Object.fromEntries(S.orders.map(o=>[o.id,o.status]));
function renderAll(){
  renderClient(); renderRx();
  // reception: ring on fresh orders
  const nw = S.orders.filter(o=>o.status==="new").map(o=>o.id);
  if(nw.some(id=>!lastNew.has(id))) chime();
  lastNew = new Set(nw);
  // client: toasts when restaurant updates my order
  S.orders.filter(o=>o.cust===C.me).forEach(o=>{
    const prev = lastStatus[o.id];
    if(prev && prev!==o.status){
      if(o.status==="prep") ctoast("check", `Comanda #${o.no} a fost acceptată · ${o.eta} min`);
      if(o.status==="road") ctoast("bike", o.mode==="livrare"?"Curierul e pe drum!":"Comanda e gata de ridicare.");
      if(o.status==="done") ctoast("star", `+${o.earn} puncte Lyra Club`);
      if(o.status==="rejected") ctoast("alert", "Comanda nu a putut fi preluată.");
    }
    lastStatus[o.id] = o.status;
  });
  // client: promo pushed from reception
  if(S.pushPromo && S.pushPromo.at > C.lastPromo){ C.lastPromo = S.pushPromo.at; showPromo(S.promos.find(p=>p.id===S.pushPromo.id)); }
  const n = S.orders.filter(o=>o.status==="new").length;
  document.title = n ? `(${n}) Comandă nouă · Lyra` : "Lyra Comenzi";
}
setInterval(()=>{
  const ck = $("#rx-clock"); if(ck) ck.textContent = new Date().toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  document.querySelectorAll("[data-rem]").forEach(el=>{ const o = S.orders.find(x=>x.id===el.dataset.rem); if(!o) return; const r = remaining(o); el.textContent = r<0?"întârziere "+mmss(r):mmss(r); el.className = "tm num "+(r<0?"bad":r<8*MIN?"warn":"ok"); const bar = document.querySelector(`[data-bar="${o.id}"]`); if(bar) bar.style.width = Math.min(100,Math.max(2,(1-r/(o.eta*MIN))*100))+"%"; });
  document.querySelectorAll("[data-min]").forEach(el=>{ const o = S.orders.find(x=>x.id===el.dataset.min); if(!o) return; const r = remaining(o); el.textContent = Math.max(0,Math.ceil(r/MIN)); const ring = document.querySelector(`[data-ring="${o.id}"]`); if(ring){ const C2 = 2*Math.PI*82; ring.style.strokeDashoffset = C2*(1-Math.max(0,Math.min(1,r/(o.eta*MIN)))); } });
  document.querySelectorAll("[data-age]").forEach(el=>{ el.textContent = "acum "+mmss(now()- +el.dataset.age); });
  document.querySelectorAll("[data-cd]").forEach(el=>{ el.textContent = "expiră în "+hms(+el.dataset.cd-now()); });
}, 1000);
setInterval(()=>{ if(S.sound && S.orders.some(o=>o.status==="new")) chime(); }, 9000);

/* ================= view switch ================= */
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  unlockAudio();
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  $("#stage").className = "stage" + (b.dataset.view==="client"?" only-client":b.dataset.view==="rx"?" only-rx":"");
  try{ localStorage.setItem("lyra-view", b.dataset.view) }catch(e){}
}));
try{ const v = localStorage.getItem("lyra-view") || (matchMedia("(max-width:760px)").matches?"client":null); v && document.querySelector(`.seg [data-view="${v}"]`)?.click(); }catch(e){}

/* ================= boot ================= */
C.form = {name:me().name, phone:me().phone, addr:me().addr};
renderAll();
// promo popup on first open of the app
setTimeout(()=>{ const p = S.promos.find(p=>p.active && p.popup); if(p && !$("#c-pop").innerHTML){ C.lastPromo = Math.max(C.lastPromo, S.pushPromo?.at||0); showPromo(p); } }, 1400);
// a fresh order lands at reception a few seconds after opening, to show the flow
setTimeout(()=>{ if(!S.orders.some(o=>o.status==="new")) simulate(); }, 7000);
</script>
