<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meniu Tacos – Ecran Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e30613;
    --red-hot:#ff2b2b;
    --blue-deep:#020b33;
    --blue:#0b2a8f;
    --blue-panel:#3a73d4;
    --gold:#ffcc4d;
    --W:1080px; --H:1920px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
  body{display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif}

  /* blurred fill for screens that are not exactly 9:16 */
  #fill{position:fixed;inset:0;background:
      radial-gradient(ellipse at 50% 30%, #1c46c9 0%, #071a66 45%, #01051c 100%);
    filter:blur(30px);transform:scale(1.1)}

  #stage{
    position:relative;width:var(--W);height:var(--H);flex:none;overflow:hidden;
    transform-origin:center center;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(60,110,255,.55), transparent 70%),
      radial-gradient(ellipse 70% 60% at 20% 70%, rgba(20,60,200,.45), transparent 70%),
      linear-gradient(180deg,#0a2a9c 0%,#07207a 40%,#041457 75%,#020b33 100%);
    color:#fff;
  }

  /* ---------- BACKGROUND LAYERS ---------- */
  .beams{position:absolute;left:50%;top:-500px;width:2600px;height:2600px;margin-left:-1300px;
    background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(120,170,255,.10) 0 4deg, transparent 4deg 14deg);
    -webkit-mask:radial-gradient(circle at 50% 50%, #000 0%, transparent 55%);
            mask:radial-gradient(circle at 50% 50%, #000 0%, transparent 55%);
    animation:spin 90s linear infinite;mix-blend-mode:screen}
  .eiffel{position:absolute;left:-40px;top:200px;width:620px;height:1650px;opacity:.16;
    filter:drop-shadow(0 0 20px rgba(0,0,0,.6));animation:eiffelGlow 8s ease-in-out infinite}
  .halftone{position:absolute;inset:0;
    background-image:radial-gradient(rgba(140,190,255,.22) 2px, transparent 2.6px);
    background-size:22px 22px;
    -webkit-mask:radial-gradient(ellipse 50% 40% at 75% 45%, #000, transparent 70%);
            mask:radial-gradient(ellipse 50% 40% at 75% 45%, #000, transparent 70%);
    animation:drift 20s linear infinite}
  .cracks{position:absolute;inset:0;pointer-events:none;opacity:.55}
  .cracks path{fill:none;stroke:#01040f;stroke-width:3;stroke-linecap:round}
  .cracks .gl{stroke:rgba(255,215,90,.75);stroke-width:2;filter:drop-shadow(0 0 6px #ffd24d)}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 75% 65% at 50% 45%, transparent 55%, rgba(0,0,20,.75) 100%)}
  .sweep{position:absolute;top:-20%;left:-60%;width:40%;height:140%;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),rgba(255,255,255,.35),rgba(255,255,255,.18),transparent);
    transform:skewX(-20deg);mix-blend-mode:overlay;animation:sweep 9s ease-in-out infinite 4s}

  /* ---------- TITLE ---------- */
  .title{position:absolute;top:95px;left:0;right:0;text-align:center;font-family:'Anton',sans-serif;
    font-style:italic;letter-spacing:2px;perspective:900px}
  .title .l1{font-size:118px;line-height:1.05}
  .title .l2{font-size:74px;line-height:1.1;margin-top:18px}
  .title .ch{display:inline-block;color:var(--red);
    -webkit-text-stroke:7px #fff;paint-order:stroke fill;
    transform:skewX(-10deg);
    text-shadow:0 8px 0 #7a0008, 0 14px 30px rgba(0,0,0,.6);
  }
  .title .ch.sp{width:.28em}
  .play .title .ch{animation:dropIn .7s cubic-bezier(.2,1.6,.4,1) both, wave 7s ease-in-out infinite;
    animation-delay:calc(var(--d) * 45ms + .2s), calc(var(--d) * 60ms + 3s)}

  /* ---------- LEFT: PRICE CARDS ---------- */
  .cards{position:absolute;left:58px;top:450px;width:400px;height:1420px;
    display:flex;flex-direction:column;justify-content:space-between}
  .card{position:relative;text-align:center;transition:transform .6s cubic-bezier(.2,1.4,.4,1), filter .6s}
  .play .card{animation:slideIn 1s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(1.2s + var(--i) * .22s)}
  .card .kind{font-weight:900;font-size:52px;letter-spacing:1px;line-height:1;
    text-shadow:0 4px 0 #0a1c66,0 0 20px rgba(120,170,255,.6)}
  .card .size{display:flex;align-items:center;gap:18px;height:104px;margin-top:-2px}
  .card .size::before,.card .size::after{content:"";flex:1;height:6px;margin-top:40px;border-radius:3px;
    background:var(--red);box-shadow:0 0 12px var(--red-hot)}
  .card .size b{position:relative;z-index:2;font-weight:900;font-size:120px;line-height:1;letter-spacing:-2px;
    text-shadow:0 6px 0 #0a1c66, 0 0 30px rgba(255,255,255,.35)}
  .card.bol .size b{font-size:104px}
  .card .box{position:relative;height:190px;margin-top:-32px;padding:10px 20px 0 34px;
    border:6px solid var(--red);border-top:none;border-radius:0 0 12px 12px;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(10,30,110,.55) 100%);
    box-shadow:0 0 18px rgba(255,40,40,.55), inset 0 0 22px rgba(255,40,40,.25);overflow:visible}
  .card .info{text-align:left;font-weight:800;font-size:31px;line-height:1.28;
    text-shadow:0 3px 8px rgba(0,0,0,.6)}
  .card .info small{display:block;font-size:29px;font-weight:700;opacity:.95}
  .card .shine{position:absolute;inset:0;overflow:hidden;border-radius:0 0 8px 8px;pointer-events:none}
  .card .shine::after{content:"";position:absolute;top:-10%;left:-70%;width:45%;height:120%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);
    animation:cardShine 6s ease-in-out infinite;animation-delay:calc(var(--i) * .5s + 3s)}

  .price{position:relative;width:156px;height:156px;flex:none;margin:0 -6px 0 0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff4a4a 0%, #e30613 45%, #9b0010 100%);
    box-shadow:0 0 0 5px #fff, 0 0 0 9px rgba(227,6,19,.5), 0 12px 30px rgba(0,0,0,.55), 0 0 40px rgba(255,40,40,.6);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:italic}
  .play .price{animation:popIn .9s cubic-bezier(.2,1.8,.4,1) both;animation-delay:calc(1.7s + var(--i) * .22s)}
  .price::before{content:"";position:absolute;inset:-4px;border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0 70%, rgba(255,255,255,.9) 80%, transparent 90%);
    -webkit-mask:radial-gradient(circle, transparent 66%, #000 67%, #000 71%, transparent 72%);
            mask:radial-gradient(circle, transparent 66%, #000 67%, #000 71%, transparent 72%);
    animation:spin 3s linear infinite}
  .price .num{font-weight:900;font-size:92px;line-height:.9;letter-spacing:-3px;
    text-shadow:0 4px 0 #7a0008}
  .price .lei{font-weight:800;font-size:30px;line-height:1;margin-top:2px}

  .card.active{transform:scale(1.08) translateX(10px);z-index:5;filter:drop-shadow(0 0 25px rgba(255,60,60,.65))}
  .card.active .box{border-color:var(--red-hot);box-shadow:0 0 35px rgba(255,60,60,.9), inset 0 0 40px rgba(255,60,60,.4)}
  .card.active .price{animation:bounce .8s cubic-bezier(.3,1.8,.5,1)}
  .card.active .size b{color:var(--gold);transition:color .3s}

  /* ---------- RIGHT PANEL ---------- */
  .panel{position:absolute;left:520px;top:440px;width:480px;height:1500px;border-radius:44px 44px 0 0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,255,255,.18), transparent 60%),
      linear-gradient(180deg,#4b86e6 0%,#3a6fd0 50%,#2756b5 100%);
    box-shadow:0 0 0 3px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.5), inset 0 0 60px rgba(255,255,255,.1)}
  .play .panel{animation:rise 1.1s cubic-bezier(.2,1,.3,1) both .8s}
  .panel::before{content:"";position:absolute;inset:0;border-radius:inherit;
    background-image:radial-gradient(rgba(255,255,255,.28) 2.4px, transparent 3px);background-size:20px 20px;
    -webkit-mask:linear-gradient(200deg,transparent 30%,#000 55%,transparent 80%);
            mask:linear-gradient(200deg,transparent 30%,#000 55%,transparent 80%);
    animation:drift 14s linear infinite reverse}

  .badge{position:absolute;left:50%;top:-110px;width:176px;height:176px;margin-left:-88px;z-index:3}
  .play .badge{animation:badgeIn 1.1s cubic-bezier(.2,1.6,.4,1) both 1.6s}
  .badge .core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dfe8ff);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 6px #2756b5, 0 0 40px rgba(255,255,255,.6);
    animation:breathe 2.6s ease-in-out infinite}
  .badge .core span{font-family:'Anton',sans-serif;font-style:italic;font-size:132px;line-height:1;color:#0b2a8f;
    transform:skewX(-8deg);text-shadow:4px 4px 0 rgba(11,42,143,.25)}
  .badge .ring{position:absolute;inset:-22px;border-radius:50%;border:4px dashed rgba(255,255,255,.7);animation:spin 12s linear infinite}
  .badge .ring2{position:absolute;inset:-40px;border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0 75%, rgba(255,215,90,.9) 92%, transparent 100%);
    -webkit-mask:radial-gradient(circle, transparent 64%, #000 65%, #000 68%, transparent 69%);
            mask:radial-gradient(circle, transparent 64%, #000 65%, #000 68%, transparent 69%);
    animation:spin 2.4s linear infinite reverse}

  .step{position:absolute;top:122px;left:0;right:0;text-align:center;font-family:'Oswald',sans-serif;font-weight:500;
    font-size:96px;line-height:1;letter-spacing:1px;text-shadow:0 6px 20px rgba(0,0,40,.45)}
  .play .step{animation:blurIn 1s ease-out both 2.1s}

  .food{position:absolute;z-index:2}
  .food .burst{position:absolute;left:50%;top:50%;width:760px;height:760px;margin:-380px 0 0 -380px;
    background:repeating-conic-gradient(from 0deg, rgba(255,230,150,.32) 0 5deg, transparent 5deg 15deg);
    -webkit-mask:radial-gradient(circle, #000 8%, transparent 62%);
            mask:radial-gradient(circle, #000 8%, transparent 62%);
    animation:spin 26s linear infinite;mix-blend-mode:screen}
  .food .glow{position:absolute;left:50%;top:55%;width:70%;height:40%;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, rgba(255,200,80,.65), transparent 70%);filter:blur(20px);
    animation:glowPulse 3s ease-in-out infinite}
  .food .float{position:relative;animation:float 5s ease-in-out infinite}
  .food img{display:block;width:100%;filter:drop-shadow(0 30px 30px rgba(0,0,30,.55)) saturate(1.15) contrast(1.05)}
  .food .shadow{position:absolute;left:15%;right:15%;bottom:-18px;height:30px;border-radius:50%;
    background:radial-gradient(ellipse, rgba(0,0,30,.55), transparent 70%);animation:shadowPulse 5s ease-in-out infinite}
  .steam{position:absolute;bottom:62%;width:46px;height:140px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 60%, rgba(255,255,255,.55), transparent 65%);filter:blur(10px);opacity:0;
    animation:steam 4s ease-in infinite}

  .tacos{left:-60px;top:250px;width:590px}
  .play .tacos{animation:zoomSpin 1.3s cubic-bezier(.2,1.3,.3,1) both 2.4s}
  .bowl{left:40px;top:985px;width:410px}
  .play .bowl{animation:zoomSpin 1.3s cubic-bezier(.2,1.3,.3,1) both 3.6s}
  .bowl .float{animation-delay:-2.5s}
  .bowl .shadow{animation-delay:-2.5s}

  .banner{position:absolute;left:-150px;right:-60px;top:700px;text-align:center;z-index:3;
    font-family:'Anton',sans-serif;font-style:italic;font-size:62px;line-height:1.18;letter-spacing:.5px}
  .banner div{display:block}
  .banner span{display:inline-block;color:var(--red);-webkit-text-stroke:6px #fff;paint-order:stroke fill;
    transform:skewX(-10deg) scaleY(1.08);text-shadow:0 6px 0 #6b0007, 0 10px 25px rgba(0,0,0,.5)}
  .play .banner div{animation:stamp .7s cubic-bezier(.2,1.8,.4,1) both}
  .play .banner div:nth-child(1){animation-delay:3.1s}
  .play .banner div:nth-child(2){animation-delay:3.3s}
  .play .banner div:nth-child(3){animation-delay:3.5s}
  .banner .hl span{animation:neon 5s linear infinite 5s}

  /* flash used between loops */
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
  .play .flash{animation:flash .9s ease-out both}

  /* ---------- KEYFRAMES ---------- */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{to{background-position:220px 220px}}
  @keyframes eiffelGlow{0%,100%{opacity:.13}50%{opacity:.22}}
  @keyframes sweep{0%{left:-60%}35%,100%{left:130%}}
  @keyframes dropIn{0%{opacity:0;transform:translateY(-220px) rotateX(90deg) skewX(-10deg) scale(1.6)}
    100%{opacity:1;transform:translateY(0) rotateX(0) skewX(-10deg) scale(1)}}
  @keyframes wave{0%,8%,100%{transform:skewX(-10deg) translateY(0);filter:brightness(1)}
    4%{transform:skewX(-10deg) translateY(-14px) scale(1.06);filter:brightness(1.35) drop-shadow(0 0 14px #ff5a5a)}}
  @keyframes slideIn{0%{opacity:0;transform:translateX(-520px) skewX(14deg)}70%{transform:translateX(18px) skewX(-4deg)}100%{opacity:1;transform:none}}
  @keyframes popIn{0%{opacity:0;transform:scale(0) rotate(-200deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-8deg)}70%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}
  @keyframes cardShine{0%{left:-70%}30%,100%{left:140%}}
  @keyframes rise{0%{opacity:0;transform:translateY(400px)}100%{opacity:1;transform:none}}
  @keyframes badgeIn{0%{opacity:0;transform:scale(0) rotate(-540deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes blurIn{0%{opacity:0;filter:blur(20px);letter-spacing:40px}100%{opacity:1;filter:blur(0);letter-spacing:1px}}
  @keyframes zoomSpin{0%{opacity:0;transform:scale(.2) rotate(-25deg) translateX(400px)}100%{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-22px) rotate(2deg)}}
  @keyframes shadowPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.6}}
  @keyframes glowPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
  @keyframes steam{0%{opacity:0;transform:translateY(40px) scaleX(.6)}25%{opacity:.8}100%{opacity:0;transform:translateY(-170px) scaleX(1.6) translateX(20px)}}
  @keyframes stamp{0%{opacity:0;transform:scale(3) rotate(-6deg);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
  @keyframes neon{0%,18%,22%,25%,53%,57%,100%{filter:drop-shadow(0 0 0 transparent) brightness(1)}
    20%,24%,55%{filter:drop-shadow(0 0 18px #ff3b3b) brightness(1.4)}}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="fill"></div>

<div id="stage" class="play">
  <!-- background -->
  <div class="beams"></div>
  <svg class="eiffel" viewBox="0 0 200 520" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <pattern id="lat" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <path d="M0 0H10M0 0V10" stroke="#9cc0ff" stroke-width="1.2" opacity=".55"/>
      </pattern>
    </defs>
    <path d="M100 0 L103 38 L107 38 L111 118 L117 118 L121 128 L115 130 L128 228 L139 228 L143 243 L133 245 L168 415 L192 520 L150 520 Q100 410 50 520 L8 520 L32 415 L67 245 L57 243 L61 228 L72 228 L85 130 L79 128 L83 118 L89 118 L93 38 L97 38 Z"
      fill="url(#lat)" stroke="#a8c8ff" stroke-width="2"/>
  </svg>
  <div class="halftone"></div>
  <svg class="cracks" viewBox="0 0 1080 1920" aria-hidden="true">
    <path d="M0 40 L60 70 L90 40 L150 95 L200 80 M90 40 L110 0"/>
    <path class="gl" d="M10 120 L130 210"/>
    <path d="M1080 230 L1020 260 L990 310 L940 330 M990 310 L1000 360"/>
    <path d="M1080 1500 L1030 1480 L1000 1530 L950 1520 M1000 1530 L990 1580"/>
    <path class="gl" d="M1080 1830 L1000 1920"/>
    <path class="gl" d="M960 0 L1080 70"/>
  </svg>
  <canvas id="fx" width="1080" height="1920"></canvas>

  <!-- title -->
  <h1 class="title">
    <div class="l1" data-split>COMPUNEȚI TACOS-UL</div>
    <div class="l2" data-split>ÎN CÂȚIVA PAȘI SIMPLI</div>
  </h1>

  <!-- prices -->
  <div class="cards">
    <div class="card" style="--i:0">
      <div class="kind">TACOS</div>
      <div class="size"><b>M</b></div>
      <div class="box"><div class="shine"></div>
        <div class="info">1 Fel de<br>CARNE<small>320gr.</small></div>
        <div class="price"><span class="num" data-v="30">30</span><span class="lei">lei</span></div>
      </div>
    </div>
    <div class="card" style="--i:1">
      <div class="kind">TACOS</div>
      <div class="size"><b>L</b></div>
      <div class="box"><div class="shine"></div>
        <div class="info">2 Feluri de<br>CARNE<small>420gr.</small></div>
        <div class="price"><span class="num" data-v="39">39</span><span class="lei">lei</span></div>
      </div>
    </div>
    <div class="card" style="--i:2">
      <div class="kind">TACOS</div>
      <div class="size"><b>XL</b></div>
      <div class="box"><div class="shine"></div>
        <div class="info">3 Feluri de<br>CARNE<small>650gr.</small></div>
        <div class="price"><span class="num" data-v="48">48</span><span class="lei">lei</span></div>
      </div>
    </div>
    <div class="card bol" style="--i:3">
      <div class="kind">&nbsp;</div>
      <div class="size"><b>BOL</b></div>
      <div class="box"><div class="shine"></div>
        <div class="info">1 Fel de<br>CARNE<small>360gr.</small></div>
        <div class="price"><span class="num" data-v="35">35</span><span class="lei">lei</span></div>
      </div>
    </div>
  </div>

  <!-- right panel -->
  <div class="panel">
    <div class="badge"><div class="ring2"></div><div class="ring"></div><div class="core"><span>1</span></div></div>
    <div class="step">Alege Baza</div>

    <div class="food tacos">
      <div class="burst"></div><div class="glow"></div>
      <div class="float">
        <span class="steam" style="left:30%;animation-delay:0s"></span>
        <span class="steam" style="left:48%;animation-delay:1.3s"></span>
        <span class="steam" style="left:64%;animation-delay:2.6s"></span>
        <img src="assets/tacos.png" alt="Tacos">
      </div>
      <div class="shadow"></div>
    </div>

    <div class="banner">
      <div><span>TOATE TACOS-URILE CONȚIN</span></div>
      <div class="hl"><span>CARTOFI PRĂJIȚI ȘI</span></div>
      <div class="hl"><span>SOSUL FROMAGERRE</span></div>
    </div>

    <div class="food bowl">
      <div class="burst"></div><div class="glow"></div>
      <div class="float">
        <span class="steam" style="left:35%;bottom:70%;animation-delay:.6s"></span>
        <span class="steam" style="left:58%;bottom:70%;animation-delay:2s"></span>
        <img src="assets/bol.png" alt="Bol">
      </div>
      <div class="shadow"></div>
    </div>
  </div>

  <div class="vignette"></div>
  <div class="sweep"></div>
  <div class="flash"></div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');

  /* --- fit 1080x1920 stage to any screen --- */
  function fit(){
    const s = Math.min(innerWidth / 1080, innerHeight / 1920);
    stage.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* --- split title letters --- */
  let idx = 0;
  document.querySelectorAll('[data-split]').forEach(el => {
    const txt = el.textContent; el.textContent = '';
    for (const c of txt) {
      const s = document.createElement('span');
      s.className = 'ch' + (c === ' ' ? ' sp' : '');
      s.textContent = c === ' ' ? ' ' : c;
      s.style.setProperty('--d', idx++);
      el.appendChild(s);
    }
  });

  /* --- price count-up --- */
  function countUp(){
    document.querySelectorAll('.price .num').forEach((el, i) => {
      const target = +el.dataset.v, start = performance.now() + 1700 + i * 220, dur = 1100;
      el.textContent = '0';
      const tick = now => {
        const t = Math.min(1, Math.max(0, (now - start) / dur));
        el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
        if (t < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  /* --- spotlight cycling through cards --- */
  const cards = [...document.querySelectorAll('.card')];
  let spot = -1, spotTimer;
  function startSpot(){
    clearInterval(spotTimer);
    cards.forEach(c => c.classList.remove('active'));
    spot = -1;
    spotTimer = setInterval(() => {
      cards.forEach(c => c.classList.remove('active'));
      spot = (spot + 1) % cards.length;
      cards[spot].classList.add('active');
    }, 3000);
  }

  /* --- replay the full intro periodically --- */
  const LOOP_MS = 60000;
  function replay(){
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.add('play');
    countUp(); startSpot();
    fireworks();
  }
  countUp();
  setTimeout(startSpot, 3500);
  setInterval(replay, LOOP_MS);

  /* --- particles: rising embers + sparkles + bursts --- */
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  const P = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  function ember(){
    return { x: rand(0, 1080), y: rand(1920, 2100), vx: rand(-.3, .3), vy: rand(-2.2, -.7),
      r: rand(1.2, 4), life: 1, decay: rand(.0012, .004),
      hue: Math.random() < .75 ? rand(28, 48) : rand(205, 220), tw: rand(0, 6.28) };
  }
  for (let i = 0; i < 110; i++) { const e = ember(); e.y = rand(0, 1920); P.push(e); }

  const B = [];
  function fireworks(){
    const spots = [[760, 650], [760, 1350], [540, 230]];
    spots.forEach(([x, y], k) => setTimeout(() => burst(x, y), 2600 + k * 900));
  }
  function burst(x, y){
    for (let i = 0; i < 70; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(2, 9);
      B.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue: rand(30, 55), r: rand(1.5, 3.5) });
    }
  }
  fireworks();
  setInterval(() => burst(rand(560, 980), rand(500, 1500)), 7000);

  function frame(t){
    ctx.clearRect(0, 0, 1080, 1920);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      p.x += p.vx + Math.sin(t / 900 + p.tw) * .3; p.y += p.vy; p.life -= p.decay;
      if (p.y < -20 || p.life <= 0) { P[i] = ember(); continue; }
      const a = p.life * (.5 + .5 * Math.sin(t / 200 + p.tw));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, `hsla(${p.hue},100%,70%,${a})`);
      g.addColorStop(1, `hsla(${p.hue},100%,50%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 7); ctx.fill();
    }
    for (let i = B.length - 1; i >= 0; i--) {
      const b = B[i];
      b.x += b.vx; b.y += b.vy; b.vx *= .96; b.vy = b.vy * .96 + .08; b.life -= .016;
      if (b.life <= 0) { B.splice(i, 1); continue; }
      ctx.strokeStyle = `hsla(${b.hue},100%,65%,${b.life})`; ctx.lineWidth = b.r;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 3, b.y - b.vy * 3); ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* --- click / key = fullscreen (for the TV) --- */
  const fs = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); };
  addEventListener('click', fs); addEventListener('keydown', fs);
})();
</script>
